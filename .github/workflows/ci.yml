# Every push and pull request: lint, typecheck, the unit tests, and a
# production build. No credentials needed — nothing here calls Lithos.
# Node 20 and 22, because the README and the handoff email promise "Node 20 or
# later".
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The API types are generated from openapi/lithos-v1.yaml; fail if they've drifted.
      - run: npm run api:types && git diff --exit-code src/lib/lithos/openapi.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
