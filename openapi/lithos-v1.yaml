- name: quick-start
  description: |-
    Get from zero to a working API request in under five minutes.

    ## Before you start

    You need two things to call the Lithos API:

    - A **`client_id`** — looks like `client_01HX9JCKQA3M5T2BN8VFGJ7P3R`
    - A matching **`client_secret`** — an opaque string

    If you don't have credentials yet, ask your Lithos onboarding contact. Treat the client secret like a password — never commit it, never put it in client-side code.

    All examples below run against sandbox (`https://api.sandbox.lithoshealth.com`). Sandbox returns realistic-shape data and never reaches a real patient, prescriber, or pharmacy.

    ## 1. Get an access token

    Exchange your credentials for an access token:

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/oauth2/token \
      -X POST \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "grant_type=client_credentials" \
      -d "client_id=REPLACE_ME" \
      -d "client_secret=REPLACE_ME"
    ```

    Successful response:

    ```json
    {
      "access_token": "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...",
      "token_type": "bearer",
      "expires_in": 3600
    }
    ```

    `expires_in` is the token's lifetime in seconds at the time of issuance. Tokens are short-lived — repeat this exchange before the lifetime elapses to mint a fresh one.

    Use the `access_token` in every subsequent request as `Authorization: Bearer <access_token>`.

    ## 2. Create your first patient

    Patients are the root resource for every other interaction — encounters, prescriptions, refills. Create one now:

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/patients \
      -X POST \
      -H "Authorization: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..." \
      -H "Content-Type: application/json" \
      -d '{
        "external_id": "user_2718281828",
        "first_name": "Avery",
        "last_name": "Chen",
        "date_of_birth": "1989-04-12",
        "sex": "female",
        "address": {
          "line1": "1242 Market St",
          "line2": "Apt 5B",
          "city": "San Francisco",
          "state": "CA",
          "postal_code": "94103"
        },
        "email": "avery.chen@example.com",
        "phone": "+14155550143",
        "telehealth_consented_at": "2026-04-29T17:42:00Z",
        "identity_verified_at": "2026-04-29T17:42:00Z",
        "enrolled_in_government_insurance": false
      }'
    ```

    `telehealth_consented_at` and `identity_verified_at` are the timestamps the patient affirmed telehealth consent and you verified their identity; both are required. `enrolled_in_government_insurance` is a required boolean attestation (Medicaid / Medicare / Tricare).

    Successful response (`200 OK`):

    ```json
    {
      "id": "pat_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ",
      "external_id": "user_2718281828",
      "first_name": "Avery",
      "last_name": "Chen",
      "sex": "female",
      "email": "avery.chen@example.com",
      "phone": "+14155550143",
      "enrolled_in_government_insurance": false,
      "height_cm": null,
      "time_zone": "America/Los_Angeles",
      "date_of_birth": "1989-04-12",
      "telehealth_consented_at": "2026-04-29T17:42:00Z",
      "identity_verified_at": "2026-04-29T17:42:00Z",
      "created_at": "2026-04-29T17:42:18Z",
      "updated_at": "2026-04-29T17:42:18Z",
      "address": {
        "line1": "1242 Market St",
        "line2": "Apt 5B",
        "city": "San Francisco",
        "state": "CA",
        "postal_code": "94103"
      },
      "assigned_clinician": null
    }
    ```

    Two identifiers are returned. Use them for different purposes:

    - **`id`** — the Lithos identifier (`pat_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ`). Opaque, immutable, returned in every response, and the value you pass back to Lithos in every subsequent call. Sandbox IDs always include the `_test_` segment so they're easy to spot in logs.
    - **`external_id`** — your own identifier for this patient. Optional, but if you set it, Lithos stores it immutably and lets you reconcile records with your system. It must be unique within your organization — reusing one that already belongs to another patient returns a `422 patient.external_id_in_use` error.

    ## 3. Retrieve the patient

    Confirm the round-trip works:

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/patients/pat_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ \
      -H "Authorization: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
    ```

    You'll get the same record back. That's a successful round-trip against the Lithos API.

    ## 4. Create a care plan

    A **care plan** organizes one patient's treatment in one clinical area (e.g., weight loss). It groups the initial encounter, every follow-up, and every treatment that comes from them. A patient can have several plans at once, one per clinical area. Plans start in `pending_review`, move to `in_review` when a clinician picks up the first encounter, and then to `active` or `ineligible` when the clinician signs off on it.

    Every encounter has to belong to one. Create one for Avery now:

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/care_plans \
      -X POST \
      -H "Authorization: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..." \
      -H "Content-Type: application/json" \
      -d '{
        "patient_id": "pat_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ",
        "category": "weight_management"
      }'
    ```

    `category` scopes the plan to one clinical area; pass one your organization carries (the `categories` on the catalog treatments in step 5). Every treatment you add must be offered in it.

    Successful response:

    ```json
    {
      "id": "cpl_test_01HXCP1A2B3C4D5E6F7G8H9JKM",
      "patient_id": "pat_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ",
      "category": "weight_management",
      "status": "pending_review",
      "clinician_notes": null,
      "clinician": null,
      "treatments": [],
      "created_at": "2026-04-29T18:00:00Z",
      "updated_at": "2026-04-29T18:00:00Z",
      "active_at": null,
      "ineligible_at": null
    }
    ```

    ## 5. Find a catalog_treatment_id

    `requested_treatments[]` items on an encounter take a `catalog_treatment_id`. List the catalog treatments available to your organization to pick one:

    ```bash
    curl 'https://api.sandbox.lithoshealth.com/v1/catalog_treatments?status=active' \
      -H "Authorization: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
    ```

    Pick an item whose `categories` include `weight_management`, the plan's category, and take its `id`. The `id` is a slug such as `wegovy-auto-injector`, and it's the `catalog_treatment_id` you'll use in step 6. Each item also carries the underlying medication's `brand_name`, `form`, and `presentation` inline, plus the available `dosages[]`; the clinician picks the dosage at sign-off.

    See [Catalog Treatments](#tag/CatalogTreatments) for the filters and the full response shape.

    ## 6. Create the initial encounter

    Submit the patient's intake on the plan. You pass the requested treatments and the intake you collected as `intake_form`:

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/encounters \
      -X POST \
      -H "Authorization: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..." \
      -H "Content-Type: application/json" \
      -d '{
        "patient_id": "pat_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ",
        "care_plan_id": "cpl_test_01HXCP1A2B3C4D5E6F7G8H9JKM",
        "intake_form": {
          "data": {
            "height_cm": 165,
            "weight_kg": 95,
            "mtc_men2_personal": false,
            "mtc_men2_family": false,
            "thyroid_cancer": false,
            "pancreatitis_pancreatic_ca": false,
            "hepatitis_liver_disease": false,
            "uncontrolled_diabetes": false,
            "t1d_or_insulin_secretagogue": false,
            "kidney_disease": false,
            "retinopathy": false,
            "triglycerides_over_500": false,
            "gallbladder": false,
            "gastroparesis_sbo": false,
            "recent_bariatric_losing": false,
            "eating_disorder": false,
            "recent_cardiac_event": false,
            "unmanaged_mental_illness": false,
            "pregnancy": false
          }
        },
        "requested_treatments": [
          { "action": "add", "catalog_treatment_id": "wegovy-auto-injector" }
        ]
      }'
    ```

    Replace `wegovy-auto-injector` with the `id` you took in step 5. `intake_form.data` must match the intake schema for the plan's category and encounter type. In this example, that's `weight_management` and `initial` (see [Intake Schemas](#tag/intake-schemas) for the full field shape).

    Key requirements:

    - Use metric measurements: `height_cm` and `weight_kg`.
    - Don't send `bmi`; the server calculates it.
    - Include all required contraindication questions as booleans.
    - A `true` contraindication answer won't block creation — it's flagged for clinician review.
    - `full_body_photo_upload_id` is optional. If you have the photo, send it through the [Uploads](#tag/Uploads) API first and put the returned `id` in that field.
    - Invalid or missing fields return `422 intake_form.schema_invalid`. Check `source.pointer` to identify the affected field.

    A successful response returns the encounter at `status: pending_review`. A clinician picks it up from there.

    ## 7. What happens next

    Lithos works the encounter in the background. As a clinician picks it up and decides, your webhook endpoint will get this sequence:

    | Event | Meaning |
    |---|---|
    | `encounter.in_review` | A clinician picked it up. Read `Encounter.clinician` to see who. |
    | `encounter.completed` | The clinician signed off. On `Encounter.requested_treatments`, each line's `status` is now `approved` or `rejected`, with the treatment(s) it produced linked in `treatments[]`. The plan-level outcome is on the encounter's `care_plan` object (`status` + `ineligibility_reason_code` + `clinician_notes`). Orders are populated. |
    | `care_plan.active` | The plan moved to `active` — the clinician marked it eligible at sign-off. |
    | `order.created` → `order.processing` → `order.placed` → `order.completed` | The order's progress toward the patient. `order.processing` doesn't always fire — some orders go straight to `placed`. |

    Webhook payloads only carry IDs. To act on one, call the matching `GET` endpoint. For refills going forward: call `GET /v1/care_plans/{id}` and watch `treatments[].refill_status`. When it flips to `eligible`, prompt the patient and submit a `follow_up` encounter with `{ "action": "refill", "treatment_id": "thr_..." }` — the `treatment_id` is the line's own id from `treatments[].treatment_id`.

    See the [CarePlans](#tag/CarePlans), [Encounters](#tag/Encounters), and [Webhooks](#tag/Webhooks) references for the full API — including how to read the `requested_treatments` shape on a completed encounter.

    ## Troubleshooting your first call

    | Symptom | Cause | Fix |
    |---|---|---|
    | `401` from the token endpoint, body `{"error": "invalid_client", ...}` | Wrong or missing `client_id` or `client_secret` | Re-check the values. The secret is case-sensitive and has no whitespace. The token endpoint returns standard OAuth 2.0 errors (`error`, `error_description`), not the `errors` array other endpoints use. |
    | `400` from the token endpoint, body `{"error": "unsupported_grant_type", ...}` | `grant_type` isn't `client_credentials` | Send `grant_type=client_credentials`. |
    | `401` on an API call with code `auth.missing_token` | No `Authorization: Bearer …` header sent | Include the access token from step 1 in every request. |
    | `401` on an API call with code `auth.invalid_token` | Malformed JWT, wrong issuer, or wrong audience | Mint a fresh token via step 1. If the error persists, your `client_id` may be provisioned for a different environment. |
    | `401` on an API call with code `auth.expired_token` | The access token has expired | Request a new token by repeating the client credentials exchange. Cache the token and re-issue before its `expires_in` elapses. |
    | `401` on an API call with code `auth.org_not_provisioned` | Your organization isn't fully set up in this environment | Contact your Lithos onboarding contact — your organization isn't provisioned on the Lithos side. |
    | `422` with code `patient.consent_required` | `telehealth_consented_at` was missing | The patient must affirm telehealth consent before you can create the record. Send the timestamp of the actual affirmation in `telehealth_consented_at`. |
    | `422` with code `patient.identity_verification_required` | `identity_verified_at` was missing | Verify the patient's identity at intake and send the timestamp of that verification in `identity_verified_at`. |
    | `422` with code `validation.failed` | A required field is missing, a value doesn't match its format (E.164 phone, ISO-8601 date, two-letter state), or the request has a field or query parameter the endpoint doesn't list | Inspect each entry in the response's `errors` array. `source.pointer` names the offending body field; `source.parameter` names the offending query parameter. |
    | `422 validation.failed` at `/email` on `POST /v1/patients` | The email already belongs to another patient in your organization (compared ignoring case) | Each patient needs their own email. If it's the same person, reuse the existing patient. |
    | `422 patient.external_id_in_use` on `POST /v1/patients` | The `external_id` already belongs to a different patient in your organization | The conflicting Lithos `id` is in `errors[0].meta.existing_patient_id`. Reconcile against it, then either reuse that patient or pick a new `external_id`. If you are retrying a create whose response you never received, the first attempt succeeded: that `id` is your patient. |
    | `422 encounter.initial_already_exists` on `POST /v1/encounters` | The plan already has a non-canceled initial encounter (one per plan) | Use the existing encounter, or — if it's still `pending_review` — cancel it and resubmit. For a separate clinical area, create a new CarePlan. |
    | `422 care_plan.not_encounterable` on `POST /v1/encounters` | The plan isn't in a state that accepts an encounter — neither `pending_review` (takes the first encounter) nor `active` (takes follow-ups). It may be `in_review` or `ineligible`. | Check `status` first. If `in_review`, wait for the `care_plan.active` webhook. If `ineligible`, create a new CarePlan for this patient. |
    | `422 encounter.no_licensed_availability` on `POST /v1/encounters` | No Lithos clinician licensed in the patient's state can take the encounter right now, so nobody could review it. Nothing was created. | Check that the patient's address is current, and update it if not. If it is right, try again later. If it keeps happening, contact your Lithos onboarding contact. |
    | `422 intake_form.schema_invalid` on `POST /v1/encounters` | `intake_form.data` doesn't match the schema for the plan's category and encounter type (wrong type, out-of-range, or a missing required key) | Check it against [Intake Schemas](#tag/intake-schemas) for that combination; `source.pointer` names the offending field under `/intake_form/data`. |
    | `422 encounter.treatment_not_refillable` on `POST /v1/encounters` (follow_up) | A `refill` or `switch` item names a `treatment_id` whose line is not active on the plan | Re-fetch the plan; pass the `treatment_id` of an `active` line from `treatments[]` for these actions. |
    | `422 encounter.not_pending_review` on `POST /v1/encounters/{id}/cancel` | A clinician already picked up the encounter — `cancel` only works while `status` is `pending_review` | Check `Encounter.status`. If it's past `pending_review`, ops is handling it; reach out to your Lithos contact if you really need to pull the case. |

    If something else breaks, contact your Lithos onboarding contact with the request URL, request body, and an approximate timestamp so we can pull the exact request from logs.
  x-displayName: Quick Start
- name: messaging-guide
  description: |-
    This guide covers how to keep a patient in the loop: relay a clinical
    question between the patient and their care team, deliver the message a
    clinician leaves when an encounter completes, and remind the patient
    when a treatment is due for a refill. Each is driven by a webhook, so
    see [Webhooks](#tag/Webhooks) for delivery and signature checks; the
    references below carry the field-level detail.

    ## Inquiries

    An inquiry is a threaded conversation between a patient and their care
    team, scoped to one topic. Keep it to clinical questions — about a
    treatment, a side effect, their care — and triage first: route billing,
    shipping, and account questions to your own support channel.

    Open one when a patient has a clinical question with
    `POST /v1/patients/{patient_id}/inquiries`; the first message is the
    patient's. The care team opens one in the other direction when they
    need more from the patient, for example mid-review. The first message
    is then theirs, and `awaiting` is `patient`.

    Either way, you relay the thread. On `inquiry.created` or
    `inquiry.message_added`, fetch the inquiry and read `awaiting`:
    `patient` means there's a new care-team message to deliver, `staff`
    means the latest message is one you sent. Post the patient's reply with
    `POST /v1/inquiries/{inquiry_id}/messages`. Full reference:
    [Inquiries](#tag/Inquiries).

    ## The message at completion

    When a clinician completes an encounter, read the `patient_message` off
    the encounter after `encounter.completed`: it carries their
    instructions plus any files to send along, like a care handout. Render
    the Markdown `body` in your own channel, and deliver each file in
    `attachments[]` — a [Document](#tag/Documents) with a short-lived
    signed `download`. See [Encounters](#tag/Encounters).

    ## Refill reminders

    A treatment comes due for a refill weeks after it ships. When that
    window opens, `care_plan.refill_due` fires — read the plan and prompt
    the patient to renew the `treatments[]` entries now reading
    `refill_status: eligible`. Submitting the refill is its own flow,
    covered in [Refills](#tag/refills-guide).
