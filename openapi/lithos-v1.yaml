    InquiryMessageCreate:
      type: object
      required:
      - body
      additionalProperties: false
      description: Relay a patient reply into an open inquiry.
      properties:
        body:
          type: string
          maxLength: 10000
          example: Thanks — one more question.
        attachments:
          type: array
          description: Files to attach to the message, by id. Each id is either a
            one-time upload to redeem (`upl_…`, from `POST /v1/uploads`) or an existing
            patient document to reattach as-is (`doc_…`). Uploads are redeemed into
            patient documents on attach, so an upload id is single-use. An upload
            attached this way becomes a patient Document with category `message_attachment`,
            listed with the patient's other documents; a reattached document keeps
            its category. On read, every attachment comes back as a full Document.
          items:
            type: string
            pattern: "^(upl|doc)_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
          example:
          - upl_test_01HXNP1A2B3C4D5E6F7G8H9JKM
          - doc_test_01HXDC1A2B3C4D5E6F7G8H9JKM
    InquiryCreate:
      type: object
      required:
      - subject
      - message
      additionalProperties: false
      description: Open an inquiry on the patient's behalf with a first (patient-voiced)
        message.
      properties:
        subject:
          type: string
          maxLength: 255
          example: Injection site question
        references:
          type: array
          items:
            "$ref": "#/components/schemas/InquiryReference"
          description: What the inquiry is about — set once when it opens.
        message:
          type: object
          required:
          - body
          additionalProperties: false
          properties:
            body:
              type: string
              maxLength: 10000
              example: Can I rotate injection sites?
            attachments:
              type: array
              description: Files to attach to the message, by id. Each id is either
                a one-time upload to redeem (`upl_…`, from `POST /v1/uploads`) or
                an existing patient document to reattach as-is (`doc_…`). Uploads
                are redeemed into patient documents on attach, so an upload id is
                single-use. An upload attached this way becomes a patient Document
                with category `message_attachment`, listed with the patient's other
                documents; a reattached document keeps its category. On read, every
                attachment comes back as a full Document.
              items:
                type: string
                pattern: "^(upl|doc)_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
              example:
              - upl_test_01HXNP1A2B3C4D5E6F7G8H9JKM
              - doc_test_01HXDC1A2B3C4D5E6F7G8H9JKM
