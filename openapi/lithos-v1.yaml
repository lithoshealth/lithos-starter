- name: documents-guide
  description: |-
    Documents are how you ship files into a patient record over the API — ID photos, consent PDFs, lab results, clinical photos, and similar. Uploads happen in two steps: your client asks Lithos for a short-lived signed URL, then `PUT`s the bytes straight to that URL. You upload at full network speed without an API request held open for the transfer, so larger files don't bump into request timeouts and your servers aren't tied up proxying bytes.

    ## Document Upload Flow

    ```
    Your client                 Lithos API                  Object storage
        │                           │                            │
        │   POST /v1/uploads        │                            │
        │   (filename, type, size,  │                            │
        │    base64 MD5 checksum)   │                            │
        │ ────────────────────────► │                            │
        │                           │                            │
        │   { id: upl_…,            │                            │
        │     upload_url, headers,  │                            │
        │     expires_at,           │                            │
        │     upload_url_expires_at}│                            │
        │ ◄──────────────────────── │                            │
        │                           │                            │
        │   PUT <upload_url>        │                            │
        │   <file bytes>            │                            │
        │ ───────────────────────────────────────────────────────►
        │                           │                            │
        │   200 OK                  │                            │
        │ ◄───────────────────────────────────────────────────────
        │                           │                            │
        │   POST /v1/patients/{id}  │                            │
        │        /documents         │                            │
        │   (upload_id, category)   │                            │
        │ ────────────────────────► │                            │
        │                           │                            │
        │   { id: doc_…, … }        │                            │
        │ ◄──────────────────────── │                            │
    ```

    ### Reserve an upload

    `POST /v1/uploads` with the file metadata. Compute the MD5 client-side, base64-encode it, and send it as `checksum`. Most languages have a streaming MD5 implementation that doesn't require loading the whole file into memory — for browser clients, [SparkMD5](https://github.com/satazor/js-spark-md5) is the standard choice.

    ```bash
    curl -X POST https://api.sandbox.lithoshealth.com/v1/uploads \
      -H "Authorization: Bearer $LITHOS_TOKEN" \
      -H "Content-Type: application/json" \
      -d '{
        "filename": "cbc-2026-04-20.pdf",
        "content_type": "application/pdf",
        "byte_size": 412800,
        "checksum": "wvjh2ae0tNZjyCs1eX8DpA=="
      }'
    ```

    The response carries the presigned URL plus the headers to send on the PUT — `Content-MD5` binds, `Content-Type` and `Content-Disposition` are recommendations (see [Uploads](#tag/Uploads)):

    ```json
    {
      "id": "upl_test_01HXNP1A2B3C4D5E6F7G8H9JKM",
      "object": "upload",
      "upload_url": "https://storage.googleapis.com/lithos-uploads/...",
      "upload_headers": {
        "Content-MD5": "wvjh2ae0tNZjyCs1eX8DpA==",
        "Content-Disposition": "inline; filename=\"cbc-2026-04-20.pdf\"; filename*=UTF-8''cbc-2026-04-20.pdf",
        "Content-Type": "application/pdf"
      },
      "expires_at": "2026-05-07T18:00:00Z",
      "upload_url_expires_at": "2026-04-30T19:00:00Z"
    }
    ```

    Two deadlines, both in the response. `upload_url_expires_at` is how long
    `upload_url` accepts bytes; `expires_at` is how long the id stays redeemable,
    and it is the longer of the two. PUT the bytes as soon as you have the file,
    then redeem before `expires_at`. Read both timestamps rather than hardcoding a
    duration in your client.

    ### PUT the file bytes

    Send the file directly to `upload_url` with the supplied `upload_headers`. **Do not send your Lithos bearer token on this request** — the presigned URL is the authorization for this hop.

    ```bash
    curl -X PUT "$UPLOAD_URL" \
      -H "Content-MD5: wvjh2ae0tNZjyCs1eX8DpA==" \
      -H "Content-Disposition: inline; filename=\"cbc-2026-04-20.pdf\"; filename*=UTF-8''cbc-2026-04-20.pdf" \
      -H "Content-Type: application/pdf" \
      --data-binary @cbc-2026-04-20.pdf
    ```

    Browser clients use `fetch` the same way:

    ```js
    await fetch(upload.upload_url, {
      method: "PUT",
      headers: upload.upload_headers,
      body: file,
    });
    ```

    A 200 from object storage means the bytes are durably stored and the upload is ready to redeem.

    ### Attach the upload to a patient

    `POST /v1/patients/{patient_id}/documents` with the `upload_id` and a `category`. The patient is in the URL — the document is created on that patient.

    ```bash
    curl -X POST https://api.sandbox.lithoshealth.com/v1/patients/pat_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ/documents \
      -H "Authorization: Bearer $LITHOS_TOKEN" \
      -H "Content-Type: application/json" \
      -d '{
        "upload_id": "upl_test_01HXNP1A2B3C4D5E6F7G8H9JKM",
        "category": "lab_result",
        "description": "CBC panel results, 2026-04-20."
      }'
    ```

    Lithos verifies the bytes match the declared `checksum`, attaches the file to the patient, and returns the durable Document with a fresh `download` envelope:

    ```json
    {
      "id": "doc_test_01HXDC1A2B3C4D5E6F7G8H9JKM",
      "object": "document",
      "patient_id": "pat_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ",
      "category": "lab_result",
      "download": {
        "url": "https://files.lithoshealth.com/documents/...",
        "method": "GET",
        "expires_at": "2026-04-30T19:15:00Z"
      },
      ...
    }
    ```

    Each `upload_id` is single-use. A second `POST` against the same `upload_id` returns `409 upload.already_used` with the existing document's ID in `meta.existing_document_id`.

    ## Reading documents

    `GET /v1/documents/{document_id}` returns the document metadata and a `download.url`.

    `download.url` needs no Lithos token, so a browser opens it directly. It stops working at `download.expires_at`. Read the document again for a new one.

    `GET /v1/documents/{document_id}/download` takes your access token and redirects to the file. The redirect carries its own authorization, so don't send your Lithos token on to the storage host.

    ## Errors

    The full error vocabulary for documents:

    | HTTP | `code` | Meaning |
    |---|---|---|
    | 413 | `upload.too_large` | `byte_size` exceeds the current maximum upload size. Ask your Lithos contact if larger uploads matter for your integration. |
    | 415 | `upload.unsupported_type` | `content_type` rejected by the current allowlist. Ask your Lithos contact if a specific type matters for your integration. |
    | 422 | `upload.invalid_checksum` | Uploaded bytes don't match the declared `checksum`, or no bytes have reached `upload_url` yet. |
    | 422 | `upload.size_mismatch` | The uploaded bytes aren't the `byte_size` you declared. Lithos discards them; reserve a new upload with the exact size and PUT again. |
    | 410 | `upload.expired` | `expires_at` passed before the upload was redeemed. |
    | 410 | `upload.url_expired` | No bytes reached `upload_url` before `upload_url_expires_at`. Reserve a new upload and PUT again. |
    | 409 | `upload.already_used` | `upload_id` was already redeemed; `meta.existing_document_id` carries the existing document. |
    | 422 | `upload.not_found` | `upload_id` doesn't exist in your organization. |
    | 404 | `resource.not_found` | The `patient_id` (or `document_id`) in the URL doesn't exist or isn't visible to your organization. |

    <!--
    Staleness flags (source-of-truth migration, step 4):
    - The tag slug is `documents-guide` (with x-displayName "Documents Guide")
      to disambiguate from the `Documents` resource tag. The H1 inside the
      prose stays "Documents" so the rendered heading matches what partners
      expect; Scalar's sidebar shows the displayName.
    -->
  x-displayName: Documents Guide
- name: changelog
  description: |-
    Contract changes are tracked here as a release log, keyed by the calendar date the change shipped.

    ## Versioning rules

    Lithos uses one version axis: the URL prefix.

    - **Non-breaking changes** (new optional fields, new endpoints, new enum values, new event types, additional response metadata) ship in place under `/v1/...`. Your parser should ignore unknown fields so you keep working without a code change. New entries appear in this changelog at the date the change shipped.
    - **Breaking changes** (removed fields, renamed fields, narrowed types, behavior changes that existing integrations would notice) ship as a new major URL prefix — `/v2/...` — alongside `/v1/...` for a deprecation window. Breaking changes never amend a `/v1` payload.

    ## 2026-09-30 — Find the deliveries of an event or a resource

    **Additive**

    - `GET /v1/webhook_deliveries` takes two new optional filters. `event_id` returns the delivery of one event: the event body's `id`, which is also the `X-Lithos-Event-Id` header. `resource_id` returns the deliveries of every event about one resource.
    - Both combine with the other filters. An `event_id` that is not an `evt_` id returns `422 validation.failed`. An id that matches nothing returns an empty page.

    ## 2026-09-30 — Refill and switch examples match the follow-up intake

    **Docs correction — no change to the API**

    - The [Refills](#tag/refills-guide) guide's approved-refill response is now labelled as an excerpt of an `Encounter`, not the whole object. For the full shape, see the **Approved — refill** example on [Retrieve an encounter](#tag/Encounters/operation/getEncounter).
    - The refill and switch examples on [Retrieve an encounter](#tag/Encounters/operation/getEncounter) and `POST /v1/sandbox/encounters/{encounter_id}/complete` now show a follow-up intake in `intake_form.data`: `current_medication`, `current_dose`, `weeks_at_dose`, `adherence`, `weight_kg` and `side_effects`. Before, they showed initial-intake fields such as `allergies` and `weight_lbs`, which a follow-up never sends.
    - An earlier version of the guide's refill request sent `current_weight_lbs`, `adherence: "as_prescribed"`, a string `side_effects` and `continue_treatment`. A refill sent that way returns `422 intake_form.schema_invalid`. Send the fields in the guide's current example instead. [Intake Schemas](#tag/intake-schemas) lists them for `weight_management` / `follow_up`.

    ## 2026-09-29 — Sandbox lab requisitions count their 90 days on the test clock

    **Sandbox only**

    - While your organization has a test clock, a lab requisition issued in that time gets a `valid_through` 90 days after the clock's date, not the real date. Its PDF prints the clock's issue date and the same "Valid through" date. The requisition's `created_at`, `updated_at`, `approved_at`, `canceled_at` and `expired_at` stay on real time.
    - Before, `valid_through` counted from the real date, but each advance judged expiry on the clock. With a clock more than 90 days ahead, a requisition issued after the advance became `expired` on the next advance. A clock behind real time held expiry back.
    - In production, and for an organization without a clock, `valid_through` is 90 days after the real issue date, as before. A requisition issued while a clock was set keeps its `valid_through` after you delete the clock, so it then expires when real time passes that date.

    ## 2026-09-29 — Encounters no clinician can take are refused

    **Stricter input**

    - `POST /v1/encounters` returns `422 encounter.no_licensed_availability` when no Lithos clinician licensed in the patient's state can take the encounter right now. The error points at `/patient_id`, and nothing is created. Before, the encounter was created and waited with no clinician able to review it.
    - Check that the patient's address is current. If it is, try again later. If it keeps happening, contact your Lithos onboarding contact.
    - A refused request stores nothing against its `Idempotency-Key`, so you can use the same key when you try again.

    ## 2026-09-28 — Sandbox orders stamp their status changes on the test clock

    **Sandbox only**

    - While your organization has a test clock, an order's `processing_at`, `placed_at`, `completed_at` and `canceled_at` are the clock's time when the order moved, not real time. The order's `created_at` and `updated_at`, and an event's `created_at` (`occurred_at` on a webhook delivery), stay on real time.
    - `refill_due_at` counts from `completed_at` or `placed_at`, so it now counts from the clock too. Before, the stamps were real time. With a clock further ahead than the refill interval, a treatment turned `eligible` as soon as its order was placed, and `care_plan.refill_due` fired on the next advance. A clock behind real time held the due date back.
    - Nothing changes in production, or for an organization that has never had a clock. An order stamped while a clock was set keeps those stamps after you delete the clock, so its `refill_due_at` then waits for real time to reach it.

    ## 2026-09-24 — The patient's time zone

    **Additive**

    - `Patient.time_zone` is the patient's US time zone, as an IANA name, for example `America/Denver`. The `PatientTimeZone` schema lists the zones, and more may be added. Lithos looks it up from `address.postal_code`, and looks it up again when the address changes. It is `null` for a ZIP code the lookup can't place.
    - `POST /v1/patients` and `PATCH /v1/patients/{patient_id}` accept an optional `time_zone`. A zone you send stays when the address changes, even if it is the one Lithos looked up. Send `null` to go back to the zone of the ZIP code. It must be one of the zones in `PatientTimeZone`, such as `America/Chicago`. Any other name returns `422 validation.failed`.

    ## 2026-09-23 — Retry a create safely with Idempotency-Key

    **Additive**

    - The public create endpoints now accept an optional `Idempotency-Key` header. Send the same key and body again after a lost response, and you get the same status and the same resource back, as it is now, with nothing created twice. The same key with a different body returns `409 idempotency_key.reused`.
    - Requests without the header behave exactly as before.
    - The Retrying requests guide lists the endpoints and the rules.

    ## 2026-09-22 — What the API does, checked against sandbox

    We called every public endpoint on sandbox and compared the answers with these docs. Most fixes are to the docs. The changes below are the ones your integration may notice.

    **Additive**

    - A [WebhookDelivery](#tag/Webhooks) now carries `event_id`. It is the same value as the envelope `id` and the `X-Lithos-Event-Id` header. Match log rows against the events you already processed, and rebuild an envelope you missed from `event_id`, `event_type`, `occurred_at`, `resource_id` and `data`.
    - `Patient.assigned_clinician` now returns the clinician the patient is with. It was always `null` before. It is set when the patient's first encounter is completed.
    - Care plans can be `canceled`. This happens when the plan's initial encounter is canceled after review started.

    **Stricter input**

    - Dates must start with a `YYYY-MM-DD` day that exists: `date_of_birth`, insurance `effective_from`, `effective_until` and `holder.date_of_birth`, and the intake `ldl_c_date`. Slash dates and written-out dates return `422 validation.failed`. Before, `04/12/1989` was read as 4 December 1989, and `2026-02-30` on an insurance date was stored as `null`.
    - Date-times must be ISO 8601 with `Z` or an offset, for example `2026-09-22T14:30:00Z`. This covers `telehealth_consented_at`, `identity_verified_at`, the test clock's `frozen_time` and `to_time`, and the `created_at` and `written_at` list filters. A bare date, a time with no zone, or free text now returns `422 validation.failed`.
    - Redeeming an upload checks the stored bytes against the `byte_size` you declared. A different size returns the new `422 upload.size_mismatch`, and the bytes are discarded.
    - An unknown key inside `message` on `POST /v1/patients/{patient_id}/inquiries` returns `422 validation.failed`. It used to be dropped without a word.
    - `GET /v1/lab_requisitions?status=requested` returns `422`. A requisition is never in that status when you can read it.

    **Fixes**

    - A `422 validation.failed` about a query parameter names it in `source.parameter` (`limit`, `cursor`, `created_at[gte]`), as the `Error` schema says. It used to come back as `source.pointer` (`/limit`). Body fields still use `source.pointer`.
    - `POST /v1/patients` with `"external_id": ""` stores no external id (`null`), the same as leaving the field out.
    - A cursor that is not one Lithos issued returns `422` on every list endpoint. Some of them returned `500`.
    - An encounter's `escalation_reason` is `null` once it leaves `escalated`.
    - Disabling a webhook endpoint ends every delivery still waiting on it at once, as `exhausted` with `last_error_class: endpoint_disabled`. That does not count as an attempt. While a retry is `delivering`, `last_response_code` and `last_error_class` are `null`.
    - `POST /v1/webhook_endpoints` with an `http://` URL says `must be an https:// URL`.
    - Sandbox: `resolve` or `close` on an inquiry that is already resolved or closed returns `422 inquiry.not_open`, not `500`. `escalate` works after `resume`. `complete` refuses a `requested_treatment_id` that is not on the encounter.

    **Removed from these docs**

    - Prior authorizations and the `prior_authorization.*` webhook events. Lithos does not record prior authorizations yet, so the list was always empty and the events never fired. The endpoints still answer.

    ## 2026-09-21 — A grid for moving a visit

    **Additive**

    - `GET /v1/appointments/{appointment_id}/reschedule_slots` returns the starts one booked visit may be moved to. Same shape as `GET /v1/appointment_slots`, same `from`/`to` and the same 14-day cap, and a `slot_token` per start.
    - The visit you are moving is left out of it. It is still `scheduled` while the patient chooses, so on the ordinary grid its own time — and, if you keep a turnaround, the starts after it — are missing from the very grid you are moving it onto. This endpoint offers them back. Everything else still counts: other visits, and starts other patients are holding.
    - **This replaces what the 2026-09-15 entry below says about rescheduling.** That entry told you to expect the starts right after a visit to be missing from the grid you reschedule it onto. Fetch them from this endpoint and they are there.
    - **Continuity of care decides whose times you see.** With the setting on and the patient already with a clinician, only that clinician's times are offered — and none at all when they have nothing free, rather than somebody else's. With the setting off, or for a patient who has no clinician yet, every eligible clinician is offered. Moving a visit never establishes or changes who a patient's clinician is.
    - **And the move is held to it too.** `POST /v1/appointments/{appointment_id}/reschedule` answers `422 clinician.not_preferred` for a hold on anybody but that clinician — including one taken from `GET /v1/appointment_slots`, which still offers the whole roster. Fetch the times for a move from the endpoint above and this cannot bite. First bookings, and rebookings after a cancellation or a no-show, are unaffected.
    - Hold a start with `POST /v1/slot_reservations` as before. The `slot_token` carries the visit it was issued to move, so there is nothing extra to send, and **the hold can only be spent on that move**. An ordinary booking, or a reschedule of a different visit, answers `422 slot_reservation.rescheduling_mismatch`.
    - The hold says so: `rescheduling_appointment_id` is on the `SlotReservation` response, naming the visit that hold may move, or `null` for an ordinary one — so a patient holding several starts at once can be told apart.
    - If the visit a hold was issued for stops being `scheduled` before you spend it, holding answers `409 appointment.not_scheduled` and any hold you already took has nothing left to move. Release it rather than waiting out `expires_at`.
    - `GET /v1/appointment_slots` is unchanged, and is still the endpoint for a first booking or a rebooking after a cancellation or a no-show.

    ## 2026-09-17 — The upload PUT no longer rejects your Content-Type

    **A fix**

    - `PUT`ting bytes to an upload's `upload_url` used to fail with a storage-level `403 SignatureDoesNotMatch` if the request carried a `Content-Type` header at all. Most HTTP clients add one for you (Ruby's `Net::HTTP` and `curl --data-binary` both send `application/x-www-form-urlencoded`), so the natural integration broke and the error said nothing useful.
    - `upload_headers` now also carries `Content-Type`, set to the type you declared on the reservation. It is a new key in that object — additive, but read the object rather than asserting on its exact key set.
    - Newly issued upload URLs accept the `PUT` whether you send `Content-Type`, omit it, or send a default of your own. Echoing all of `upload_headers` now works, which is what the reference has always told you to do.
    - `Content-MD5` is unchanged and still required: send it exactly as returned, with bytes that match it, or the `PUT` is rejected. The two deadlines are unchanged too.
    - Nothing you have to do. Clients that already worked — the ones that happened to send no `Content-Type` — keep working on the new URLs.

    ## 2026-09-17 — Sandbox `complete` picks the encounter up for you

    **No change to what you send or receive**

    - Signing an encounter off now requires a clinician to be holding it. That is a rule about Lithos clinicians, not about your integration: a review has to be claimed before it can be completed, so two clinicians can no longer both sign off the same encounter.
    - `POST /v1/sandbox/encounters/{encounter_id}/complete` therefore makes the pickup itself when nobody has claimed the encounter, and then signs off. Your request body, the response, and the webhooks are unchanged — one call in, one `encounter.completed` out, no `encounter.in_review` in between. You still never need to call `start_review` first, and calling it first still works.
    - The endpoint already did this for a responded escalation, which it picks back up before completing. The unclaimed encounter is the other place a real reviewer would have to make a pickup, and now the sandbox makes both.
    - Nothing here changes an encounter's statuses, the order of its webhooks, or any field on it. It is in this log because the sandbox's one-call sign-off is now a guarantee the endpoint keeps rather than something the review lifecycle happened to allow.

    ## 2026-09-17 — A slots request covers at most 14 days

    **A new limit**

    - `GET /v1/appointment_slots` now caps how wide a range one request may ask for. `from` to `to` may cover at most **14 days**; a wider range comes back `422 slot.range_too_wide` instead of an answer. Ask for a narrower range, then ask again from where the last one ended — no answer is truncated, so there is nothing to page through.
    - This turns a request that used to be answered into a `422`. It is not a breaking change under the rules above, because the slots endpoints are not generally available yet; they reach this changelog ahead of publication so the limit is on the record before anyone integrates against it.
    - The cap is a flat number of days, the same for every organization, so you can tell before sending whether a request is allowed. Your minimum notice and booking horizon still clip the range further, which is why a request inside the cap may come back with fewer days than you asked for.
    - **Your booking horizon now tops out at 14 days too.** It used to accept up to 180. The two are held on the same number, so whatever you set, a request starting at now reads the whole horizon in one call. (Start the range earlier than now and its far end stops short by as much, since the cap counts from your `from` and the horizon counts from now.) If yours was above 14 it has been moved to 14; nothing else about your settings changed.
    - 14 days is also the default booking horizon, so an organization that has never changed its appointment settings sees no difference at all.
    - Why it exists: the grid is built for the whole range you ask for, and a `slot_token` is minted for every start in it. A 180-day range measured at roughly 24,000 slots and 13 MB in a single response.

    ## 2026-09-16 — Starts are offered every five minutes

    **Additive**

    - How often `GET /v1/appointment_slots` offers a start no longer depends on how long a visit runs. It used to be the same number: starts came one visit length apart, so 15-minute visits meant 09:00, 09:15, 09:30 and nothing between. Starts are now offered every five minutes, whatever your visit length.
    - **This changes the grid for everyone on the day it ships, without you asking.** Expect roughly your visit length divided by five as the change in how many slots come back — a 15-minute visit returns about three times as many. Ask for a narrower range if that is more than you want to hold.
    - The starts overlap, and that is the point: each one still needs a full visit's length clear before it can be booked, so booking 09:00 takes 09:05 and 09:10 off the grid with it. Fetch slots again after a booking rather than treating an earlier list as still true.
    - What the finer spacing buys is the time a booking leaves behind, which matters most if you also keep a turnaround between visits. With 15-minute visits and a 5-minute turnaround, booking 09:00 frees the clinician at 09:15; the next start offered used to be 09:30, a whole visit given away for a 5-minute gap, and is now 09:20.
    - The visit length still says how long a booked visit runs, and it is still yours to set. Only the spacing of what is offered has moved.

    ## 2026-09-15 — Time between sync visits

    **Additive**

    - Lithos can now keep a turnaround clear after a visit, so a clinician has time to close the room and write the note before the next one. It is off for every organization unless you ask us to set one, and nothing about the grid changes while it is off. The turnaround belongs to the visit that just finished, so it is the booking organization's setting that decides it — a visit booked by a partner who asks for none is still followed immediately, on your grid as on theirs.
    - With a turnaround set, `GET /v1/appointment_slots` stops offering the start that begins the moment one of your visits ends, and the one whose own turnaround would run into the next visit. Booking 09:00 for a 15-minute visit takes 09:15 off the grid and the next start offered is 09:30. A visit also needs the clinician's hours open for its own length plus the turnaround, so the last start of a day may no longer be offered, and an availability window shorter than the two together offers nothing.
    - Clinicians are shared across partners, so this cuts both ways. A visit booked by another organization is owed the turnaround THEY asked for, so a start can be missing from your grid because of their setting rather than yours — and a start can be offered with no turnaround in front of it because theirs is 0, whatever yours is.
    - A visit you are about to move is still scheduled while you fetch slots for it, so with a turnaround set it holds the time after itself too. Expect the starts right after a visit to be missing from the grid you reschedule it onto.
    - `POST /v1/slot_reservations` applies the same rule, so a start that has stopped being offered can no longer be held either.
    - The turnaround decides which starts are offered and which may be held. It is not re-checked when you book: a hold taken while the time was clear still books, even if someone else's visit landed beside it in the meantime. It answers `409 slot.taken` as it does for a start someone booked.

    ## 2026-09-02 — Lab requisitions in the reference

    **Non-breaking**

    - The lab requisition endpoints and the `lab_requisition.issued` webhook now appear in this reference.
    - `panel` on lab requisitions is deprecated. It carries the same value as `preset` and stays in the response.

    ## 2026-08-19 — Signed lab requisition PDFs

    **Additive**

    - Lab requisitions now expose `pdf_status`, `valid_through`, and a fresh nullable `download` envelope. `lab_requisition.issued` fires when the signed PDF is attached and ready for the patient.
    - Encounter responses embed `lab_requisitions[]`, and `GET /v1/lab_requisitions/{id}/download` redirects to a fresh signed PDF URL.

    ## 2026-08-18 — Lab requisition catalog presets

    **Additive**

    - Lab requisition responses carry `preset`, the catalog preset the clinician ordered for the care plan, the frozen `ordered_items` with Labcorp and Quest codes, and the frozen `diagnosis_codes` included with the order.

    ## 2026-08-18 — Clinician-signed lab requisitions and their lifecycle

    **Additive**

    - Lab requisition responses carry nullable `encounter_id`, `canceled_at`, and `expired_at`. `status` adds `canceled` and `expired`; issued requisitions expire 90 days after issuance (`valid_through`).

    ## 2026-08-11 — Full-body photo optional on the weight management initial intake

    **Non-breaking**

    - `full_body_photo_upload_id` on the `weight_management` initial intake (`POST /v1/encounters`) is now optional. Clinicians no longer need the photo to review a GLP-1 initial encounter. Existing integrations that send it keep working unchanged — when present it is still redeemed into a patient [Document](#tag/Documents), exactly as before. Do not send placeholder images to fill the field; omit it instead.

    ## 2026-08-11 — Order `placed` status, `placed_at`, and `order.placed`

    **Additive, with one enum note**

    - Orders gain a `placed` status between `processing` and `completed`: `processing` is Lithos routing the order to a pharmacy, `placed` means the pharmacy accepted it into its queue. The `order.placed` webhook fires on the transition, and the order carries a nullable `placed_at`. A reroute returns the order to `processing` (and `order.processing` fires again) until the next pharmacy accepts.
    - If your integration matches order `status` exhaustively, add `placed` — orders that used to sit at `processing` for their whole pharmacy phase now rest at `placed`. Treat unknown statuses as in-flight to be safe against future additions.
    - Sandbox gains `POST /v1/sandbox/orders/{order_id}/place` so you can exercise the `order.placed` webhook end to end.
    - `order.processing` may no longer fire for an order Photon places directly — such orders go straight `pending → placed` and emit only `order.placed`. If you gate anything on `order.processing`, treat `order.placed` as also covering it.

    ## 2026-08-10 — Fulfillment snapshot on orders

    **Additive**

    - Orders carry a `fulfillment` object: the pharmacy's own progress report (`status`, plus `carrier` and `tracking_number` once a mail order ships). Null until the pharmacy first reports — and some pharmacies never report past acceptance. No webhook fires on fulfillment changes; fetch the order when you need current shipment progress.

    ## 2026-08-06 — Lab report on the lipid initial intake

    **Additive**

    - The `lipid_management` initial intake on `POST /v1/encounters` accepts an optional `lab_report_upload_id`, the [Upload](#tag/Uploads) for the lab report behind `ldl_c` and `ldl_c_date`. Send it where you have it — a clinician signs an order against those numbers, so the report they came from is worth having at review. It's redeemed into a patient [Document](#tag/Documents) under category `lab_result`, like the weight management intake's photos.

    ## 2026-08-04 — GLP-1 photo on the weight management follow-up

    **Additive**

    - The `weight_management` follow-up intake accepts an optional `current_glp1_dosage_upload_id`, the same field the initial intake already takes. Send a photo of the patient's most recent prescription (patient name, medication, dose, date prescribed) where they have it, or the pen, vial, or label. It's redeemed into a patient [Document](#tag/Documents) like the initial intake's photos and shown to the clinician at review.

    ## 2026-08-04 — Inquiry close note

    **Additive**

    - A closed [Inquiry](#tag/Inquiries) now carries `closed_note` alongside `closed_reason` — why it was closed, in words, on both the show and list shapes. Every close carries one, including an automatic close.

    **Behavior change**

    - An inquiry with no patient reply now closes automatically after 14 idle days instead of 7.

    **Sandbox only**

    - `POST /v1/sandbox/inquiries/{inquiry_id}/close` now requires `note` for every `reason`, not just `other`. A body without it returns `422`.

    ## 2026-07-29 — Upload deadlines split in two

    **Additive**

    - An [Upload](#tag/Uploads) now carries `upload_url_expires_at` — how long `upload_url` accepts bytes, about an hour. `expires_at` is now the redemption deadline and runs much longer, about a week, so a slot whose bytes already landed stays redeemable while the patient finishes their intake.
    - `410 upload.url_expired` is returned on redeem when no bytes arrived and `upload_url_expires_at` has passed. `410 upload.expired` now means `expires_at` has passed.

    ## 2026-07-28 — Webhook delivery log

    **Additive**

    - `GET /v1/webhook_deliveries` lists what Lithos sent your organization, newest first, with how many attempts were made and the outcome of the most recent one. `GET /v1/webhook_deliveries/{id}` adds `last_response_body_snippet` for debugging a failure.

    ## 2026-06-21 — Clinician profile picture

    **Additive**

    - The clinician shape now carries `profile_picture_url` — the URL of the clinician's profile picture, `null` when none is set. It appears wherever a clinician is embedded, such as an [Encounter](#tag/Encounters)'s `clinician` and a [Prescription](#tag/Prescriptions)'s `written_by`.

    ## 2026-06-20 — Encounter patient message

    **Additive**

    - An [Encounter](#tag/Encounters) now carries `patient_message` — the care-team message to relay when the encounter is completed. It has a Markdown `body` and an `attachments[]` of files (each a [Document](#tag/Documents) with a signed `download`), and is `null` until the encounter is completed. Read it after the `encounter.completed` webhook.

    ## 2026-06-20 — Sandbox test clock

    **Additive**

    - New sandbox helper [test clock](#tag/Sandbox-Test-Clocks): `POST /v1/sandbox/test_clock` and `/advance` (plus `GET` / `DELETE`) move your organization's simulated time forward to fire `care_plan.refill_due` on demand — test refills without waiting for the real due date.

    ## 2026-06-19 — Disable a webhook endpoint

    **Additive**

    - `POST /v1/webhook_endpoints/{id}/disable` disables an endpoint so it stops receiving deliveries. One-way and idempotent — to resume deliveries, register a new endpoint with `POST /v1/webhook_endpoints`.

    ## 2026-06-16 — Encounter escalation messaging

    **Additive**

    - Escalating an encounter with `escalation_reason: patient_information_required` now opens an [Inquiry](#tag/Inquiries) to the patient asking for the missing details. The inquiry's `references` carry the encounter it's about. Resolving or closing that inquiry returns the encounter to `in_review` (watch `encounter.in_review`).
    - The sandbox escalate request takes `message_for_patient`, the question relayed to the patient — required when `escalation_reason` is `patient_information_required`.

    ## 2026-06-16 — Inquiries

    **Additive**

    - New resource [Inquiries](#tag/Inquiries) — a threaded patient/care-team conversation scoped to one topic. Open one with `POST /v1/patients/{id}/inquiries`, relay patient replies with `POST /v1/inquiries/{id}/messages`, and read with `GET /v1/inquiries/{id}` and `GET /v1/patients/{id}/inquiries`. Each carries a collapsed `status` (`open` | `resolved` | `closed`), an `awaiting` party (`patient` | `staff`) while open, and inquiry-level `references[]`.
    - New webhook events: `inquiry.created`, `inquiry.message_added`, `inquiry.resolved`, `inquiry.closed`.
    - New sandbox helpers to simulate the care-team side: `POST /v1/sandbox/inquiries/{id}/messages`, `/resolve`, and `/close`.

    ## 2026-06-11 — Webhook endpoint registration

    **Additive**

    - `POST /v1/webhook_endpoints` registers your organization's HTTPS endpoint and returns its signing secret once in the response. One active endpoint per org — a second registration returns `409 webhook_endpoint.already_exists`.

    ## 2026-05-30 — CatalogTreatment rename and treatments

    Breaking, shipped in place — `/v1` has no public consumers yet.

    **Breaking (`/v1`)**

    - Catalog resource renamed to **CatalogTreatment**: `GET /v1/catalog_treatments`, identified by a human-readable **slug** (`catalog_treatment_id`, e.g. `wegovy-weight-loss`) instead of the `trt_` ULID. `Prescription` references the treatment by `catalog_treatment_id` (the slug) rather than embedding it — fetch the full CatalogTreatment from `GET /v1/catalog_treatments/:id`.
    - The embedded **`medication` object is removed** from the partner surface. `CatalogTreatment` no longer nests a `medication`; instead the underlying medication's `brand_name`, `form`, and `presentation` are flattened directly onto the CatalogTreatment shape. The molecule name and internal medication id are no longer exposed.
    - The free-text `ineligibility_reason` on a rejected `requested_treatments[]` line is replaced by an optional `clinician_notes` (present on any verdict, and on `CarePlan`); `ineligibility_reason_code` is unchanged and still required when ineligible.
    - A CarePlan's `treatments[]` entries are now persistent **treatments**: each carries a stable `treatment_id` and a `status` (`active` | `completed`). The line keeps its `treatment_id` across a **switch** (`catalog_treatment_id` moves to the new catalog treatment, the line does not). Completed lines now appear with `current_prescription: null` (previously only active lines were listed). `refill_status` / `refill_due_at` keep their meaning, are now served from stored values, and a pending **switch** is correctly reported as `pending`.
    - `POST /v1/encounters` request items now identify an **existing line by `treatment_id`**: `refill` carries `{ action, treatment_id }`; `switch` carries `{ action, treatment_id, catalog_treatment_id }` (the line plus the target catalog treatment). `add` is unchanged — `{ action, catalog_treatment_id }`, since no line exists yet. The line actions no longer accept `catalog_treatment_id` to name the target, and `switch` no longer takes `old_`/`new_catalog_treatment_id`. Read each line's `treatment_id` from `GET /v1/care_plans/{id}` (`treatments[].treatment_id`).

    ## 2026-05-24 — CarePlan + Refill Flow

    Adds [CarePlan](#tag/CarePlans) and reshapes encounters and prescriptions around it. The breaking pieces ship in place because `/v1` doesn't have public consumers yet.

    **Breaking (`/v1`)**

    - `POST /v1/encounters` requires `care_plan_id` and a non-empty `requested_treatments[]`. Each item references a [Catalog Treatment](#tag/CatalogTreatments) by `treatment_id` — Wegovy, Zepbound, etc. — not a raw medication. *(Later renamed to `catalog_treatment_id`; see 2026-05-30.)*
    - `Prescription.state` is replaced by `Prescription.active` (boolean); `expired` / `depleted` are gone — read `expiration_date` for expiry.
    - `Medication.strength` removed. Strength now lives on `Prescription` directly.
    - `Encounter.status` drops `rejected`. When a clinician declines, that shows up on the rejected `requested_treatments[]` line (`ineligibility_reason_code`) and `CarePlan.status: ineligible`.
    - `POST /v1/encounters/{id}/cancel` requires `pending_review`; past that you get `422 encounter.not_pending_review` (was `409 encounter.not_cancellable`).
    - `encounter.rejected` webhook removed — watch `care_plan.ineligible` and read the rejected `requested_treatments[]` line / the `CarePlan` instead.

    **Additive**

    - New resource `/v1/care_plans` (`POST`, `GET`, `GET /:id`); single-resource read embeds `treatments[]` with current `Prescription`, `refill_status`, `refill_due_at`. Scopes: `care_plans:read`, `care_plans:write`.
    - New `Encounter` fields: `care_plan_id` and `requested_treatments[]`. Each `requested_treatments[]` line is self-describing — it carries its own verdict `status` (`pending` → `approved` | `rejected`) plus a `treatments[]` array of the treatment(s) an approved line produced (`treatment_id`, the current `Prescription`, and an optional `clinician_notes`; substitutes and clinician-bundled extras ride here too).
    - New `requested_treatments` actions: `add`, `refill`, `switch` (`switch` uses `old_treatment_id` + `new_treatment_id`).
    - `Prescription` embeds `treatment` (program identity), with `medication` (molecule / form / presentation) nested inside it for clinical display.
    - New `care_plan_id` filter on `GET /v1/encounters`.
    - New webhook events: `care_plan.active`, `care_plan.ineligible`, `care_plan.refill_due` (`cpl_` prefix).
    - New error codes: `encounter.treatment_not_refillable`, `encounter.not_pending_review`, `care_plan.not_pending_review`, `care_plan.not_active`.
    - [Quick Start](#tag/quick-start) updated to walk the full flow.

    ## 2026-05-13

    - The reference page is now interactive: click **Test Request** on any operation to call sandbox directly from the browser. Paste your `client_id` / `client_secret` in the auth panel, hit Get Token, and the resulting JWT is attached to every Send for the rest of the session.

    ## 2026-04-30 — initial 1.0.0 preview

    Initial preview release. The API Reference and Webhooks sections of these docs *are* the `/v1` baseline — there's nothing to diff against yet. The reference is public, but the contract is still soft: `/v1` has no public consumers, so the breaking changes in later entries shipped in place rather than under a new prefix. Future entries describe what changes after this date.

    | Added | |
    |---|---|
    | Resources | Patients, Encounters, Orders, Prescriptions, Prior authorizations, Insurances, Documents |
    | Webhook events | `encounter.*`, `order.*`, `prior_authorization.*` |
    | Guides | Quick Start, Authentication, Documents |

