  "/v1/appointment_slots":
    get:
      summary: List appointment slots
      tags:
      - Appointments
      operationId: listAppointmentSlots
      x-internal: true
      description: The times this patient may be offered for a live video visit, between
        `from` and `to`. Each start appears once, soonest first, with a `slot_token`
        to reserve it with. Starts come every 15 minutes from the top of the hour
        in the clinician's time zone, plus the minute their hours begin and the free
        starts right before and after time that is booked, held, or outside their
        hours. Nothing in the body names a clinician. `from` to `to` may cover at
        most 14 days; a wider range is rejected with `422 slot.range_too_wide`. Inside
        that, the organization's minimum notice and booking horizon clip the range
        further. When nothing is bookable, `slots` is empty and `reason` says whether
        another range would help.
      parameters:
      - name: patient_id
        in: query
        required: true
        schema:
          type: string
          pattern: "^pat_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
        description: The patient the visit is for. Licensure is matched on the state
          of their active address.
      - name: care_plan_id
        in: query
        required: true
        schema:
          type: string
          pattern: "^cpl_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
        description: The care plan the visit advances. Must belong to the patient.
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: Inclusive start of the range to search. An RFC 3339 timestamp
          carrying an offset, e.g. `2026-03-09T14:00:00Z`. Any offset is accepted;
          a value without one is rejected.
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: Exclusive end of the range to search, in the same form as `from`.
          Must be a later instant than `from`, compared across offsets rather than
          as written, and at most 14 days past it. To show more, ask again from where
          the last range ended.
      responses:
        '200':
          description: Bookable starts
          content:
            application/json:
              examples:
                available:
                  summary: Slots available
                  value:
                    slots:
                    - starts_at: '2026-03-09T13:00:00Z'
                      duration_minutes: 15
                      current: false
                      slot_token: ZXhhbXBsZS1zbG90LXRva2Vu--c2ln
                    - starts_at: '2026-03-09T13:15:00Z'
                      duration_minutes: 15
                      current: false
                      slot_token: ZXhhbXBsZS1zbG90LXRva2Vu--c2ln
                    - starts_at: '2026-03-09T13:30:00Z'
                      duration_minutes: 15
                      current: false
                      slot_token: ZXhhbXBsZS1zbG90LXRva2Vu--c2ln
                    - starts_at: '2026-03-09T13:45:00Z'
                      duration_minutes: 15
                      current: false
                      slot_token: ZXhhbXBsZS1zbG90LXRva2Vu--c2ln
                    reason:
                    next_available:
                none_in_range:
                  summary: None in range
                  value:
                    slots: []
                    reason: no_slots_in_range
                    next_available: '2026-03-10T13:00:00Z'
                no_licensed_availability:
                  summary: No licensed availability
                  value:
                    slots: []
                    reason: no_licensed_availability
                    next_available:
              schema:
                "$ref": "#/components/schemas/AppointmentSlotsResponse"
        '422':
          description: The range is inverted or too wide, or the patient or care plan
            is not yours
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
