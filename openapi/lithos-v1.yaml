  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          examples:
            missing_token:
              summary: No Authorization header
              value:
                errors:
                - code: auth.missing_token
                  message: Authentication required.
            expired_token:
              summary: Token past its expiry
              value:
                errors:
                - code: auth.expired_token
                  message: Your access token expired. Request a new one from /oauth2/token.
            invalid_token:
              summary: Bad signature, wrong issuer, or malformed token
              value:
                errors:
                - code: auth.invalid_token
                  message: Your access token is invalid.
            org_not_provisioned:
              summary: Token valid but org_id claim does not match a provisioned organization
              value:
                errors:
                - code: auth.org_not_provisioned
                  message: Your organization is not provisioned for this API.
    NotFound:
      description: The resource referenced in the path does not exist or is not visible
        to your organization.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          examples:
            not_found:
              summary: Patient ID does not exist
              value:
                errors:
                - code: resource.not_found
                  message: No patient with id `pat_test_01HXMISSING` exists in your
                    organization.
    TooManyRequests:
      description: Rate limit exceeded. Honor the `Retry-After` header before retrying.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          examples:
            rate_limited:
              summary: Rate limit exceeded
              value:
                errors:
                - code: rate_limit.exceeded
                  message: Your organization is rate-limited. Honor the `Retry-After`
                    header before retrying.
    TokenBadRequest:
      description: The request is not a client-credentials grant.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TokenError"
          examples:
            unsupported_grant_type:
              summary: "`grant_type` is not `client_credentials`"
              value:
                error: unsupported_grant_type
                error_description: Grant type password is not supported.
    TokenUnauthorized:
      description: The `client_id` or `client_secret` is wrong or missing.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TokenError"
          examples:
            invalid_client:
              summary: Unknown client or wrong secret
              value:
                error: invalid_client
                error_description: Application not found.
            missing_credentials:
              summary: No credentials in the request
              value:
                error: invalid_client
                error_description: Missing authorization header.
tags:
- name: Patients
  description: |-
    Patients are the root resource. Every encounter, prescription, and
    insurance record hangs off a Patient. `external_id`,
    `identity_verified_at` and `enrolled_in_government_insurance` are set
    at creation and can't be changed; the other fields can be updated
    through `PATCH`. `email` and `external_id` are each unique within your
    organization.

    `time_zone` is the patient's US time zone, as an IANA name such as
    `America/Denver`. Use it for times you send from your server, such as
    confirmations and reminders. In a browser, show times in the device's zone.
    Lithos looks the zone up from `address.postal_code`, per ZIP code rather than
    per state, and looks it up again when the address changes. It is `null` when
    Lithos can't place the ZIP code, for example a military APO or FPO ZIP. You can
    set the zone yourself on create or update. A zone you send stays through
    address changes until you send `null`, which hands it back to the ZIP lookup.
- name: CarePlans
  description: |-
    A CarePlan groups a patient's encounters and prescriptions for one clinical
    area, such as weight management or lipid management. A patient receiving
    care in two clinical areas has two plans.

    **Category.** Choose a clinical `category` when you create the plan.
    Use `GET /v1/catalog_treatments` to find the categories available to your
    organization. An unavailable category returns `422 category.unavailable`.
    Each catalog treatment you `add` or `switch` to must support the plan's
    category, or the encounter returns `422 requested_treatment.category_mismatch`.

    **Plan status.** Lithos updates `CarePlan.status` based on the clinician's review.

    | Status | What it means |
    |---|---|
    | `pending_review` | The plan is waiting for its first encounter. |
    | `in_review` | A clinician is reviewing the first encounter. |
    | `active` | The clinician approved the plan. You can submit follow-up encounters. |
    | `ineligible` | The clinician decided the patient is not eligible. Read `ineligibility_reason_code` and any `clinician_notes` for details. The plan can't be reactivated. |
    | `canceled` | The plan's initial encounter was canceled after review started, for example a live visit the patient never attended. The plan takes no more encounters; create a new plan to try again. |

    **Refills.** Read `GET /v1/care_plans/{id}` for the plan's `treatments[]`,
    including completed treatments. Each treatment keeps the same `treatment_id`
    when it switches to a different catalog treatment; its `catalog_treatment_id`
    changes. Each entry includes its status and current prescription
    (`null` for a completed treatment).

    Use `refill_due_at` to see when the next refill window opens.
    Check `refill_status` to see whether a refill is due (`eligible`),
    not due (`not_eligible`), or already waiting for review (`pending`).
    `pending` is set by a daily job, so it can lag behind a refill or switch
    you just submitted. While a `refill` or `switch` for a treatment is still
    open, another one for the same treatment returns
    `422 encounter.treatment_change_pending`, whatever `refill_status` says.

    **When refill information updates.** The refill date appears when the order
    is placed. It updates when the order is completed and clears if the order
    is canceled. When a clinician finishes an encounter, the affected treatments'
    refill information updates too. An approved refill changes the treatment to
    `not_eligible` until its next refill window opens.

    Listen for `care_plan.refill_due` to know when a treatment is ready for a
    refill. See [Refills](#tag/Refills) for how to request one.
- name: Encounters
  description: |-
    An encounter represents one clinical interaction within a [CarePlan](#tag/CarePlans). A clinician licensed in the patient's state reviews the request, makes treatment decisions, and completes the encounter. Your integration submits the intake information and treatment requests, follows status updates, and delivers the clinician's response to the patient.

    ## Create an encounter

    Every encounter belongs to a care plan. Submit the first encounter while the plan is `pending_review`. Submit later encounters on an `active` plan to request a new treatment, a refill, or a medication switch.

    Use `requested_treatments[]` to describe each request:

    | Action | Fields | Purpose |
    |---|---|---|
    | `add` | `catalog_treatment_id` (optional) | Request a new treatment by its catalog slug. Omit the field to let the clinician choose a medication within the plan's clinical category. |
    | `refill` | `treatment_id` | Request a refill for an existing treatment. Read the ID from `treatments[].treatment_id` on the care plan. |
    | `switch` | `treatment_id` and `catalog_treatment_id` | Request a different medication for an existing treatment. Supply the existing treatment ID and the target catalog slug. |

    Include the patient's intake responses in `intake_form.data`. Lithos validates them against the schema for the plan's category and encounter type. See [Intake Schemas](#tag/intake-schemas) for the required structure.

    Creating an encounter does not change the care plan's status. The initial plan enters `in_review` when a clinician starts reviewing the encounter.

    ## Follow the review

    An encounter starts in `pending_review` and moves to `in_review` when a clinician starts the review. It can pause in `escalated` if the clinician needs more information.

    The two terminal statuses are:

    - `completed`: the clinician has finished the review. Read the treatment decisions and care plan outcome to determine what was approved.
    - `canceled`: the encounter was canceled before review started.

    There is no encounter-level `rejected` status. A completed encounter can include rejected treatment requests or an ineligible care plan.

    ### Respond to requests for more information

    When an encounter is `escalated`, read `escalation_reason`. The reason `patient_information_required` means the clinician needs additional details from the patient. Lithos opens an [Inquiry](#tag/Inquiries) for that conversation.

    Relay the conversation through your patient communication channel. When the care team resolves or closes the inquiry, the encounter returns to `in_review` and Lithos emits `encounter.in_review`.

    ### Correct or cancel a submission

    Submitted encounter data cannot be edited; there is no `PATCH` endpoint. Review actions update the encounter's status and results.

    You can cancel an encounter only while it is `pending_review`. Cancellation affects the encounter and leaves the care plan unchanged. To correct an intake submission before review starts, cancel the encounter and create a new one with the corrected information.

    ## Read treatment decisions

    Read each decision in `Encounter.requested_treatments[]`. Each requested treatment has its own `status`:

    | Status | Meaning |
    |---|---|
    | `pending` | The clinician has not submitted a final decision. |
    | `approved` | The clinician prescribed the requested medication, or selected one for an `add` request that left the choice to them. Additional medications may also be included. |
    | `modified` | The clinician prescribed a different medication from the one requested. |
    | `rejected` | The clinician declined the request. Read `ineligibility_reason_code` for the reason. |

    For an `approved` or `modified` request, `treatments[]` contains the treatments created or continued by that decision. Each result includes a stable `treatment_id`, the prescribed `catalog_treatment_id` and `dosage_id`, `current_prescription_id`, refill information, and `clinician_notes` when available. Retrieve the care plan to read the full prescription.

    Compare the request's `catalog_treatment_id` with the IDs in its `treatments[]` to identify a substitution. For an `add` request that omitted `catalog_treatment_id`, read the clinician's selection from `treatments[]`.

    One request can produce multiple treatments. For example, the clinician may prescribe the requested medication and an antiemetic. Both appear in that request's `treatments[]`. Pending and rejected requests have an empty array; treatments appear once a request is approved or modified.

    Rejecting a `refill` or `switch` ends the patient's existing treatment. On the care plan, that treatment's `status` becomes `completed` and its `current_prescription` becomes `null`, and a later `refill` of it returns `422 encounter.treatment_not_refillable`. To put the patient back on that medication, submit a new `add` request.

    ## Read the care plan outcome

    The encounter's `care_plan` object includes the plan's current `status`, `clinician_notes`, and, when the plan is `ineligible`, `ineligibility_reason_code`. This is a live view of the plan. Use `care_plan_id` to retrieve the full [CarePlan](#tag/CarePlans), including its `treatments[]`.

    A plan can remain `active` even if an individual treatment request is rejected. When the clinician completes the review, Lithos writes any new prescriptions and emits `care_plan.active` or `care_plan.ineligible` as appropriate.

    To determine whether a patient is due for a refill, read `GET /v1/care_plans/{id}` and check the treatment's refill information. Encounter status alone does not indicate refill eligibility.

    ## Deliver the clinician's message

    After receiving `encounter.completed`, retrieve the encounter and read `patient_message`. It contains a Markdown `body` and an `attachments[]` array. Render the body in your patient communication channel and relay the attachments.

    Each attachment is a [Document](#tag/Documents) with a short-lived signed `download`. The `patient_message` field is `null` until the encounter is completed.

    ## Identify the reviewing clinician

    A patient's first completed encounter sets their `assigned_clinician`. Follow-up encounters go to that clinician when they are available. Otherwise, Lithos routes the encounter to a covering clinician and updates `assigned_clinician`.

    Use `Encounter.clinician` to identify who handled a particular encounter. Resulting prescriptions record that clinician in `Prescription.written_by`. During a coverage event, these fields can differ from the patient's `assigned_clinician`.
- name: Appointments
  description: |-
    An Appointment is one live video visit on an [Encounter](#tag/Encounters).
    A `sync` encounter is created together with its first visit, by sending a
    hold's `reservation_token` to `POST /v1/encounters`. After that, read
    `needs_appointment` on the encounter: `true` means the last visit was canceled
    or missed, and a new one is owed. The
    [Sync Visits](#tag/sync-visits-guide) guide walks the whole flow, from
    offering times to rebooking after a no-show.

    **Every booking is its own appointment.** Rescheduling and rebooking add a
    row rather than change this one, so `GET /v1/encounters/{id}/appointments`
    reads as what actually happened — newest first, with at most one live booking.

    **Statuses.** `scheduled` and `in_progress` are live. `in_progress` means
    the patient and the clinician were in the room at the same moment, and a
    visit in that state can no longer be canceled or rescheduled. The rest are
    terminal:
    `completed` is the visit that happened, `patient_no_show` and
    `clinician_no_show` are the ones that did not, and `canceled` covers both a
    cancellation and a booking a reschedule replaced. Tell a replaced booking
    from a canceled one by `rescheduled_to_id`, which only a replacement carries.

    **`patient_join`** is everything the **Join visit** button needs: `status`
    says what the patient may do right now, `opens_at` and `closes_at` are the
    window, and `url` is the page they open. Re-read it before you draw the
    button — the window is checked again when the patient arrives.

    **Slots and holds.** `GET /v1/appointment_slots` returns bookable starts,
    each with a short-lived `slot_token`. `POST /v1/slot_reservations` turns one
    into a hold that lasts until `expires_at`. Spend it on the first visit by
    creating the encounter with it, on a new visit after a cancellation or no-show
    with `POST /v1/encounters/{id}/appointments` (which also books a `sync`
    encounter created before the token was required), or on a move with
    `POST /v1/appointments/{id}/reschedule`. All three require an
    `Idempotency-Key`.

    You can retry with the same key and request for **30 days**.
    After that, Lithos treats the request as new and refuses it because the hold
    has already been used. It will not book a second visit. Keep the key for any
    retries you might make during that window, including manual retries days later.
  x-internal: true
- name: Orders
  description: |-
    An Order represents one fulfillment from one pharmacy. When a
    clinician approves an encounter, Lithos creates an Order for each
    pharmacy involved. Most encounters create one Order, but a plan
    involving multiple pharmacies can create several.

    ## Order status

    Orders generally move through:

    `pending → processing → placed → completed`

    An Order can also become `canceled` if fulfillment falls through.

    - `processing`: Lithos is routing the Order to a pharmacy.
    - `placed`: The pharmacy accepted the Order and added it to its queue.
    - `completed`: The pharmacy reported that the Order was delivered or
      collected.

    An Order may skip `processing` and go directly to `placed`, so don't
    assume an `order.processing` webhook will always fire.

    Some pharmacies report delivery or pickup, allowing the Order to move
    to `completed`. Others only report acceptance, so their Orders may
    remain `placed` indefinitely—even after the patient receives the
    medication.

    ## Pharmacy

    The `pharmacy` field identifies the dispensing pharmacy and includes
    its address.

    When it becomes available depends on the routing process. It may be
    set immediately, or only after the patient selects a pharmacy. It
    remains `null` when an Order is fulfilled outside a pharmacy.

    Always read this field directly instead of inferring the pharmacy from
    the Order's status.

    ## Fulfillment and tracking

    The `fulfillment` field contains the pharmacy's latest progress
    update. For mail orders, it may also include the carrier and tracking
    number after shipment.

    It remains `null` until the pharmacy sends its first update. Reporting
    varies by pharmacy: some provide updates through delivery, while
    others stop at `received` even if the package is later delivered.

    Treat the fields separately:

    - `status` describes the Lithos Order lifecycle.
    - `fulfillment` describes the pharmacy's reported shipment progress.

    Because pharmacy reporting can be incomplete, either field may appear
    out of date after the patient receives the medication.

    ## Editing Orders

    Orders are read-only. Lithos creates them when an encounter is
    approved, and they cannot be edited.
- name: Prescriptions
  description: |-
    A Prescription is one line the clinician signed off on at
    encounter approval: a `catalog_treatment_id` (the slug of the
    catalog treatment it was written for — resolve the full
    CatalogTreatment via `GET /v1/catalog_treatments/:id`),
    `strength`, `instructions` (the patient-facing dosing),
    `quantity`, `days_supply`, and `expiration_date`.

    Prescriptions are read-only — there's no write endpoint. To
    add, refill, or switch a prescription on a patient's plan,
    submit a `follow_up` encounter with the matching `action` on
    `requested_treatments[]`; Lithos writes the new prescription
    when the clinician signs off.

    You can read prescriptions two ways: embedded inside the Order
    they ship in (and inside the Encounter that produced the order),
    or directly via `/v1/prescriptions` for a flat list filtered by
    patient, encounter, order, or date range. Both paths return the
    same shape, and back-references (`patient_id`, `encounter_id`,
    `order_id`) are present in both forms so you can always navigate
    back to the parent resources.
- name: CatalogTreatments
  description: |-
    A CatalogTreatment is something Lithos can prescribe: an underlying
    medication plus the `dosages[]` it can be prescribed at. Sometimes that's
    a titration schedule the patient steps up over time — Wegovy
    (`wegovy-auto-injector`), starting at 0.25 mg and climbing; sometimes it's a
    single fixed dose — Repatha at 140 mg every two weeks. You name one by its
    `id` in `catalog_treatment_id` when you `add` or `switch` a treatment on an
    encounter's `requested_treatments[]`; this endpoint lists the ones your
    organization can prescribe so you can look that `id` up.

    **The id is a slug.** A catalog treatment is identified by a stable,
    human-readable slug (e.g. `wegovy-auto-injector`) — not a patient-specific
    value. The *same* `catalog_treatment_id` is shared across every patient
    prescribed it, so `wegovy-auto-injector` always refers to the same catalog
    entry. The slugs your organization can use are the ones
    `GET /v1/catalog_treatments` returns; read them from there rather than
    copying them from these pages.

    Each catalog treatment carries the underlying medication's `brand_name`,
    `form`, and `presentation` flattened inline, plus the available
    `dosages[]`.

    **Categories.** Each entry lists the clinical `categories` your
    organization offers it under (e.g. `weight_management`). A CarePlan is
    scoped to one category and accepts only treatments whose `categories`
    include it, so pass one of these as the plan's `category` when you create
    it.

    **What you can see.** Your token returns only the catalog treatments
    provisioned for your organization. One that's not in your set returns
    `404 resource.not_found`. Adding or removing catalog treatments is
    operator-managed; ask your Lithos contact.

    **Multiple catalog treatments can share an underlying medication.** The
    same medication may back several catalog treatments — e.g. one for
    weight loss and one for longevity on the same molecule. They surface as
    distinct entries with their own slug and `dosages[]`; pick the one
    matching what you're prescribing.

    **Read-only.** No write endpoints on the catalog.
  x-displayName: Catalog Treatments
- name: Prior authorizations
  description: |-
    A Prior Authorization (PA) is a payer pre-approval recorded
    against a patient's coverage. Lithos clinical operations submits
    the request out-of-band (fax, payer portal, or phone) and records
    the outcome here.

    Prior authorizations are read-only — partners observe the outcome
    but never submit, cancel, or appeal through the API. When a denial
    is reworked, ops creates a new PA whose `appeal_of_id` points back
    to the original; both records remain visible.
  x-internal: true
- name: Lab requisitions
  description: |-
    A lab requisition is a signed order for bloodwork. A clinician creates and signs it while completing an [Encounter](#tag/Encounters), so every requisition you read from the API is already signed. Lithos then produces a PDF of the requisition. Your job is to get that PDF to the patient. They take it to a lab to have their blood drawn; the PDF carries the test codes for Labcorp and Quest.

    **Wait for `lab_requisition.issued`.** This webhook fires once the PDF is ready. Fetch the requisition with `GET /v1/lab_requisitions/{id}` and give the patient the file at `download.url`. It needs no access token, so a browser can open it directly, and it stops working at `download.expires_at`. Don't store it; read the requisition again when you need a new one. Encounter responses include `lab_requisitions[]`, so a completed encounter carries the same `download`. When you hold only the id and don't need the JSON, `GET /v1/lab_requisitions/{id}/download` redirects straight to the PDF.

    **What was ordered** never changes after signing: `preset`, `ordered_items[]`, and `diagnosis_codes[]` show what the clinician actually ordered, even after the catalog changes.

    **Status.** A requisition is `approved` from the moment it exists. It becomes `canceled` if the care team withdraws it, or `expired` the day after the "Valid through" date printed on the PDF. Once canceled or expired, `download` is `null` and the download endpoint returns 404, so check `status` before you tell a patient their requisition is ready to use. If `pdf_status` is `failed`, the PDF could not be produced; `lab_requisition.issued` still fires once it is.

    **In the sandbox**, you create lab requisitions yourself by passing `lab_orders` when you complete an encounter. See [Sandbox Encounters](#tag/Sandbox-Encounters) for the preset names and rules.

    Every lab preset belongs to the `lipid_management` category, so pass `lab_orders` on an encounter from a `lipid_management` care plan. If your organization runs that category as live video visits, the encounter needs a completed appointment with the signing clinician before `complete` accepts it; without one, `complete` returns `422 sandbox.completion_invalid`.
- name: Insurances
  description: |-
    An Insurance record is a patient's medical coverage as captured
    from their insurance card — payer, plan, member ID, group number,
    the holder of the policy, and front/back images of the physical
    card.

    A patient has at most one `active` insurance record at a time.
    Creating a new one via `POST` automatically flips the previous
    active record to `inactive`.
- name: Documents
  description: |-
    A Document is a file attached to a patient — ID photos, consent
    PDFs, lab results, clinical photos, and similar. Uploads happen
    in two steps: your client asks Lithos for a short-lived signed URL,
    then `PUT`s the bytes straight to that URL. You upload at full
    network speed without an API request held open for the transfer,
    so larger files don't bump into request timeouts and your servers
    aren't tied up proxying bytes.

    End to end, that's three HTTP calls:

    1. `POST /v1/uploads` with file metadata (`filename`,
       `content_type`, `byte_size`, base64-MD5 `checksum`). The response
       carries a short-lived presigned `upload_url` plus the
       `upload_headers` to send with the bytes. `Content-MD5` is the one
       that binds; see [Uploads](#tag/Uploads).
    2. `PUT` the file bytes to `upload_url` directly, with the
       supplied headers. No Lithos credentials are sent on this hop.
    3. `POST /v1/patients/{patient_id}/documents` with the returned
       `upload_id` and a `category`. Lithos validates the upload and
       returns the durable `Document`.

    Read a document with `GET /v1/documents/{document_id}`.

    Two ways to get the bytes:

    - `download.url` on the document body needs no Lithos token, so a browser
      opens it directly. It stops working at `download.expires_at`.
    - `GET /v1/documents/{document_id}/download` takes your access token and
      redirects to the file. The redirect carries its own authorization, so
      don't send your Lithos token on to the storage host.

    [Uploads](#tag/Uploads) lists the file types and the size limit
    accepted today. Both may change without a contract update. Lithos
    rejects oversized uploads with `413 upload.too_large` and unsupported
    types with `415 upload.unsupported_type`; ask your Lithos contact if a
    specific size or type matters for your integration.

    <!--
    Staleness flags (source-of-truth migration, step 3):
    - The bytes-up step (`POST /v1/uploads` + `PUT upload_url`) is described
      here AND has its own `Uploads` tag in lithos-api. The Uploads tag
      prose covers the upload service in isolation; this section keeps the
      end-to-end story so partners reading "Documents" see the full flow.
    -->
- name: Inquiries
  description: |-
    An inquiry is a threaded conversation between a patient and their
    care team, scoped to a single topic. You open one on the patient's
    behalf — the first message is the patient's. The care team also
    opens one when they need something from the patient, such as when a
    clinician escalates an encounter for more information; the first
    message is then theirs and `awaiting` is `patient` from the start.
    Either way, you relay the care team's messages to the patient and the
    patient's replies back.

    ## Status and awaiting

    Every inquiry has a `status`: `open`, `resolved`, or `closed`. While
    `status` is `open`, the `awaiting` field indicates whose turn it is to
    respond — `patient` or `staff`.

    An inquiry is resolved when the care team manually marks it as such. An
    inquiry is closed either automatically after 14 days of no patient
    reply, or manually by the care team. Once an inquiry is `resolved` or
    `closed`, new replies are rejected — open a fresh inquiry instead.

    A closed inquiry carries `closed_reason` and `closed_note`. Branch on
    the reason; show the note to whoever handles the inquiry on your side.
    Every close carries a note, and it often names something you or the
    patient has to follow up on — the patient needs to call the pharmacy,
    say.

    ## Webhooks

    Subscribe to `inquiry.*` events to know when to act. On
    `inquiry.created` or `inquiry.message_added`, fetch the inquiry by id
    and check `awaiting`:

    - `patient` — the care team has posted a new message. Deliver it to
      the patient.
    - `staff` — the latest message is one you submitted. No action needed.

    ## Errors

    | HTTP | `code` | Meaning |
    |---|---|---|
    | 422 | `inquiry.not_open` | The inquiry is resolved or closed. Open a new inquiry instead. |
    | 422 | `attachment.not_found` | A `doc_` attachment doesn't exist or belongs to another patient. |
    | 422 | `reference.invalid` | A `references` entry doesn't exist or belongs to another patient; `source.pointer` names the entry. |
    | 422 | `upload.not_found` | A `upl_` attachment doesn't exist in your organization. |
    | 422 | `upload.invalid_checksum` | A `upl_` attachment's bytes don't match its `checksum`, or never arrived. |
    | 409 | `upload.already_used` | A `upl_` attachment was already redeemed. |
    | 410 | `upload.expired`, `upload.url_expired` | A `upl_` attachment expired before it was redeemed. Reserve a new upload. |
    | 404 | `resource.not_found` | The patient or inquiry in the URL doesn't exist or isn't visible to your organization. |
- name: Uploads
  description: |-
    Uploads are the byte-transport tier under [Documents](#tag/Documents)
    (and any other partner-facing resource that carries file bytes —
    insurance card photos, for instance). The two-step presigned-URL
    flow lives here:

    1. `POST /v1/uploads` with `filename`, `content_type`, `byte_size`,
       and the base64-MD5 `checksum`. Lithos validates the metadata and
       returns a short-lived `upload_url` plus the `upload_headers` to
       send with the bytes.
    2. `PUT` the file bytes directly to `upload_url`. The `Content-MD5`
       your client sends must match the checksum declared in step 1, and
       the bytes must match it too — Lithos's storage backend rejects the
       `PUT` otherwise.

    Echoing every returned header is supported and is the simplest thing
    to do. Only `Content-MD5` is binding: it is part of the URL's
    signature, so send it exactly as returned, with bytes that match it.
    `Content-Type` is the type you declared in step 1, returned so the
    stored file is labelled the way you meant. It is deliberately left out
    of the signature, so the `PUT` is accepted whether your client sends
    it, omits it, or substitutes a default of its own — you do not have to
    fight your HTTP client over the header it adds for you.
    `Content-Disposition` sets the filename the file downloads under, and
    is left out of the signature the same way.

    The `id` returned by step 1 is single-use: redeem it on the call that
    creates the resource and it's gone. That is `upload_id` on
    `POST /v1/patients/{patient_id}/documents`,
    `insurance_card_front_image_upload_id` or
    `insurance_card_back_image_upload_id` on `POST /v1/insurances`, or an
    intake `*_upload_id` field on `POST /v1/encounters`. Redeeming checks
    that the bytes arrived, that their size is the `byte_size` you
    declared, and that they match the `checksum`. A failed redemption
    returns `upload.not_found`, `upload.already_used`, `upload.expired`,
    `upload.url_expired`, `upload.size_mismatch` or
    `upload.invalid_checksum`.

    Use the URLs Lithos returns as they are. `upload_url` points at Google
    Cloud Storage, and download URLs point at a Lithos file host; you never
    build or store either yourself.

    ## Accepted files

    Today Lithos accepts `image/jpeg`, `image/png`, `image/heic` and
    `application/pdf`, up to 25 MB (26,214,400 bytes). Send `content_type`
    exactly as written here, lowercase and with no parameters: `image/jpeg`,
    not `image/jpg` or `IMAGE/JPEG`. Anything else returns
    `415 upload.unsupported_type`, and a larger `byte_size` returns
    `413 upload.too_large`. These limits may change; ask your Lithos contact
    if a type or size matters for your integration.

    Declare the file's exact size. Storage accepts bytes of any size on the
    `PUT`, but redeeming an upload whose bytes aren't exactly `byte_size`
    returns `422 upload.size_mismatch` and discards them.

    ## Two clocks

    The `PUT` and the redeem have separate deadlines, and the response
    carries both:

    | Field | Covers | Today |
    | --- | --- | --- |
    | `upload_url_expires_at` | How long `upload_url` accepts bytes | 1 hour |
    | `expires_at` | How long `id` stays redeemable | 7 days |

    `PUT` the bytes as soon as you have the file, and the short deadline
    stops mattering. The longer one is there so a slot whose bytes already
    landed survives a patient who starts intake, walks away, and finishes
    later.

    Either duration may change, so read the timestamps rather than
    hard-coding them. Once redeemed, the Document stays on the patient
    record.

    Missing the two deadlines produces two different errors, both `410`:
    `upload.expired` once `expires_at` has passed, and `upload.url_expired`
    when no bytes ever arrived and `upload_url_expires_at` has passed. Both
    mean the same fix — reserve a new upload and PUT again.

    <!--
    Staleness flags (source-of-truth migration, step 3):
    - No source in api-spec/openapi.yaml — api-spec folds uploads into the
      Documents tag's prose. This file is freshly written for lithos-api,
      describing the upload service as its own resource (which is how the
      uploads_spec.rb tags it). Worth a docs-team pass.
    -->
- name: Webhooks
  description: |-
    Webhooks tell your backend when an encounter, care plan, order, lab requisition, or inquiry changes. Lithos sends events to the HTTPS URL you register for your environment.

    Each event gives you a resource ID. Use it to fetch the latest details from the API. The webhook itself does not include protected health information.

    ## Set up an endpoint

    Register your HTTPS URL with `POST /v1/webhook_endpoints`. The response includes a `signing_secret` that you will use to verify deliveries. Save it securely. If you lose the response, retry the same request with the same `Idempotency-Key` to get the secret again, until the secret is rotated. See the Retrying requests guide.

    You can have one active endpoint per organization. Registering a second active endpoint returns `409 webhook_endpoint.already_exists`. Your URL must use port 443 and resolve in public DNS to a public address.

    Use `GET /v1/webhook_endpoints` to see all endpoints, including disabled ones, newest first. The list is not paginated. Use `POST /v1/webhook_endpoints/{id}/disable` to stop deliveries. Disabling is permanent; register a new endpoint to resume.

    ## Receive an event

    Lithos sends a `POST` with `Content-Type: application/json`. For example:

    ```json
    {
      "id": "evt_test_01HXEV1A2B3C4D5E6F7G8H9JKM",
      "type": "encounter.completed",
      "created_at": "2026-04-30T15:30:00Z",
      "resource_id": "enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM"
    }
    ```

    The `id` identifies the event. Save IDs you have processed and skip duplicates. Your parser should ignore unknown fields, since Lithos may add fields later.

    Lithos also sends these headers:

    | Header | What it tells you |
    |---|---|
    | `X-Lithos-Event-Id` | The same event ID as `id` in the body. Use it to spot duplicates. |
    | `X-Lithos-Event-Type` | The event type, such as `encounter.completed`. |
    | `X-Lithos-Signature` | The timestamp and signature used to verify the delivery. |

    ## Verify the signature

    Verify the request before trusting its body. The `X-Lithos-Signature` header looks like `t=1714492200,v1=5257a869e7ec...`. Here, `t` is a Unix timestamp and `v1` is a hex encoded HMAC-SHA256 signature.

    1. Split the header at the comma, then split each part at its first `=` to get `t` and `v1`.
    2. Join `t`, a period (`.`), and the **raw request body exactly as received**.
    3. Use your whole `whsec_…` secret as the key to calculate the HMAC-SHA256 of that message. Encode the result as hex.
    4. Compare your result with `v1` using a constant time comparison. Reject the request if they differ.
    5. Reject the request if `t` is more than 300 seconds from your current time.

    Contact Lithos to rotate the signing secret.

    ## Fetch the resource

    After verifying the event, use `resource_id` with the matching `GET` request. The API returns the resource's current state.

    | Event family | Then call |
    |---|---|
    | `encounter.*` | `GET /v1/encounters/{resource_id}` |
    | `care_plan.*` | `GET /v1/care_plans/{resource_id}` |
    | `order.*` | `GET /v1/orders/{resource_id}` |
    | `lab_requisition.*` | `GET /v1/lab_requisitions/{resource_id}` |
    | `inquiry.*` | `GET /v1/inquiries/{resource_id}` |

    Reply with any `2xx` status within ten seconds. Other responses and timeouts count as failed deliveries.

    ## Retries and missed events

    Lithos retries failed deliveries with increasing delays for up to 72 hours after the first attempt. Events can arrive more than once or out of order. Skip event IDs you have already processed. Use `created_at` and the resource's current state when order matters.

    If you disable an endpoint, its pending deliveries stop and are marked `exhausted` with `last_error_class: endpoint_disabled`. A new endpoint does not receive them. Events that happen while you have no active endpoint are not recorded in the delivery log. To catch up after that gap, list the resources themselves, for example with `GET /v1/encounters`.

    ## Check the delivery log

    `GET /v1/webhook_deliveries` lists deliveries newest first. Each entry shows the number of attempts, the latest outcome, and an `event_id` that matches the event body and `X-Lithos-Event-Id`. You can filter by `status`, `event_type`, `event_id`, `resource_id`, and a `created_at` range:

    ```text
    GET /v1/webhook_deliveries?created_at[gte]=2026-07-01T00:00:00Z&created_at[lt]=2026-07-02T00:00:00Z&limit=100
    ```

    To find the delivery of an event you received, filter by its `id`, which is also the `X-Lithos-Event-Id` header:

    ```text
    GET /v1/webhook_deliveries?event_id=evt_test_01HXEV1A2B3C4D5E6F7G8H9JKM
    ```

    To find every delivery about one resource, filter by `resource_id`. For example, `?resource_id=enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM` lists the deliveries of each event about that encounter. Add `event_type` to narrow it to one kind of event.

    `GET /v1/webhook_deliveries/{id}` also shows `last_response_body_snippet` to help investigate a failure.

    To catch up after an outage on your side, list deliveries for the affected time, skip event IDs you have already processed, then fetch each remaining `resource_id` for its current state.

    ## Event types

    | Event | Fires when |
    |---|---|
    | `encounter.created` | Partner submitted a new encounter (`pending_review`). |
    | `encounter.in_review` | Clinician picked up the encounter, or an escalated one returned to review. |
    | `encounter.escalated` | Review paused; read `escalation_reason` to decide whether you need to act. |
    | `encounter.completed` | Clinician signed off; orders and prescriptions are populated. Each requested treatment's `status` is now `approved`, `modified`, or `rejected` (an approved or modified one lists the `treatments[]` it produced), and the plan outcome is on the embedded `care_plan`. |
    | `encounter.canceled` | You canceled before review finished. |
    | `care_plan.active` | Clinician marked the plan eligible at sign-off. |
    | `care_plan.ineligible` | Clinician marked the plan ineligible at sign-off. Read `ineligibility_reason_code` and `clinician_notes`. |
    | `care_plan.refill_due` | At least one treatment on the plan is due for a refill. Read the plan for the entries with `refill_status: eligible`. |
    | `order.created` | Lithos created the order at encounter sign-off. |
    | `order.processing` | Lithos is routing the order to a pharmacy (repeats after a reroute). |
    | `order.placed` | A pharmacy accepted the order into its queue. |
    | `order.completed` | Patient received the order. |
    | `order.canceled` | Order canceled before completion. |
    | `lab_requisition.issued` | The PDF for a signed lab requisition is ready for the patient. |
    | `inquiry.created` | An inquiry was opened, by you or by Lithos when a clinician needs more information. Read `awaiting`. |
    | `inquiry.message_added` | A message was added to the inquiry. Read `awaiting`: when it is `patient`, deliver the care team's message. |
    | `inquiry.resolved` | The care team resolved the inquiry. Further replies are rejected. |
    | `inquiry.closed` | The inquiry was closed. Read `closed_reason` and `closed_note`. |
- name: Authentication
  description: |-
    Requests to the Lithos API require an access token. Include it in the `Authorization` header of every request. If the token is missing, invalid, or doesn't carry the right permissions for the action, the API returns an error.

    Each Lithos customer organization receives a `client_id` and `client_secret` from its Lithos onboarding contact. Your backend exchanges them for a short-lived access token, which authorizes every API call your organization makes — creating patients, submitting encounters, retrieving prescription status, registering insurance, and so on. The token can perform every action your organization is currently provisioned for.

    Keep the secret server-side — never embed it in client-side code or commit it to source control.

    ## Getting an access token

    To get an access token, exchange your `client_id` and `client_secret` through a client credentials flow against the Lithos token endpoint. Lithos brokers token issuance to our identity provider — you only talk to `api.<env>.lithoshealth.com`.

    **Request — Sandbox**

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/oauth2/token \
      --request POST \
      --header "content-type: application/x-www-form-urlencoded" \
      --data "grant_type=client_credentials" \
      --data "client_id=REPLACE_ME" \
      --data "client_secret=REPLACE_ME"
    ```

    Production credentials and the corresponding token endpoint (`https://api.lithoshealth.com/v1/oauth2/token`) are provisioned separately. Ask your Lithos onboarding contact when you're ready to move off sandbox.

    **Response**

    ```json
    {
      "access_token": "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...",
      "token_type": "bearer",
      "expires_in": 3600
    }
    ```

    `expires_in` is the token's lifetime in seconds at the time of issuance. Access tokens are short-lived — repeat this exchange before the lifetime elapses to mint a fresh one.

    Use the `access_token` in the `Authorization` header of every API request:

    ```
    Authorization: Bearer <access_token>
    ```

    <!--
    Staleness flags (source-of-truth migration, step 3):
    - Sourced from `api-spec/guides/authentication.md`, not from the
      `authentication` tag block in `api-spec/openapi.yaml` (which is just
      a stub pointing at the guide). In lithos-api, `Authentication` is
      both the guide-style tag in the "Guides" group AND the operation tag
      for `/v1/oauth2/token` — Scalar renders prose + the operation under
      the same heading, which matches how partners read this.
    -->
- name: Sandbox Encounters
  description: |-
    Use the sandbox encounter endpoints to simulate a clinician's review and test your integration without waiting for a reviewer. You control each step and can verify the resulting prescriptions, care plan updates, and webhooks, including `encounter.completed`, `care_plan.active`, and `order.created`.

    These endpoints use the `/v1/sandbox` prefix, the same authentication as other `/v1` endpoints, and your organization's data. They run the same review logic used in production, but the endpoints themselves are unavailable in production and return `404`.

    ## Move an encounter through review

    An encounter starts in `pending_review`. Use the following actions to advance it:

    ```
    pending_review ──start_review──▶ in_review ──complete──▶ completed
                                        │  ▲
                                    escalate │ resume
                                        ▼  │
                                     escalated
    ```

    | Action | Endpoint | Result |
    |---|---|---|
    | Start review | `POST /v1/sandbox/encounters/{id}/start_review` | Moves the encounter from `pending_review` to `in_review`. Also moves the initial care plan into review. |
    | Request more information (optional) | `POST /v1/sandbox/encounters/{id}/escalate` | Moves the encounter from `pending_review` or `in_review` to `escalated` and creates a patient inquiry. |
    | Resume review | `POST /v1/sandbox/encounters/{id}/resume` | Returns an escalated encounter to `in_review`. Resolving or closing its inquiry also returns it to review. |
    | Complete review | `POST /v1/sandbox/encounters/{id}/complete` | Completes the encounter, writes prescriptions, updates the care plan, and emits the corresponding webhooks. |

    Each action returns the updated `Encounter`. Supply treatment and plan decisions when calling `complete`.

    ### Start an asynchronous review

    Use `start_review` for an asynchronous encounter:

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/sandbox/encounters/enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM/start_review \
      -X POST -H "Authorization: Bearer $LITHOS_TOKEN"
    ```

    ## Request more information

    To escalate an encounter, set `escalation_reason` to `patient_information_required` and include the question in `message_for_patient`. Omitting `message_for_patient` returns `422 validation.failed` at `/message_for_patient`.

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/sandbox/encounters/{encounter_id}/escalate \
      -X POST -H "Authorization: Bearer $LITHOS_TOKEN" -H "Content-Type: application/json" \
      -d '{ "escalation_reason": "patient_information_required",
            "message_for_patient": "What dose are you currently taking?" }'
    ```

    Escalation creates an [Inquiry](#tag/Inquiries) with the subject “More information needed”. Its first message contains your `message_for_patient`, and its `references[]` identifies the encounter.

    The API emits `inquiry.created`. To find the inquiry from the encounter, call `GET /v1/patients/{patient_id}/inquiries` and match the encounter ID in `references[]`. The inquiry's `awaiting` field is set to `patient`; this field is on the inquiry resource, not the webhook payload. Follow the [Inquiries](#tag/Inquiries) guide to relay the conversation.

    To return the encounter to `in_review`, either call its `resume` endpoint or use the [Sandbox Inquiries](#tag/Sandbox-Inquiries) helpers to finish the inquiry:

    - Resolve it with `POST /v1/sandbox/inquiries/{id}/resolve`.
    - Close it with `POST /v1/sandbox/inquiries/{id}/close`, including `note` and a `reason` of `duplicate`, `cancelled`, `out_of_scope`, or `other`.

    Each route emits `encounter.in_review`. Calling `resume` when the encounter is already `in_review` returns `422 sandbox.invalid_transition`.

    Once the encounter is back in `in_review`, you can call `escalate` again to ask the patient another question, or `complete` it. `start_review` returns `422 sandbox.invalid_transition`, because review has already started.

    ## Complete an encounter

    The `complete` request accepts three optional fields:

    | Field | Purpose | Default when omitted |
    |---|---|---|
    | `treatments` | Decisions for individual requests. Each entry identifies a `requested_treatment_id` and sets `status` to `approved`, `rejected`, or `modified`. | Each request follows the plan decision. |
    | `plan` | The overall decision: `eligibility_status` (`eligible` or `ineligible`) and an `ineligibility_reason_code` when ineligible. | The plan is `eligible`. |
    | `lab_orders` | Lab requisitions to sign during completion, supplied as `[{ preset }]`. | No lab requisitions are ordered. |

    `complete` picks the encounter up for you if nobody has. A real sign-off needs a clinician holding the encounter first, and in the sandbox there is no clinician to do that, so this call makes the pickup itself and then signs off — in one step, with one `encounter.completed` webhook. You never have to call `start_review` before it, and calling `start_review` first works exactly the same.

    If no request leaves medication selection to the clinician, an empty body approves all requests and activates the care plan. This includes refills, which continue the existing medication:

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/sandbox/encounters/{encounter_id}/complete \
      -X POST -H "Authorization: Bearer $LITHOS_TOKEN" -H "Content-Type: application/json" \
      -d '{}'
    ```

    If an `add` request leaves medication selection to the clinician, you must supply `dosage_ids` to approve it. See **Choose a medication for a discretionary add** below.

    ### Approve or reject treatment requests

    To reject one request, include its `requested_treatment_id`, set `status` to `rejected`, and provide an `ineligibility_reason_code`. Under an eligible plan, requests you omit default to approved. A discretionary add still requires a medication selection before it can be approved.

    Rejecting a `refill` or `switch` ends the patient's existing treatment: on the care plan, its `status` becomes `completed` and its `current_prescription` becomes `null`.

    To deny the whole plan, set `plan.eligibility_status` to `ineligible` and supply the plan's `ineligibility_reason_code`. Omitted treatment requests are then rejected with that reason. An ineligible plan cannot prescribe medications or order labs.

    ```jsonc
    // Reject one treatment request and keep the plan eligible
    {
      "treatments": [
        { "requested_treatment_id": "rqt_test_01HXEN9Y8X7W6V5T4S3R2Q1P0N",
          "status": "rejected", "ineligibility_reason_code": "duplicate_therapy" }
      ]
    }

    // Deny the care plan
    { "plan": { "eligibility_status": "ineligible", "ineligibility_reason_code": "criteria_not_met" } }
    ```

    Use one of these reason codes: `clinical_contraindication`, `criteria_not_met`, `alternative_preferred`, `duplicate_therapy`, `not_available`, or `other`.

    ### Select medications and strengths

    Use `dosage_ids` on an `approved` or `modified` request to specify what to prescribe. Each ID identifies a medication and strength. Retrieve the available IDs from `dosages[]` in `GET /v1/catalog_treatments/{id}`; see [Catalog Treatments](#tag/CatalogTreatments).

    Every dosage must be available to your organization and belong to the care plan's clinical category. Include only one dosage per catalog treatment in a single request's `dosage_ids`.

    When `dosage_ids` is omitted from an approved request:

    - An `add` or `switch` uses the named medication's starting strength.
    - A `refill` continues the patient's current strength.
    - An `add` without a catalog treatment cannot be completed until you supply a medication selection.

    ### Choose a medication for a discretionary add

    A **discretionary add** leaves medication selection to the clinician. Identify it in `requested_treatments[]` by `action: "add"` and `catalog_treatment_id: null`. Error messages call this a **provider-choice add**.

    To simulate the clinician's selection, set `status` to `approved` and supply `dosage_ids`:

    ```jsonc
    {
      "treatments": [
        { "requested_treatment_id": "rqt_test_01HXEN9Y8X7W6V5T4S3R2Q1P0N",
          "status": "approved",
          "dosage_ids": ["dose_test_01HXDS5K2M9P3Q7R4T6V8W0YZ1"] }
      ]
    }
    ```

    Use `approved` because the request left the medication unspecified. The `modified` status applies when replacing a medication named in the request.

    Completing this encounter with `{}` returns `422 sandbox.completion_invalid`. The message identifies the request that needs a medication: `treatment_decision[rqt_…] is a provider-choice add and must name at least one treatment`.

    ### Substitute a different medication

    Use `modified` on an `add` or `switch` request to prescribe a different medication from the one requested. For example, the request names Wegovy and the clinician prescribes Ozempic. Supply the replacement in `dosage_ids`:

    ```jsonc
    {
      "treatments": [
        { "requested_treatment_id": "rqt_test_01HXEN9Y8X7W6V5T4S3R2Q1P0N",
          "status": "modified",
          "dosage_ids": ["dose_test_01HXDS5K2M9P3Q7R4T6V8W0YZ1"] }
      ]
    }
    ```

    A substitution must change the medication. To prescribe a different strength of the same medication, use `approved`.

    For a `refill`, the first dosage must belong to the treatment's current medication. To request a different medication for that treatment, submit a `switch` when creating the encounter.

    ### Prescribe additional medications

    Supply multiple dosage IDs to prescribe multiple medications for one request. Keep `status` as `approved` when the list includes the requested medication plus additional medications. For example, the clinician may approve Wegovy and add an antiemetic:

    ```jsonc
    {
      "treatments": [
        { "requested_treatment_id": "rqt_test_01HXEN9Y8X7W6V5T4S3R2Q1P0N",
          "status": "approved",
          "dosage_ids": ["dose_test_01HXWG7B4N2Q6R8S1T3V5W7YZ0",
                         "dose_test_01HXAM5P8R3T7V2W4Y6Z9B1CD5"] }
      ]
    }
    ```

    For an `add`, each dosage creates a treatment and prescription. For a `refill` or `switch`, the first dosage continues the existing treatment, and additional dosages create new treatments.

    All resulting treatments appear in the request's `treatments[]` when you retrieve the encounter. See the **Approved — bundled adjunct** example on [Retrieve an encounter](#tag/Encounters/operation/getEncounter).

    ### Combine decisions and read the result

    You can approve, modify, and reject different treatment requests in one completion call:

    ```jsonc
    {
      "treatments": [
        { "requested_treatment_id": "rqt_AAA…", "status": "approved" },
        { "requested_treatment_id": "rqt_BBB…", "status": "modified",
          "dosage_ids": ["dose_test_01HXDS5K2M9P3Q7R4T6V8W0YZ1"] },
        { "requested_treatment_id": "rqt_CCC…", "status": "rejected",
          "ineligibility_reason_code": "clinical_contraindication" }
      ],
      "plan": { "eligibility_status": "eligible" }
    }
    ```

    On success, the response is the completed `Encounter`:

    - `status` is `completed`.
    - Each `requested_treatments[].status` reflects the review decision.
    - Each approved or modified request includes its resulting treatments in `treatments[]`.
    - `care_plan.status` is `active` or `ineligible`.

    The decision describes how the clinician handled the request. `approved` covers prescribing the requested medication, adding medications alongside it, or selecting a medication for a discretionary add. `modified` indicates that the clinician prescribed a replacement medication.

    ## Order lab requisitions

    Include `lab_orders` in the completion request to sign lab requisitions. Each entry specifies a preset, which defines a group of tests:

    ```jsonc
    { "lab_orders": [ { "preset": "lipid-baseline-statin" } ] }
    ```

    Available presets:

    | Preset | Care plan category | Name | Requires |
    |---|---|---|---|
    | `lipid-baseline-pcsk9` | `lipid_management` | Lipid baseline — PCSK9 only | A PCSK9 inhibitor and no statin |
    | `lipid-recheck-pcsk9` | `lipid_management` | Lipid recheck — PCSK9 only | A PCSK9 inhibitor and no statin |
    | `lipid-baseline-statin` | `lipid_management` | Lipid baseline — statin ± PCSK9 | A statin among the approved treatments |
    | `lipid-recheck-statin` | `lipid_management` | Lipid recheck — statin ± PCSK9 | A statin among the approved treatments |
    | `lipid-symptom-ck` | `lipid_management` | Lipid symptom check — CK | A statin among the approved treatments |

    Each preset must belong to the care plan's category, appear only once, and match the medications approved on the plan, as listed in the **Requires** column. Omit `lab_orders` when denying the plan.

    Each requisition is created with status `approved`, and its PDF is queued for generation. The API emits `lab_requisition.issued` when the PDF is ready. Read requisitions from the completed encounter's `lab_requisitions[]` or retrieve one with `GET /v1/lab_requisitions/{id}`.

    ## Handle errors

    | HTTP | Code / pointer | Meaning | Action |
    |---|---|---|---|
    | 404 | `resource.not_found` | The sandbox endpoint is unavailable in production, or the encounter belongs to another organization. | Use the sandbox API with credentials and an encounter from your organization. |
    | 422 | `sandbox.invalid_transition` @ `/status` | The action is not allowed in the encounter's current status. | Read `status` and follow the review sequence above. |
    | 422 | `validation.failed` @ `/treatments/{i}/requested_treatment_id` | The ID is not one of this encounter's requested treatments. | Use an `id` from this encounter's `requested_treatments[]`. |
    | 422 | `validation.failed` @ `/treatments/{i}/ineligibility_reason_code` | A rejected request is missing its reason code. | Supply one of the supported reason codes. |
    | 422 | `validation.failed` @ `/plan/ineligibility_reason_code` | An ineligible plan is missing its reason code. | Supply one of the supported reason codes. |
    | 422 | `validation.failed` @ `/escalation_reason` | The escalation reason is missing or unsupported. | Set `escalation_reason` to `patient_information_required`. |
    | 422 | `validation.failed` @ `/message_for_patient` | The escalation is missing a question for the patient. | Supply `message_for_patient`. |
    | 422 | `validation.failed` @ `/treatments/{i}/dosage_ids` | A modified request lacks dosage IDs, a rejected request includes them, or a request includes multiple dosages of the same catalog treatment. | Supply replacement dosages for a modified request. Omit dosages for a rejected request. Use one dosage per catalog treatment. |
    | 422 | `validation.failed` @ `/treatments/{i}/dosage_ids/{j}` | A dosage is outside the plan's clinical category. | Select a dosage in the plan's category. |
    | 422 | `resource.not_found` @ `/treatments/{i}/dosage_ids/{j}` | A dosage is unavailable to your organization. | Use a dosage returned by `GET /v1/catalog_treatments`. |
    | 422 | `resource.not_found` @ `/lab_orders/{i}/preset` | The preset slug does not exist. | Select a preset from the table above. |
    | 422 | `validation.failed` @ `/lab_orders/{i}/preset` | A preset is outside the plan's category, appears more than once, or is included on an ineligible plan. | Use each preset once, match the plan's category, and omit labs when denying the plan. |
    | 422 | `sandbox.completion_invalid` | The completion violates a clinical rule. See the cases below. | Read the error message and update the decision it identifies. |

    `sandbox.completion_invalid` can occur when:

    - A discretionary add has no medication selection.
    - A selected medication already has an active treatment on the plan. Request a `refill` or `switch` for that treatment instead.
    - A refill's first dosage belongs to a different medication.
    - A modified request does not substitute a different medication.
    - An ineligible plan still includes prescriptions.
    - An eligible plan has no active treatment.
    - A lab preset does not match the approved medications.

    ## Test order fulfillment

    Sandbox orders require manual fulfillment. The API emits `order.created`, but no order is sent to a pharmacy. Use the [Sandbox Orders](#tag/Sandbox-Orders) helpers to advance each order and test the remaining `order.*` webhooks.
  x-displayName: Encounters
- name: Sandbox Orders
  description: |-
    Completing a sandbox encounter creates an `Order` and fires `order.created`, but the order stays `pending`. In production, Lithos routes the order and a pharmacy accepts it; sandbox orders are fulfilled manually, so these endpoints let you drive each transition yourself and fire your `order.processing`, `order.placed`, `order.completed`, and `order.canceled` webhooks.

    Like the encounter helpers, they live under `/v1/sandbox`, only work outside production (`404` elsewhere), and are scoped to your organization with the same auth as the rest of `/v1`.

    ## The fulfillment lifecycle

    ```
    pending ──start_processing──▶ processing ──place──▶ placed ──complete──▶ completed
       │                              ▲  │                 │ │
       │                              └──┼── reroute ──────┘ │
       └──────────── cancel ─────────────┴───────────────────┴──▶ canceled
    ```

    `complete` and `cancel` also work straight from `pending` or `processing` — an order doesn't have to walk every state.

    | Endpoint | What it does |
    |---|---|
    | `POST /v1/sandbox/orders/{id}/start_processing` | Starts — or, from `placed`, restarts — routing (`pending`/`placed → processing`); fires `order.processing`. |
    | `POST …/place` | Moves the order to `placed` (`pending`/`processing → placed`); fires `order.placed`. |
    | `POST …/complete` | Marks the order fulfilled (`pending`/`processing`/`placed → completed`); fires `order.completed`. |
    | `POST …/cancel` | Cancels the order (`pending`/`processing`/`placed → canceled`); fires `order.canceled`. |

    Each call returns the updated `Order` with the matching timestamp set (`processing_at`, `placed_at`, `completed_at`, or `canceled_at`). `completed` and `canceled` are final.

    A new sandbox order returns `pharmacy: null`. When it's still null, `start_processing` and `place` fill it with a test pharmacy, so you can exercise both the null and the populated shape.

    `fulfillment` stays `null` on sandbox orders, because no pharmacy is in the loop to report shipment progress. To build against the populated shape (`status`, `carrier`, `tracking_number`), use the `OrderFulfillment` schema on [Retrieve an order](#tag/Orders/operation/getOrder) and its field examples.

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/sandbox/orders/ord_test_01HXR1A2B3C4D5E6F7G8H9JKMN/start_processing \
      -X POST -H "Authorization: Bearer $LITHOS_TOKEN"
    ```

    ## Errors

    | HTTP | `code` / pointer | Meaning | Fix |
    |---|---|---|---|
    | 404 | `resource.not_found` | The sandbox is disabled (production) or the order is another org's. | Use sandbox credentials; pass your own order. |
    | 422 | `sandbox.invalid_transition` @ `/status` | The order can't take this step (e.g. completing one that's already `canceled`). | Check the order's `status` — `completed` and `canceled` orders can't be advanced. |
  x-displayName: Orders
- name: Sandbox Inquiries
  description: |-
    Non-production helpers that simulate the Lithos staff side of an
    inquiry so you can drive the full conversational loop in sandbox
    without a real care team: post a clinician/care-team reply, resolve,
    or close. These endpoints 404 in production.
  x-displayName: Inquiries
- name: Sandbox Test Clocks
  description: |-
    Some webhooks are **time-triggered**, not event-triggered: `care_plan.refill_due` fires when a line reaches its due date. A test clock lets you simulate that time passing so you can build and test your handling without waiting.

    It only works on sandbox. The clock is one simulated "now" per organization that you advance forward — a singular resource addressed by your token, so there's no id to track. Each advance checks your organization's time-based state again at the new simulated time: refill eligibility, and lab requisition expiry (an approved requisition past its `valid_through` date becomes `expired`). While the clock is set, a requisition issued in that time gets a `valid_through` 90 days after the clock's date, and its PDF prints the clock's issue date. Advancing past a treatment's due date fires `care_plan.refill_due` and flips its `refill_status` to `eligible` — the advance returns immediately and the flip lands within a minute or two, so wait for the webhook or poll the care-plan read.

    | Endpoint | What it does |
    |---|---|
    | `POST /v1/sandbox/test_clock` | Create the org's clock. `frozen_time` optional, defaults to now. |
    | `POST /v1/sandbox/test_clock/advance` | Move the clock forward to `to_time` (must be later). |
    | `GET /v1/sandbox/test_clock` | Read the clock's current simulated time. |
    | `DELETE /v1/sandbox/test_clock` | Remove the clock; the org reverts to the real wall clock. |

    Deleting the clock does not undo an advance. A treatment the advance made `eligible` stays `eligible` until the next daily sweep checks it again at the real time. Submit your refill before you delete the clock. An order that changed status while the clock was set keeps the clock's time in `placed_at` or `completed_at`, so after the delete its `refill_due_at` waits for real time to reach it. In the same way, a lab requisition issued while the clock was set keeps a `valid_through` 90 days after the clock's date, so after the delete it expires only when real time passes that date.

    The same goes for a visit the clock moved into `in_progress`. After the delete it stays `in_progress` until up to an hour after its booked end, in real time. Then it completes and `appointment.completed` fires. To finish it on the clock instead, advance until the visit is `completed` and wait for `appointment.completed` before you delete the clock.

    ```bash
    # create a clock at "now"
    curl https://api.sandbox.lithoshealth.com/v1/sandbox/test_clock \
      -X POST -H "Authorization: Bearer $LITHOS_TOKEN" -H "Content-Type: application/json" -d '{}'

    # jump ahead → a treatment whose order completed becomes refill-due.
    # Pass a time later than the clock's current time; an earlier one returns 422.
    curl https://api.sandbox.lithoshealth.com/v1/sandbox/test_clock/advance \
      -X POST -H "Authorization: Bearer $LITHOS_TOKEN" -H "Content-Type: application/json" \
      -d '{"to_time": "<a time after refill_due_at>"}'
    ```

    ## Errors

    | HTTP | `code` / pointer | Meaning | Fix |
    |---|---|---|---|
    | 404 | `resource.not_found` | No clock exists, or the sandbox is disabled (production). | Create the clock first; use sandbox credentials. |
    | 409 | `sandbox.test_clock_exists` | The org already has a clock. | Reuse it, or `DELETE` it and create a new one. |
    | 404 | `resource.not_found` | `DELETE` when no clock exists, including a second `DELETE`. | Treat it as already deleted. |
    | 422 | `validation.failed` @ `/frozen_time` | `frozen_time` is not a date-time. | Send an ISO 8601 date-time. |
    | 422 | `validation.failed` @ `/to_time` | `to_time` is missing, is not a date-time, or is not later than the clock's current time. | A test clock only moves forward. Pass a later time. |
