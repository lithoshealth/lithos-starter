  encounter.abandoned:
    post:
      tags:
      - Webhooks
      summary: encounter.abandoned
      description: |-
        Fires when a live-visit encounter has been owing a visit for longer than
        your organization's abandonment threshold — its last booking was called
        off or missed, and nothing has been booked since. Read `resource_id` and
        call `GET /v1/encounters/{resource_id}`.

        Book again with `POST /v1/encounters/{encounter_id}/appointments`, the
        same call you used the first time. That is the only thing that clears
        this: while the encounter stays unbooked the event fires again every
        threshold window. You have one full threshold window from this event to
        rebook; after that Lithos may cancel the encounter outright, which fires
        `encounter.canceled`.

        `abandoned_since` is when the encounter started owing the visit — when
        the last booking was canceled or first recorded as missed, not when this
        event fired. Correcting which side missed the visit does not move it.
        A visit corrected to completed ends the abandonment for the whole
        encounter, so if any booking is then corrected back to missed, this is
        the time of that correction. `last_appointment_id` names the last
        booking.
      operationId: webhookEncounterAbandoned
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncounterAbandonedEvent"
            examples:
              avery_chen_encounter_abandoned:
                summary: Avery Chen's visit was never rebooked
                value:
                  id: evt_test_01HXEVAKMNPQRSTVWXYZ12345B
                  type: encounter.abandoned
                  created_at: '2026-09-06T02:30:00Z'
                  resource_id: enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM
                  needs_appointment: true
                  last_appointment_id: appt_test_01HXEN1A2B3C4D5E6F7G8H9JKM
                  abandoned_since: '2026-09-03T15:00:00Z'
                  abandonment_threshold_hours: 72
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
  inquiry.created:
