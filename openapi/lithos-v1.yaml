    | `weight_kg` | number | Yes | Patient weight in kilograms. Range 30–500. |
    | `comorbidities` | array of string | No | Weight-related comorbidities. One of: htn, t2d, dyslipidemia, osa, other. |
    | `mtc_men2_personal` | boolean | Yes | Personal history of medullary thyroid carcinoma (MTC) or MEN2. |
    | `mtc_men2_family` | boolean | Yes | Family history of MTC or MEN2. |
    | `thyroid_cancer` | boolean | Yes | History of thyroid cancer (any type). |
