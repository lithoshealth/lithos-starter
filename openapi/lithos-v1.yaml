  "/v1/encounter_precheck":
    get:
      summary: Precheck an encounter
      tags:
      - Encounters
      operationId: getEncounterPrecheck
      x-internal: true
      description: |-
        Ask before the patient starts intake what `POST /v1/encounters` would say about an encounter for this patient on this care plan, and what the encounter would need. Lithos reads the patient's state and the care plan's `category` and `status` when you call, so ask again after the address or the care plan's status changes.

        An encounter Lithos would refuse is a `200` with `passed: false`, not an error. Each entry in `reasons` has the `code` that `POST /v1/encounters` refuses with. Only checks that need no intake are made here, so the create can still fail validation. This is not insurance eligibility, and not a clinical judgment: the reviewing clinician decides whether the patient qualifies.

        `requirements.modality.value` is `sync` when the patient needs a live video visit. Hold a time, then create the encounter with the hold's `reservation_token`: the [Sync Visits](#tag/sync-visits-guide) guide walks the flow. `async` means no visit. For bookable times, use `GET /v1/appointment_slots`.
      parameters:
      - name: patient_id
        in: query
        required: true
        schema:
          type: string
          pattern: "^pat_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
        description: The patient the encounter is for.
      - name: care_plan_id
        in: query
        required: true
        schema:
          type: string
          pattern: "^cpl_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
        description: The care plan the encounter advances. Must belong to the patient.
      responses:
        '200':
          description: Precheck
          content:
            application/json:
              examples:
                passed:
                  summary: Passed
                  value:
                    passed: true
                    reasons: []
                    requirements:
                      modality:
                        value: async
                failed:
                  summary: Failed
                  value:
                    passed: false
                    reasons:
                    - code: encounter.no_licensed_availability
                      message: No Lithos clinician licensed in CA is taking encounters
                        right now.
                    requirements:
                      modality:
                        value: async
                care_plan_not_encounterable:
                  summary: Care plan cannot take an encounter
                  value:
                    passed: false
                    reasons:
                    - code: care_plan.not_encounterable
                      message: Care plan `cpl_test_01HXEN1A2B3C4D5E6F7G8H9JKM` is
                        in `canceled` and cannot accept a new encounter.
                    requirements:
              schema:
                "$ref": "#/components/schemas/EncounterPrecheck"
        '422':
          description: The patient or care plan is not in your organization, or the
            care plan belongs to another patient (`resource.not_found`). Or a parameter
            is missing or malformed (`validation.failed`)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/v1/encounter_requirements":
    get:
      summary: Read encounter requirements
      tags:
      - Encounters
      operationId: getEncounterRequirements
      x-internal: true
      description: |-
        Ask before you create an encounter to find out if the patient needs a visit. Lithos uses the patient's state and the care plan's `category` and `status`. A plan in `pending_review` is ready for its initial encounter; an `active` plan is ready for follow-ups. Lithos reads the patient's state when you call, so ask again after the address changes.

        `sync` means the patient needs a live video visit. Hold a time, then create the encounter with the hold's `reservation_token`, which books the visit in the same call: the [Sync Visits](#tag/sync-visits-guide) guide walks the flow. `async` means no visit. The encounter you create carries the same `modality`.
      parameters:
      - name: patient_id
        in: query
        required: true
        schema:
          type: string
          pattern: "^pat_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
        description: The patient the encounter is for.
      - name: care_plan_id
        in: query
        required: true
        schema:
          type: string
          pattern: "^cpl_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
        description: The care plan the encounter advances. Must belong to the patient.
      responses:
        '200':
          description: Requirements
          content:
            application/json:
              example:
                requirements:
                  modality:
                    value: async
              schema:
                "$ref": "#/components/schemas/EncounterRequirements"
        '422':
          description: The patient or care plan is not in your organization, or the
            care plan belongs to another patient (`resource.not_found`). The care
            plan cannot take a new encounter because it is neither `pending_review`
            nor `active` (`care_plan.not_encounterable`). Or a parameter is missing
            or malformed (`validation.failed`)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
