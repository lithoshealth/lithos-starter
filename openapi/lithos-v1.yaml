- name: Sandbox Signup
  description: |-
    Get sandbox credentials yourself, without waiting for Lithos to provision you. One unauthenticated call:

    | Endpoint | What it does |
    |---|---|
    | `POST /v1/sandbox/signups` | Takes your email and a name for your organization, creates a sandbox organization with every program in its formulary, and returns its `client_id` and `client_secret`. |

    The client secret is in that response and nowhere else: Lithos doesn't store it and cannot show it again. Store it before you do anything else.

    Each call creates a **new** organization with its own credentials and webhook endpoint, so the starter app and your own app never share one. One email may hold up to three at a time.

    Sandbox only. In production, credentials are issued by Lithos when your contract starts.

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/sandbox/signups \
      -X POST -H "Content-Type: application/json" \
      -d '{"email": "you@yourcompany.com", "organization_name": "Eucardia Health"}'
    ```

    ## Errors

    | HTTP | `code` / pointer | Meaning | Fix |
    |---|---|---|---|
    | 404 | `resource.not_found` | Self-signup is not available in this environment. | Use the sandbox, or ask Lithos for credentials. |
    | 422 | `sandbox_signup.email_not_allowed` @ `/email` | Not an email address. | Send a valid email address. |
    | 422 | `sandbox_signup.limit_reached` @ `/email` | This email already holds three sandbox organizations. | Reuse one, or ask Lithos to archive one. |
    | 429 | `rate.limited` | Too many signups from this email or address in the last hour. | Wait for `Retry-After`. |
    | 502 | `sandbox_signup.provisioning_failed` | The organization could not be created. | Try again shortly. |
