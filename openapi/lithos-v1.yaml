    WebhookEndpointCreate:
      type: object
      required:
      - url
      additionalProperties: false
      description: Request body for registering a new webhook endpoint. Your organization
        may have at most one active endpoint at a time.
      properties:
        url:
          type: string
          format: uri
          description: 'The URL Lithos will POST webhook events to. It must be `https://`
            on port 443, and its host must resolve in public DNS to a public address:
            private, loopback, link-local and reserved addresses are rejected. Lithos
            checks the host again before every delivery.'
          example: https://verda.example.com/hooks
    WebhookDelivery:
      type: object
      required:
      - id
      - event_id
      - status
      - event_type
      - resource_id
      - data
      - attempt_count
      - last_response_code
      - last_error_class
      - occurred_at
      - delivered_at
      - last_attempted_at
      - next_retry_at
      - created_at
      description: One event sent, or waiting to be sent, to your endpoint. The row
        keeps how many attempts were made and the outcome of the most recent one;
        earlier attempts are not kept. The event fields (`event_id`, `event_type`,
        `resource_id`, `occurred_at`, `data`) are the ones the envelope carried.
      properties:
        id:
          type: string
          description: Lithos webhook delivery identifier. Sandbox IDs include `_test_`.
          pattern: "^whd_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
          example: whd_test_01HXWD1A2B3C4D5E6F7G8H9JKM
        event_id:
          type: string
          description: The `id` of the event this delivery carried — the same value
            as the envelope `id` and the `X-Lithos-Event-Id` header. Match it against
            the event ids you have already processed.
          pattern: "^evt_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
          example: evt_test_01HXEV1A2B3C4D5E6F7G8H9JKM
        status:
          type: string
          description: Where the delivery is. `pending` — queued, not yet attempted;
            `delivering` — an attempt is in flight; `succeeded` — your endpoint answered
            2xx; `failed` — the last attempt got a non-2xx answer or no answer at
            all, and a retry is scheduled at `next_retry_at`; `exhausted` — Lithos
            stopped trying, usually because the 72-hour retry window ran out or the
            endpoint was disabled; `last_error_class` says why.
          enum:
          - pending
          - delivering
          - succeeded
          - failed
          - exhausted
          example: succeeded
        event_type:
          type: string
          description: The event type, e.g. `encounter.completed`. Can also be `webhook.test`,
            a test delivery Lithos sent to check your endpoint; its `resource_id`
            is your endpoint id and there is nothing to fetch.
          example: encounter.completed
        data:
          type: object
          additionalProperties: true
          description: Whatever the event carried beyond `resource_id`, exactly as
            it was delivered — `{}` for the events that carry nothing. A few event
            types add one field here, for a fact the resource they name does not itself
            hold. With `event_id`, `event_type`, `occurred_at` and `resource_id` it
            rebuilds the envelope you missed.
          example: {}
        resource_id:
          type: string
          description: ID of the resource the event concerns. Prefix matches the event
            family.
          example: enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM
        attempt_count:
          type: integer
          description: How many times Lithos has sent this delivery to your endpoint,
            counting the attempt in flight while `delivering`.
          minimum: 0
          example: 1
        last_response_code:
          type:
          - integer
          - 'null'
          description: The HTTP status your endpoint answered on the last attempt.
            `null` before the first attempt, while `delivering`, and when the last
            attempt got no HTTP answer (a timeout or a refused connection).
          example: 200
        last_error_class:
          type:
          - string
          - 'null'
          description: Why the last attempt failed, or why Lithos stopped trying.
            `non_2xx` — your endpoint answered with a non-2xx status; `ssrf_blocked`
            — your URL failed the check Lithos runs before every send (it no longer
            resolves, or resolves to a private address); a network error name such
            as `Faraday::ConnectionFailed` or `Faraday::TimeoutError` — no HTTP answer;
            `endpoint_disabled` — the endpoint was disabled before this delivery went
            out; `expired` or `attempt_limit` — Lithos gave up on a delivery that
            could not be sent. `null` before the first attempt, while `delivering`,
            and once `succeeded`.
          example:
        occurred_at:
          type: string
          format: date-time
          description: When the originating event fired server-side.
          example: '2026-04-30T10:15:00Z'
        delivered_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When your endpoint acknowledged the delivery with a 2xx response.
            `null` until `status` is `succeeded`.
          example: '2026-04-30T10:15:00Z'
        last_attempted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the most recent delivery attempt. `null` while
            `pending`.
          example: '2026-04-30T10:15:00Z'
        next_retry_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the next retry is scheduled. `null` once in a terminal
            state (`succeeded` or `exhausted`) or while `pending`.
          example:
        created_at:
          type: string
          format: date-time
          description: When the delivery record was created.
          example: '2026-04-30T10:15:00Z'
