        '200':
          description: Delivery acknowledged. Any 2xx counts.
  appointment.scheduled:
    post:
      tags:
      - Webhooks
      summary: appointment.scheduled
      description: |-
        Fires once a booked appointment has its video room and the page the
        patient opens to join. Read `resource_id` and call
        `GET /v1/appointments/{resource_id}`: `patient_join.url` is set from
        this point, and `patient_join.status` says when the patient may open it.
        Rebooking after a no-show or a cancellation fires it again for the new
        appointment. A reschedule does not: its replacement fires
        `appointment.rescheduled` instead.

        Two cases fire nothing. A booking canceled before its room was ready
        never fires this — you get `appointment.canceled` and no
        `appointment.scheduled` for it — and neither does one rescheduled that
        early. Treat `resource_id` on any appointment event as an id worth
        fetching, not as one you must already know.
      operationId: webhookAppointmentScheduled
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AppointmentScheduledEvent"
            examples:
              avery_chen_appointment_scheduled:
                summary: Avery Chen's visit has its room
                value:
                  id: evt_test_01HXEV5E6F7G8H9JKMNPQRSTVW
                  type: appointment.scheduled
                  created_at: '2026-09-08T11:04:40Z'
                  resource_id: appt_test_01HXEN1A2B3C4D5E6F7G8H9JKM
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
  appointment.rescheduled:
    post:
      tags:
      - Webhooks
      summary: appointment.rescheduled
      description: |-
        Fires once a rescheduled visit's replacement has its video room, in
        place of `appointment.scheduled`. `resource_id` is the new appointment;
        `previous_appointment_id` is the booking it closes out, which is
        `canceled` with `reason: rescheduled`.

        No `appointment.canceled` fires for the replaced booking. The encounter
        never stopped having a visit, and its `needs_appointment` stays `false`
        throughout — there is nothing for the patient to rebook.

        `previous_appointment_id` is always a booking you were sent an event
        for. A visit moved again before the first replacement's room was ready
        announces nothing for that middle booking, and the event you do get
        names the booking you already hold instead — so moving a visit twice in
        quick succession sends one `appointment.rescheduled`, naming the
        booking from your last event rather than the row it directly replaced.
        Read `GET /v1/encounters/{encounter_id}/appointments` for every row in
        the chain, including the ones no event named.
      operationId: webhookAppointmentRescheduled
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AppointmentRescheduledEvent"
            examples:
              avery_chen_appointment_rescheduled:
                summary: Avery Chen's visit moved to a new slot
                value:
                  id: evt_test_01HXEV6F7G8H9JKMNPQRSTVWXY
                  type: appointment.rescheduled
                  created_at: '2026-09-08T12:15:00Z'
                  resource_id: appt_test_01HXEN2B3C4D5E6F7G8H9JKMNP
                  previous_appointment_id: appt_test_01HXEN1A2B3C4D5E6F7G8H9JKM
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
  appointment.started:
    post:
      tags:
      - Webhooks
      summary: appointment.started
      description: |-
        Fires when the appointment moves from `scheduled` to `in_progress`: the
        patient and the clinician were in the room at the same moment. When
        you fetch the appointment after this event, its `status` is
        `in_progress` or a later result, never `scheduled`.

        Fires once per appointment. One person in the room alone fires nothing,
        whichever side it is. Read `progress` on the appointment for that:
        `waiting_for_clinician` says the patient is in the room by themselves,
        `waiting_for_patient` says the clinician is, and `under_way` says both
        are. Someone leaving and rejoining does not fire it again, and does not
        move `status` back.

        Nothing fires for a visit the two never shared. A clinician who waits
        and a patient who never arrives ends as `appointment.no_show` with
        `status: patient_no_show`, with no `appointment.started` before it.

        So `appointment.completed` can arrive with no `appointment.started`
        before it. That happens when the clinician completes a visit that was
        still `scheduled`, or when the two joined at different times and were
        never in the room together. And a visit that did start can still end
        as `appointment.no_show`, when Lithos corrects its result.

        It can arrive late — after `appointment.completed` for the same visit —
        when a first delivery failed and the retry lands after the visit is
        over. It reports that the visit began, not what the visit is now, so it
        never replaces a terminal event you already hold. Read the
        appointment's `status` for where the visit landed.

        It can also arrive BEFORE `appointment.scheduled` for the same booking,
        when that one is still being retried. The room exists by then — both
        people joined it — so fetching the appointment gives you
        `patient_join.url` and everything else, and the announcement follows.
      operationId: webhookAppointmentStarted
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AppointmentStartedEvent"
            examples:
              avery_chen_appointment_started:
                summary: Avery Chen's visit started
                value:
                  id: evt_test_01HXEV7A8B9C0D1E2F3G4H5JKM
                  type: appointment.started
                  created_at: '2026-09-10T15:01:12Z'
                  resource_id: appt_test_01HXEN1A2B3C4D5E6F7G8H9JKM
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
  appointment.canceled:
    post:
      tags:
      - Webhooks
      summary: appointment.canceled
      description: |-
        Fires when a booked visit is called off — by you through
        `POST /v1/appointments/{id}/cancel`, by the clinician, or because you
        canceled its encounter with `POST /v1/encounters/{encounter_id}/cancel`.
        Fetch the appointment and read `canceled_by` for who, and `reason` for
        why.

        When only the visit was called off, `needs_appointment` is `true`: the
        encounter still owes a live visit. Offer the patient slots again and
        book with `POST /v1/encounters/{encounter_id}/appointments`, the same
        call you used the first time. When the encounter was canceled,
        `needs_appointment` is `false`, `reason` is `encounter_canceled`, and
        `encounter.canceled` fires too. A reschedule does not fire this — it
        fires `appointment.rescheduled` instead.
      operationId: webhookAppointmentCanceled
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AppointmentCanceledEvent"
            examples:
              avery_chen_appointment_canceled:
                summary: Avery Chen's visit called off
                value:
                  id: evt_test_01HXEV7G8H9JKMNPQRSTVWXYZ1
                  type: appointment.canceled
                  created_at: '2026-09-09T08:30:00Z'
                  resource_id: appt_test_01HXEN1A2B3C4D5E6F7G8H9JKM
                  needs_appointment: true
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
  appointment.completed:
    post:
      tags:
      - Webhooks
      summary: appointment.completed
      description: |-
        Fires when the visit happened. Either the clinician marked it completed,
        or the visit's window closed after both sides had been in the room and
        the call was over. A dropped connection does not complete a visit: while
        the window is open, the patient can join again.

        Fires once per appointment, whichever of those got there first. Nothing
        is asked of you: the encounter's `needs_appointment` is `false` and the
        clinician can now complete the encounter, which fires
        `encounter.completed` in its own right.

        An ops correction of a visit previously reported as a no-show fires this
        too. When it does, treat it as replacing the earlier
        `appointment.no_show` — the patient does not need to rebook after all.
      operationId: webhookAppointmentCompleted
