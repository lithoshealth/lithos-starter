paths:
  "/v1/appointment_joins":
    post:
      summary: Resolve a patient join token
      tags:
      - Appointments
      operationId: resolveAppointmentJoin
      x-internal: true
      description: 'Turns the token in a patient''s join link into the visit and the
        partner identity the join page renders. **Unauthenticated by design** — the
        patient has no access token, so the join token is the whole credential, which
        is why it is opaque and is not the appointment id. It is a POST because of
        that: the token goes in the body, where it is kept out of access logs, rather
        than in a URL. Nothing is created — send it again as often as you need. The
        token is resolved against the `host` field, which the join page''s server
        sets to the hostname the patient''s browser asked it for. A partner''s verified
        visit domain serves only that partner, the Lithos host serves every organization,
        and a host nobody owns serves nothing — so a token opened on the wrong domain
        is refused. Because the caller supplies both halves, this pairing is what
        stops a domain pointed at the join page from serving other partners'' visits;
        it is not a second credential. Read it again before opening `patient_join.url`
        — the window is derived from the current time, so a cached response is a wrong
        one.'
      security: []
      parameters: []
      responses:
        '200':
          description: The visit and the partner identity to render it with
          content:
            application/json:
              example:
                appointment:
