      - type: object
        properties:
          type:
            type: string
            const: encounter.in_review
          resource_id:
            type: string
            description: ID of the encounter that entered clinician review.
            pattern: "^enc_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
            example: enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM
    EncounterEscalatedEvent:
      allOf:
