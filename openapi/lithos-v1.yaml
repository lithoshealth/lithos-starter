- name: intake-schemas
  description: |-
    `intake_form.data` on `POST /v1/encounters` is validated against the schema for the
    care plan's category and the encounter type Lithos infers from the plan's state.
    A field that fails — wrong type, out of range, or a missing required key — returns
    `422 intake_form.schema_invalid` with the offending field in `source.pointer`.

    **Numbers are sent as numbers.** A field typed `number` below takes a JSON number —
    `95` or `95.5`. A string is rejected with `422 intake_form.schema_invalid` at that
    field, so `"95"` fails where `95` passes. An HTML form posts every value as text, so
    convert those fields before you build the body.

    **Validating `intake_form.data`.** Each finalized schema below has a **Download JSON
    Schema** link. Check your `intake_form.data` against that file with any JSON Schema
    validator (such as Ajv) before you send it, to catch missing required fields and bad
    values early.

    **Sending files.** Any top-level field whose name ends in `_upload_id` is redeemed into a
    patient document when the encounter is created, and the stored intake carries the matching
    `_document_id` from then on. That applies to the fields listed below and to extra
    `_upload_id` fields you add yourself, so a file you send under your own field name still
    reaches the patient's record. Put upload ids at the top level — one nested inside an array
    or object is not redeemed, and that file never reaches the record. If an upload can't be
    redeemed — already used, expired, or the bytes don't match the checksum — a field listed
    below fails the request, while a field you added is left untouched and the encounter is
    still created.

    ## Weight management · initial

