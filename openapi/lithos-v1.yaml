      - type: object
        properties:
          type:
            type: string
            const: encounter.escalated
          resource_id:
            type: string
            description: ID of the escalated encounter.
            pattern: "^enc_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
            example: enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM
    EncounterCompletedEvent:
      allOf:
