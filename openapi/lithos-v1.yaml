      operationId: createEncounter
      description: |-
        Creates a clinical encounter for a patient against a care plan. `intake_form.data` is validated against the schema for the care plan's category and encounter type — see the [Intake Schemas](#tag/intake-schemas) guide for the field shape per combination.

        `422 encounter.no_licensed_availability` means no Lithos clinician licensed in the patient's state can take the encounter right now, so nobody could review it. Nothing is created. Check that the patient's address is current. If it is, try again later, and contact your Lithos onboarding contact if it keeps happening.
