  "/v1/appointments/{appointment_id}/reschedule":
    parameters:
    - name: appointment_id
      in: path
      required: true
      description: Lithos appointment ID — the visit being moved.
      schema:
        type: string
        pattern: "^appt_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      summary: Reschedule an appointment
      tags:
      - Appointments
      operationId: rescheduleAppointment
      x-internal: true
      description: 'Moves the visit to a slot you already hold. Hold the new slot
        first with `POST /v1/slot_reservations`, then send its `reservation_token`
        here. This is one call, not a cancel and a rebooking: the encounter never
        owes a visit in between, `needs_appointment` stays `false`, and if anything
        fails the original visit is still scheduled and your hold is unspent. The
        response is the NEW appointment; the one it replaced is `canceled` with `reason:
        rescheduled` and points here through `rescheduled_to_id`. Take the hold from
        `GET /v1/appointments/{appointment_id}/reschedule_slots`: it leaves this visit
        out of the grid, and keeps the move with the clinician the patient is already
        with when your organization keeps continuity of care. The room is set up right
        after, and `appointment.rescheduled` fires when it is ready — `appointment.canceled`
        does not fire on this path. `patient_join.url` is set in this response, and
        it is the link of the visit being moved. A visit within your organization''s
        cancellation notice — 4 hours by default — cannot be moved: this answers `409
        appointment.cancellation_window_closed`, measured against the booking you
        are moving rather than the slot you are moving it to.'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Create a key for each reschedule attempt (a UUID works), up to
          255 characters. Retry with the same key and body to get the first response.
          Reusing the key with a different body is refused. You can retry for 30 days
          after the first request. After that, Lithos treats the retry as a new request
          and refuses it because the hold has already been used.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '201':
          description: The visit is moved — this is the new appointment
          content:
            application/json:
              example:
                id: appt_test_00000000000000000000000001
                encounter_id: enc_test_00000000000000000000000001
                status: scheduled
                starts_at: '2026-05-04T15:00:00Z'
                ends_at: '2026-05-04T15:15:00Z'
                canceled_by:
                reason:
                rescheduled_to_id:
                created_at: '2026-04-30T10:15:00Z'
                updated_at: '2026-04-30T15:30:00Z'
                completed_at:
                patient_no_show_at:
                clinician_no_show_at:
                canceled_at:
                cancellation_closes_at: '2026-05-04T11:00:00Z'
                cancelable: true
                progress: not_started
                clinician:
                  first_name: Maya
                  last_name: Patel
                  profile_picture_url:
                patient_join:
                  status: provisioning
                  opens_at:
                  closes_at:
                  url: https://join.example.com/j/jt_test
              schema:
                "$ref": "#/components/schemas/Appointment"
        '409':
          description: The visit is no longer scheduled, it starts too soon to be
            moved, the hold is no longer active, or the Idempotency-Key was already
            spent on a different request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: Validation failure — the token cannot be read, the hold was
            taken for another patient or care plan, the encounter no longer takes
            a visit, the clinician the hold names is not licensed in the patient state
            (`clinician.not_licensed_in_state`) or is not the one this patient keeps
            (`clinician.not_preferred`), the hold was issued to move a different visit
            (`slot_reservation.rescheduling_mismatch`), or the Idempotency-Key is
            missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AppointmentReschedule"
        required: true
  "/v1/appointments/{appointment_id}/cancel":
    parameters:
    - name: appointment_id
      in: path
      required: true
      description: Lithos appointment ID.
      schema:
        type: string
        pattern: "^appt_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      summary: Cancel an appointment
      tags:
      - Appointments
      operationId: cancelAppointment
      x-internal: true
      description: 'Calls the visit off. The appointment becomes `canceled` with `canceled_by:
        partner` and the `reason` you send. While the encounter is open, its `needs_appointment`
        turns `true` — offer slots again and book with `POST /v1/encounters/{encounter_id}/appointments`.
        The encounter itself is not changed. To move the visit rather than call it
        off, use `reschedule`: it keeps the visit and fires a different event. Both
        need warning: once the visit is within your organization''s cancellation notice
        — 4 hours by default — this answers `409 appointment.cancellation_window_closed`
        and the message names the instant the window shut. A clinician can still call
        their own visit off at any time, so the booking may end `canceled` with `canceled_by:
        clinician`.'
      parameters: []
      responses:
        '200':
          description: The visit is canceled
          content:
            application/json:
              example:
                id: appt_test_00000000000000000000000001
                encounter_id: enc_test_00000000000000000000000001
                status: canceled
                starts_at: '2026-05-04T15:00:00Z'
                ends_at: '2026-05-04T15:15:00Z'
                canceled_by: partner
                reason: Patient asked to cancel
                rescheduled_to_id:
                created_at: '2026-04-30T10:15:00Z'
                updated_at: '2026-04-30T15:30:00Z'
                completed_at:
                patient_no_show_at:
                clinician_no_show_at:
                canceled_at: '2026-04-30T15:30:00Z'
                cancellation_closes_at:
                cancelable: false
                progress: settled
                clinician:
                  first_name: Maya
                  last_name: Patel
                  profile_picture_url:
                patient_join:
                  status: closed
                  opens_at: '2026-05-04T14:50:00Z'
                  closes_at: '2026-05-04T15:10:00Z'
                  url:
              schema:
                "$ref": "#/components/schemas/Appointment"
        '409':
          description: The visit is in progress or has ended (`appointment.not_scheduled`),
            or it is too close to the start time to cancel (`appointment.cancellation_window_closed`)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: Validation failure — `reason` is missing, too long, or the
            value reserved for a replaced booking
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AppointmentCancel"
        required: true
