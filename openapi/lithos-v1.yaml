- name: retries-guide
  description: |-
    If a create request times out or the connection drops, you may not know whether it succeeded. Send an `Idempotency-Key` with the request so you can safely try it again.

    ## Send a key

    Generate a new key for each new request. A UUID is a good choice. Send it in the `Idempotency-Key` header:

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/patients \
      -X POST \
      -H "Authorization: Bearer <your_access_token>" \
      -H "Content-Type: application/json" \
      -H "Idempotency-Key: 5f1c2e9a-8b7d-4c3e-9f10-2a6b4d8e0c11" \
      -d '{ ... }'
    ```

    The header is optional on these requests. If you leave it out, each request is handled as a new request.

    - `POST /v1/patients`
    - `POST /v1/care_plans`
    - `POST /v1/encounters`
    - `POST /v1/encounters/{encounter_id}/cancel`
    - `POST /v1/insurances`
    - `POST /v1/patients/{patient_id}/documents`
    - `POST /v1/uploads`
    - `POST /v1/patients/{patient_id}/inquiries`
    - `POST /v1/inquiries/{inquiry_id}/messages`
    - `POST /v1/webhook_endpoints`

    ## If you need to retry

    Send the **same key, URL path, and JSON body**. Lithos returns the same resource and the same HTTP status as the first successful request. It does not create another resource. The response shows the resource's *current* details, so fields may have changed since the first request. JSON field order and whitespace do not matter.

    If the first request failed, you can fix it and try again with the same key. A failed request does not use the key.

    Use a **new key** for a new request, even if it goes to the same endpoint. If you use an existing key with a different body, or for a different resource on the same endpoint, Lithos returns `409 idempotency_key.reused`. This includes using the same key to cancel a different encounter.

    Keys are separate for each organization and endpoint. Lithos keeps a key for **30 days** after its first successful use. After that, the same key is treated as new. Keys can be up to 255 characters. They are case sensitive; empty keys, spaces only, and keys that are too long return `422 idempotency_key.invalid`.

    If two identical requests with the same key arrive at once, the second waits and receives the first request's result. If the first request fails, the second runs as a new attempt.

    ## Special cases

    - **Webhook endpoints:** If you retry `POST /v1/webhook_endpoints` with the same key, Lithos returns the signing secret again. If the secret has been rotated, that key no longer replays the create request. See the Webhooks guide.
    - **Uploads:** A retry of `POST /v1/uploads` returns the same upload and a usable `upload_url` until `upload_url_expires_at`. After the URL expires, or if the uploaded bytes were discarded because they did not match the checksum, the retry returns `410 upload.url_expired`. If the upload has already been used, it returns `409 upload.already_used`. In either case, create a new upload with a new key.
