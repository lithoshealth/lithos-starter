- name: sync-visits-guide
  description: |-
    Sync visits are live video appointments with a Lithos clinician. Your integration checks whether an encounter needs one, lets the patient choose a time, books the visit, and links the patient to the Lithos join page. Lithos handles the video room and clinician review.

    The usual flow is:

    1. Precheck the encounter before intake.
    2. Show available times and hold the patient's choice.
    3. Create the encounter with the held time.
    4. Send the patient the join link and show a "Join visit" button.

    A patient can choose a time before the encounter exists. Hold it while they finish intake and payment, then create the encounter with the hold in one call.

    ## 1. Precheck the encounter before intake

    Call this before the patient starts intake. It tells you whether Lithos can take the encounter and whether it needs a visit. Lithos reads the patient's state and the care plan's category and status.


    ```
    GET /v1/encounter_precheck?patient_id=pat_…&care_plan_id=cpl_…
    ```

    Precheck before you hold a slot. If `passed` is `false`, stop: `reasons` says why, and `POST /v1/encounters` would refuse with the same `code`. `encounter.no_licensed_availability` means no Lithos clinician licensed in the patient's state can take the encounter right now; precheck again later. Once you hold a slot, create the encounter with its `reservation_token` and don't precheck again: the hold keeps its clinician, so the create can succeed even when a new precheck would report `encounter.no_licensed_availability`. This is not an insurance check or a clinical one: the clinician decides whether the patient qualifies.

    If `requirements.modality.value` is `sync`, continue below: a sync encounter can only be created together with its first visit. If it is `async`, create the encounter as usual, without a `reservation_token`. Ask again if the patient's address or the care plan's status changes. After creating an encounter, use its `modality` and `needs_appointment` fields to drive your UI.

    ## 2. Offer a time and hold it

    Fetch available starts and show them to the patient:

    ```
    GET /v1/appointment_slots?patient_id=pat_…&care_plan_id=cpl_…&from=2026-09-24T00:00:00Z&to=2026-10-01T00:00:00Z
    ```

    Each slot includes `starts_at`, `duration_minutes`, and a `slot_token`. Starts come every 15 minutes from the top of the hour, in the clinician's time zone. A clinician's first start is when their hours begin, even between those marks. If their hours begin off a five-minute mark, say at 09:07, the later starts shift with it: 09:07, 09:17, 09:32. Starts next to time that is booked or held are also offered, even between those marks: the first time the clinician is free again, and the last start that ends before the booked time or before their hours end. A visit can then sit right up against another one.

    If `slots` is empty, use `reason` to explain why: `no_licensed_availability` means another date range will not help; `no_slots_in_range` means you can try again from `next_available`, if present.

    `starts_at` is in UTC. Show visit times in the patient's `time_zone`, with the zone's abbreviation ("2:30 PM CDT"), so they match the Lithos join page. When `time_zone` is `null`, Lithos can't place the patient's ZIP code and shows Eastern Time (`America/New_York`). If you know the zone, set it with `PATCH /v1/patients/{patient_id}`.

    Keep the range within 14 days (plus 1 hour for daylight-saving changes). Your organization's minimum notice and booking horizon also limit the results. A `slot_token` expires 10 minutes after issuance, so fetch fresh slots when the patient is ready to choose.

    Hold the chosen slot:

    ```
    POST /v1/slot_reservations
    { "slot_token": "a9h1G6…", "patient_id": "pat_…", "care_plan_id": "cpl_…" }
    ```

    Save the returned `reservation_token` and `expires_at`. The hold reserves a specific clinician until you book, release, or reach `expires_at`. Show that clinician to the patient. If the patient stops, release the hold with `POST /v1/slot_reservations/{reservation_token}/release`. If the slot was taken, fetch times again.

    If payment or intake runs long, extend the hold once with `POST /v1/slot_reservations/{reservation_token}/extend` before `expires_at`. It adds one more hold time from now and returns the hold with its new `expires_at`; the `reservation_token` stays the same. A second extension returns `409 slot_reservation.already_extended`, and a hold that is already expired, released or used returns `409 slot_reservation.not_active`.

    ## 3. Create the encounter with the hold

    Create the encounter with [`POST /v1/encounters`](#tag/Encounters/operation/createEncounter) and pass the `reservation_token` in the same body, before the hold expires. The token is required for a sync encounter, and the `Idempotency-Key` header is required with it:

    ```
    POST /v1/encounters
    Idempotency-Key: 6f1c2d0e-…
    {
      "patient_id": "pat_…",
      "care_plan_id": "cpl_…",
      "intake_form": { "data": { … } },
      "requested_treatments": [ … ],
      "reservation_token": "eyJyc3Yi…"
    }
    ```

    Lithos creates the encounter and books the held time together. The response is the encounter with `needs_appointment: false` and the scheduled visit in `latest_appointment`. The encounter endpoint answers `200`, and `POST /v1/slot_reservations` answers `201`, so treat any `2xx` as success.

    The response already carries the patient's join link in `latest_appointment.patient_join.url`, so you can send it to the patient straight away. Lithos sets up the video room in the background, usually within a few seconds. Until the room is ready, `patient_join.status` is `provisioning`; `appointment.scheduled` fires when it is ready. A patient who opens the link before then sees that the visit is being set up, and the page moves on by itself. Lithos sends `encounter.created` first, but webhooks can arrive out of order, so order them by `created_at`.

    Without a token, Lithos refuses a sync encounter with `422 reservation_token.required` and creates nothing; hold a time and send the request again with it.

    If Lithos refuses the booking, it creates no encounter. The hold must still be active and must have been taken for the same `patient_id` and `care_plan_id`.

    | Refusal | What to do |
    | --- | --- |
    | `slot.taken`, `slot_reservation.not_active`, `slot_reservation.encounter_mismatch`, `clinician.not_licensed_in_state` | Fetch times again, hold a new one, and send the same request with the new token. |
    | `slot_reservation.rescheduling_mismatch` | The hold came from `reschedule_slots` and can only move that visit. Hold a time from `GET /v1/appointment_slots` instead. |
    | `encounter.not_bookable` | This encounter would be `async` and needs no visit. Release the hold and create the encounter without a token. |

    Use a unique `Idempotency-Key` for each attempt. If the request times out or returns a server error, retry with the same key and body: you get the first response back, and the visit is booked once. Lithos retains the key for 30 days.

    ## 4. Show the join link

    The appointment's `patient_join.url` opens Lithos's waiting room and video call. Link to that page; your app does not need to host the call. Treat the URL as the patient's credential and send it only to the patient.

    Use `patient_join.status` to control your "Join visit" button:

    | Status | In your UI |
    | --- | --- |
    | `provisioning` | Show that the visit is being prepared. |
    | `too_early` | Show a countdown to `opens_at`. |
    | `joinable` | Open `patient_join.url`. |
    | `closed` | Hide the button. |

    The join window opens before `starts_at`, by a lead your organization sets. It is 10 minutes unless you ask your Lithos contact to change it, and a change applies to visits already booked. Count down to `patient_join.opens_at` rather than subtracting a fixed time from `starts_at`. `patient_join.closes_at` is the last moment the patient can start joining: your organization's grace period past `starts_at`, even when the booking runs longer. A patient who has not joined by then cannot enter later and is recorded as a no-show. A patient who joined in time, and a visit in progress, can remain joinable after `closes_at`, so use `status` rather than comparing timestamps. Refresh the appointment after appointment webhooks and when the patient clicks the button.

    Lithos can serve the join page from your domain. Ask your Lithos contact if you want a branded link; `patient_join.url` will contain the configured domain.

    ## Track the visit

    Use appointment webhooks to refresh the appointment and update your UI:

    | Appointment status | What it means | What to do |
    | --- | --- | --- |
    | `scheduled` | Booked and ready to join. | Show the join flow. |
    | `in_progress` | Patient and clinician have met in the room. | Show that the visit is under way. |
    | `completed` | The visit ended. | Wait for `encounter.completed` for the clinical outcome. |
    | `patient_no_show` or `clinician_no_show` | One side did not join in time. | Offer a new booking if appropriate. |
    | `canceled` | The visit was canceled or rescheduled. | Refresh the encounter and appointment. |

    `appointment.no_show` is one event for both sides. Refresh the appointment and read `status` to learn which side missed the visit: `patient_no_show` means the patient never joined, `clinician_no_show` means the patient joined and the clinician did not. The clinician can record a patient no-show before Lithos would record it on its own, once the visit has started, when they know the patient is not coming.

    `appointment.started` fires when the appointment moves to `in_progress`, once the patient and the clinician are in the room at the same moment. It never arrives while the appointment is still `scheduled`, and a visit the patient never joins has no `appointment.started`. `appointment.completed` can also arrive without one, when the clinician completes a visit that was still `scheduled` or the two joined at different times. A visit that did start can still end as `appointment.no_show` if Lithos corrects its result. To tell a waiting patient whether the clinician is there yet, read `progress` on the appointment. When both parties have joined, the encounter moves to `in_review`. A dropped connection does not end an in-progress visit; the patient can rejoin while `patient_join.status` is `joinable`.

    ## Change a booking

    ### Reschedule

    1. Get available times with `GET /v1/appointments/{appointment_id}/reschedule_slots?from=…&to=…`. The slot at the visit's current start has `current: true`.
    2. Hold a returned `slot_token` with `POST /v1/slot_reservations` as in step 2.
    3. Call `POST /v1/appointments/{appointment_id}/reschedule` with the `reservation_token` and a new `Idempotency-Key`.

    ```
    POST /v1/appointments/appt_…/reschedule
    Idempotency-Key: 9b2e…
    { "reservation_token": "eyJyc3Yi…" }
    ```

    The response is a new appointment. The original stays booked if the reschedule fails. When the new room is ready, `appointment.rescheduled` identifies the new appointment in `resource_id` and the old one in `previous_appointment_id`.

    The patient's join link does not change. The new appointment keeps the `patient_join.url` you already sent, and the response returns it, so there is nothing new to send. The link opens the new time. If the visit is later canceled, the same link says so.

    ### Cancel

    ```
    POST /v1/appointments/appt_…/cancel
    { "reason": "Patient asked to cancel" }
    ```

    Cancellation leaves the encounter in place and sets `needs_appointment` to `true`. To end the encounter too, call `POST /v1/encounters/{encounter_id}/cancel` while the encounter is still `pending_review` and its visit has not started. That cancels the booked visit with it.

    Your organization's cancellation notice applies to cancelling and to every reschedule step. Show Reschedule and Cancel when the appointment's `cancelable` is `true`. If the screen stays open, hide them once `cancellation_closes_at` passes; in sandbox, read the appointment again after you advance the test clock instead. After that, these calls return `409 appointment.cancellation_window_closed`. `cancellation_closes_at` is `null` when your organization requires no notice, or when the visit is no longer `scheduled`. In sandbox, `cancelable` follows your test clock when one is set.

    ### Book again after a cancellation or no-show

    Fetch slots, hold one, and call `POST /v1/encounters/{encounter_id}/appointments` for the same encounter. The encounter keeps its intake. Prior bookings remain in `GET /v1/encounters/{encounter_id}/appointments`.

    If no new appointment is scheduled within 72 hours of the cancellation or no-show, Lithos sends `encounter.abandoned`. Use it to prompt the patient to book again. Lithos staff may then cancel the encounter, which sends `encounter.canceled`.

    ## Appointment webhooks

    The events below are relevant to sync visits. See [Webhooks](#tag/Webhooks) for delivery and signature handling.

    | Event | Fires when | Payload beyond `resource_id` |
    |---|---|---|
    | `appointment.scheduled` | A booking's room is ready and `patient_join.url` is set. | — |
    | `appointment.rescheduled` | A moved visit's new room is ready. | `previous_appointment_id` |
    | `appointment.started` | The patient and the clinician are in the room together. | — |
    | `appointment.canceled` | A booking is called off by you or by a clinician. | `needs_appointment` |
    | `appointment.completed` | The visit is settled as having happened. | — |
    | `appointment.no_show` | The visit did not happen because somebody was absent. | `needs_appointment` |

    ## Test in sandbox

    Create a patient and care plan, then check `GET /v1/encounter_precheck`. Use a setup that returns `sync` for the initial encounter. For example, in sandbox, a patient with a Wyoming address and a `lipid_management` care plan in `pending_review` returns `sync`. Follow the booking flow above and wait for `appointment.scheduled` (or poll until `patient_join.status` leaves `provisioning`). Production rules can differ, so always branch on the precheck response.

    A sandbox [test clock](#tag/Sandbox-Test-Clocks) lets you move the visit through key outcomes. Set it before fetching slots. Advance only after the video room is ready, and derive each target time from the appointment or hold response. The clock moves forward for your whole organization; an advance must land inside a milestone's window rather than jump past it.

    | To test | Advance to | Expected result |
    | --- | --- | --- |
    | Visit starts | `starts_at` plus 1 minute | Appointment `in_progress`; encounter `in_review`. |
    | Visit completes | After the previous step, `closes_at` plus 1 minute | `appointment.completed`. |
    | Patient no-show | `closes_at` plus 1 minute, without advancing into the join window first | `appointment.no_show`; encounter `needs_appointment: true`. |
    | Hold expires | After `expires_at` | Creating the encounter with the hold returns `slot_reservation.not_active`, and no encounter is created. |
    | Hold extended | Before `expires_at`, then extend the hold | The new `expires_at` is one hold time after the test clock's time. |
    | Cancellation notice | After the appointment's `cancellation_closes_at`, if your organization requires notice | `cancelable` is `false`; cancel and reschedule return `appointment.cancellation_window_closed`. |
    | Abandonment | 72 hours plus 1 minute after a no-show or cancellation | `encounter.abandoned`. |

    Clock advances return before the resulting events are processed. Wait for a webhook or poll the resource. The join page and record timestamps use real time, even when the test clock has advanced; check `patient_join.status` instead of opening the join URL to test your button. A `slot_token` also expires on real time. Delete the shared clock when you finish testing. A visit still `in_progress` when you delete the clock stays `in_progress` until up to an hour after its booked end, in real time. Then it completes. Wait for `appointment.completed` first to avoid that.
