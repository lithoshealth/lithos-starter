    WebhookEvent:
      type: object
      description: |-
        Base envelope every webhook delivery uses. Payloads are thin —
        `resource_id` is the ID of the affected resource, never the
        resource itself. Concrete event types (e.g.,
        `EncounterCompletedEvent`) extend this base, pin `type` to a
        constant value, and refine `resource_id` with the matching ID
        pattern. To act on an event, read `resource_id` and call the
        matching `GET` endpoint. A few events add one more field, for a
        fact the named resource does not itself hold; each such type
        declares it.
      required:
      - id
      - type
      - created_at
      - resource_id
      properties:
        id:
          type: string
          description: Unique event identifier. Use this as your idempotency key —
            the same event may be delivered more than once.
          pattern: "^evt_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
          example: evt_test_01HXEV1A2B3C4D5E6F7G8H9JKM
        type:
          type: string
          description: Dotted, lower-snake-case event name. Stable contract; new types
            are non-breaking, renames ship as a new major URL prefix (`/v2/...`).
          example: encounter.completed
        created_at:
          type: string
          format: date-time
          description: When the event fired server-side.
          example: '2026-04-30T15:30:00Z'
        resource_id:
          type: string
          description: ID of the affected resource. The prefix matches the event family
            (`enc_` for `encounter.*`, `cpl_` for `care_plan.*`, `ord_` for `order.*`,
            `inq_` for `inquiry.*`, `lbr_` for `lab_requisition.*`). Fetch the resource
            via its `GET` endpoint to act on the event.
    EncounterCreatedEvent:
      allOf:
      - "$ref": "#/components/schemas/WebhookEvent"
      - type: object
        properties:
          type:
            type: string
            const: encounter.created
          resource_id:
            type: string
            description: ID of the created encounter.
            pattern: "^enc_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
            example: enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM
    EncounterInReviewEvent:
