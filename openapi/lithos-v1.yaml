- name: refills-guide
  description: |-
    A refill replaces a treatment's current prescription with a new one, keeping the patient on a treatment they're already approved for.

    **You refill the treatment, not the prescription directly.** To renew the prescription a patient is on, find its treatment in `GET /v1/care_plans/{id}` — the `treatments[]` entry whose `current_prescription.id` matches the prescription — and submit a follow-up encounter naming that entry's `treatment_id`. A clinician signs off, and a fresh prescription takes its place on the same treatment.

    This guide covers the full process, the refill intake, and the one-change-per-treatment rule — the parts the [Encounters](#tag/Encounters) and [CarePlans](#tag/CarePlans) references leave implicit.

    ## The refill process

    ```
    1. Watch      treatments[].refill_status flips to "eligible" on GET /v1/care_plans/{id}
                  (or the care_plan.refill_due webhook fires).

    2. Collect    Prompt the patient to fill out your refill intake form and capture
                  their responses.

    3. Submit     POST /v1/encounters with a refill request naming the treatment_id,
                  plus the intake responses as intake_form.

    4. Read back  On encounter.completed, the approved request's treatments[0] carries
                  the SAME treatment_id with a NEW current_prescription_id.
    ```

    A `treatment_id` (`thr_…`) is stable for the life of the treatment and outlives any single prescription. It's the key you store and re-use across every refill.

    ## One treatment, many prescriptions

    A treatment carries one active prescription at a time. The `treatment_id` is constant for the treatment's whole life; each action you take on it resolves to a new prescription and moves the treatment's fields differently:

    | Action | You send | Effect on the treatment |
    |---|---|---|
    | `add` | `{ action: "add", catalog_treatment_id }` | **Opens a new treatment** — a fresh `treatment_id` is minted. Writes the first `Prescription` (sets `current_prescription_id`), `status: active`. No `treatment_id` is sent because none exists yet. |
    | `refill` | `{ action: "refill", treatment_id }` | **Same treatment, next prescription.** `treatment_id` and `catalog_treatment_id` unchanged; `current_prescription_id` advances to the new Rx; `status` stays `active`. |
    | `switch` | `{ action: "switch", treatment_id, catalog_treatment_id }` | **Same treatment, different catalog treatment.** `treatment_id` unchanged; `catalog_treatment_id` moves to the target; `current_prescription_id` advances to the new Rx; `status` stays `active`. |

    The one id you store — `treatment_id` — never changes: `add` mints it, and `refill` / `switch` both reference that same id. What moves between encounters is `current_prescription_id` (a new Rx on add / refill / switch) and `catalog_treatment_id` (only on switch).

    ## Knowing when a refill opens

    `treatments[].refill_due_at` is the timestamp the refill window opens — a precomputed date, already on the care-plan read. To show "refill opens in 4 days," diff `refill_due_at` against now. `refill_status` flips to `eligible` once `refill_due_at` has passed.

    Both fields are computed from the treatment's active prescription and its order:

    | Field | How it is computed |
    |---|---|
    | `refill_due_at` | The order's `completed_at` when the pharmacy reports completion, otherwise its `placed_at`, plus the prescription's days supply, minus your organization's refill lead days. Set once the order has reached `placed` or `completed`; null before that, and null again if the order is canceled. A pharmacy handing the order back for re-routing moves it to `processing` but keeps `placed_at`, so the date stands through a reroute. |
    | `refill_status` | `pending` while a refill or switch on this treatment is waiting on review. Otherwise `eligible` once `refill_due_at` has passed, and `not_eligible` before that. Always `not_eligible` for a completed treatment. |

    ### When these fields update

    Both fields are **stored values**, not recomputed on every read. Three things write them:

    | What happens | What it does to the fields |
    |---|---|
    | The order reaches `placed`, `completed` or `canceled` | `refill_due_at` is rewritten from the order's new timestamps. Those are the three statuses that move it; the others leave the date where it was. |
    | An encounter is signed off | Every treatment the encounter touched is rewritten. A granted refill starts a new prescription whose order isn't fulfilled yet, so the line drops out of `eligible` and its `refill_due_at` goes null until that order is placed. |
    | The daily sweep runs, at 02:00 UTC | Every active treatment is rewritten. This is what catches a `refill_due_at` that has simply arrived — the passage of time, which no request announces — and it is the only thing that sends `care_plan.refill_due`. |

    So `refill_due_at` is on the care-plan read as soon as the order is placed, and a line stops reading `eligible` as soon as the refill is granted.

    Two things still wait for the sweep:

    - **A line becoming `eligible`.** The due date passes overnight, the sweep sees it, and `care_plan.refill_due` goes out. That is the event to key off if you want to act the moment a refill opens.
    - **The `pending` value.** Submitting a refill does not immediately make the line `pending`, and cancelling or abandoning that follow-up does not immediately take it back out. You don't need the field to protect you, though: a second refill on a treatment that already has one in review is rejected with `422 encounter.treatment_change_pending`, and that check reads the encounters directly rather than this field. Treat `pending` as a hint, and the error as the answer.

    The sweep runs daily in sandbox too. Once your organization has a test clock, it sweeps at the clock's frozen time, so it is advancing the clock — not waiting for 02:00 — that moves a line to `eligible`. See below.

    ## Testing `care_plan.refill_due` in sandbox

    A refill comes due weeks after fulfillment, so you don't have to wait to test your handling. A sandbox **test clock** moves your organization's clock forward so the window opens on demand and `care_plan.refill_due` fires for real.

    **1. Get a refillable treatment.** A treatment only becomes due once its order reaches fulfillment — `placed` or `completed` is what `refill_due_at` is computed from (the clock starts at the order's completion when the pharmacy reports it, else at placement). Open and complete an encounter, then move its order to `placed` or `completed` (see the [Sandbox Orders](#tag/Sandbox-Orders) helpers). Read the treatment's `treatment_id` and `refill_due_at` from `GET /v1/care_plans/{id}` — the due date is on the read as soon as the order is placed.

    **2. Create the clock** (one per organization, starting at now):

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/sandbox/test_clock \
      -X POST -H "Authorization: Bearer $LITHOS_TOKEN" -H "Content-Type: application/json" -d '{}'
    ```

    **3. Advance past the due date.** Pass a `to_time` later than the treatment's `refill_due_at`. Each advance runs the sweep at the new simulated time:

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/sandbox/test_clock/advance \
      -X POST -H "Authorization: Bearer $LITHOS_TOKEN" -H "Content-Type: application/json" \
      -d '{"to_time": "<a time after refill_due_at>"}'
    ```

    `care_plan.refill_due` is delivered for the treatment shortly after the advance, and from then on its `refill_status` reads `eligible` on `GET /v1/care_plans/{id}` — wait for the webhook, or poll the read.

    **4. Submit the refill** exactly as below — the treatment is now `eligible`.

    **5. Reset when done:** `DELETE /v1/sandbox/test_clock` returns your organization to the real clock.

    The clock changes when time-based webhooks fire. It also sets the time on an order's status change: while your organization has a clock, an order that moves to `processing`, `placed`, `completed` or `canceled` gets `processing_at`, `placed_at`, `completed_at` or `canceled_at` from the clock, so its `refill_due_at` counts from the clock too. `created_at` and `updated_at` stay on real time. Full reference: [Sandbox Test Clocks](#tag/Sandbox-Test-Clocks).

    ## Submitting a refill

    Once a treatment is `eligible`, collect the patient's refill intake and `POST /v1/encounters`. Identify the treatment by its `treatment_id` — the `treatments[]` entry whose `current_prescription.id` is the prescription you're renewing — alongside the same `care_plan_id` and `patient_id`:

    ```bash
    curl https://api.sandbox.lithoshealth.com/v1/encounters \
      -X POST \
      -H "Authorization: Bearer $LITHOS_TOKEN" \
      -H "Content-Type: application/json" \
      -d '{
        "patient_id": "pat_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ",
        "care_plan_id": "cpl_test_01HXCP1A2B3C4D5E6F7G8H9JKM",
        "intake_form": {
          "data": {
            "current_medication": "Wegovy",
            "current_dose": "1mg",
            "weeks_at_dose": 4,
            "adherence": "on_schedule",
            "weight_kg": 89.8,
            "side_effects": ["mild nausea, improving"]
          }
        },
        "requested_treatments": [
          { "action": "refill", "treatment_id": "thr_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ" }
        ]
      }'
    ```

    ### The refill intake

    `intake_form.data` holds the patient's responses. Lithos validates it against the schema for the plan's category and the inferred encounter type (a refill rides a `follow_up`) — see [Intake Schemas](#tag/intake-schemas) for the field shape. The example above is a weight-management refill check-in: the current medication and dose, weeks at that dose, adherence (`on_schedule` or `missed_doses`), weight in kilograms, and side effects as a list. Missing or invalid keys return `422 intake_form.schema_invalid`.

    ## Reading the approved refill

    When the clinician signs off, `encounter.completed` fires. The refill request on `Encounter.requested_treatments[]` is now `approved`, and its `treatments[0]` carries the same `treatment_id` with a **new** `current_prescription_id`.

    The example below is an excerpt of the `Encounter`, not the whole object:

    ```json
    {
      "id": "enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM",
      "status": "completed",
      "requested_treatments": [
        {
          "id": "rqt_test_01HXEN9Y8X7W6V5T4S3R2Q1P0N",
          "action": "refill",
          "treatment_id": "thr_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ",
          "catalog_treatment_id": "wegovy-auto-injector",
          "status": "approved",
          "treatments": [
            {
              "treatment_id": "thr_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ",
              "catalog_treatment_id": "wegovy-auto-injector",
              "dosage_id": "dose_test_01HXDS1A2B3C4D5E6F7G8H9JKM",
              "current_prescription_id": "rx_test_01HXEN2B3C4D5E6F7G8H9JKMNP",
              "refill_status": "not_eligible",
              "refill_due_at": null,
              "clinician_notes": null
            }
          ]
        }
      ]
    }
    ```

    The `treatment_id` matches the one you refilled; `current_prescription_id` is the new Rx. The line has already dropped out of `eligible`, and `refill_due_at` is null until the new prescription's order reaches the pharmacy — watch for `order.placed` to get the next date. Fetch the full `Prescription` from the [CarePlan](#tag/CarePlans) read. For the complete, always-current shape, see the **Approved — refill** example on [Retrieve an encounter](#tag/Encounters/operation/getEncounter).

    ## Errors

    | HTTP | `code` | Meaning | Fix |
    |---|---|---|---|
    | 422 | `encounter.treatment_not_refillable` | The `treatment_id` names a treatment that isn't `active` (e.g. already completed). | Re-fetch the plan; pass an `active` treatment's `treatment_id` from `treatments[]`. |
    | 422 | `encounter.treatment_change_pending` | The treatment already has a refill or switch in review (`refill_status: pending`). | Wait for the in-flight change to complete or cancel it before submitting another. |
    | 422 | `care_plan.not_encounterable` | The plan isn't `active` (or `pending_review`), so it can't take an encounter. | Check `status`; a refill needs an `active` plan. |
    | 422 | `intake_form.schema_invalid` | `intake_form.data` failed validation against your refill schema. | Inspect the `errors[]`; align the keys with the weight-management follow-up schema in [Intake Schemas](#tag/intake-schemas). |
