  "/v1/sandbox/inquiries/{inquiry_id}/messages":
    parameters:
    - name: inquiry_id
      in: path
      required: true
      description: Lithos inquiry ID.
      schema:
        type: string
        pattern: "^inq_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      summary: Post a staff reply (sandbox)
      tags:
      - Sandbox Inquiries
      operationId: sandboxInquiryReply
      description: 'Simulates the care team replying: appends a staff-authored message
        and hands the turn back to the patient (`awaiting` → `patient`).'
      parameters: []
      responses:
        '200':
          description: Reply posted; awaiting the patient
          content:
            application/json:
              examples:
                replied:
                  summary: Staff replied
                  value:
                    id: inq_test_00000000000000000000000001
                    patient_id: pat_test_00000000000000000000000001
                    subject: Injection site question
                    object: inquiry
                    status: open
                    awaiting: patient
                    references: []
                    created_at: '2026-04-30T10:15:00Z'
                    last_message_at: '2026-04-30T10:15:00Z'
                    messages:
                    - id: msg_test_00000000000000000000000001
                      body: Can I rotate injection sites?
                      created_at: '2026-04-30T10:15:00Z'
                      object: message
                      sender:
                        type: patient
                        id: pat_test_00000000000000000000000001
                        first_name: Avery
                        last_name: Chen
                      attachments: []
                    - id: msg_test_00000000000000000000000002
                      body: Yes — rotate sites each week. Let us know if it stays
                        sore.
                      created_at: '2026-04-30T10:15:00Z'
                      object: message
                      sender:
                        type: care_team
                        id: staff_test_00000000000000000000000001
                        first_name: Sam
                        last_name: Rivera
                        credentials:
                        profile_picture_url:
                      attachments: []
              schema:
                "$ref": "#/components/schemas/Inquiry"
        '422':
          description: Validation failure, or the inquiry is already resolved or closed
            (`inquiry.not_open`)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InquiryMessageCreate"
            examples:
              reply:
                summary: Care-team reply
