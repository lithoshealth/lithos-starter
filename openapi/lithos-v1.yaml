    post:
      summary: Book an appointment
      tags:
      - Appointments
      operationId: createEncounterAppointment
      x-internal: true
      description: 'Books the slot you hold as the encounter''s visit again after
        a no-show or a cancellation. The first visit is booked by creating the encounter
        with the hold''s `reservation_token` instead; this call also books a `sync`
        encounter created before that was required, which has none yet. The hold is
        consumed and the encounter''s `needs_appointment` turns `false`. The room
        is set up right after: `patient_join` reads `provisioning` until `appointment.scheduled`
        fires, but `patient_join.url` is already set in this response. Send an `Idempotency-Key`;
        a retry with the same key and body returns the first answer and books nothing
        twice.'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Create a key for each booking attempt (a UUID works), up to 255
          characters. Retry with the same key and body to get the first response.
          Reusing the key with a different body is refused. You can retry for 30 days
          after the first request. After that, Lithos treats the retry as a new request
          and refuses it because the hold has already been used.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '201':
          description: The appointment is booked
          content:
            application/json:
              example:
                id: appt_test_00000000000000000000000001
                encounter_id: enc_test_00000000000000000000000001
                status: scheduled
                starts_at: '2026-05-04T15:00:00Z'
                ends_at: '2026-05-04T15:15:00Z'
                canceled_by:
                reason:
