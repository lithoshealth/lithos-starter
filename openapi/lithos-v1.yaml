  "/v1/encounters/{encounter_id}/cancel":
    parameters:
    - name: encounter_id
      in: path
      required: true
      description: Lithos encounter ID.
      schema:
        type: string
        pattern: "^enc_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      summary: Cancel an encounter
      tags:
      - Encounters
      operationId: cancelEncounter
      description: Partner-driven cancellation. Only `pending_review` encounters may
        be canceled.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional. A key you generate for this request (a UUID works),
          up to 255 characters. Send the same key and body again and you get the same
          status and the same resource back, as it is now, with nothing created twice.
          The same key with a different body returns `409 idempotency_key.reused`.
          Keys are per organization and are kept for 30 days. See the Retrying requests
          guide.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '200':
          description: Encounter canceled
          content:
            application/json:
              example:
                id: enc_test_00000000000000000000000001
                patient_id: pat_test_00000000000000000000000001
                care_plan_id: cpl_test_00000000000000000000000001
                encounter_type: initial
                modality: async
                needs_appointment: false
                latest_appointment:
                status: canceled
                escalation_reason:
                created_at: '2026-04-30T10:15:00Z'
                updated_at: '2026-04-30T15:30:00Z'
                completed_at:
                canceled_at: '2026-04-30T15:30:00Z'
                intake_form:
                  id: itk_test_00000000000000000000000001
                  data:
                    allergies: sulfa
                    weight_lbs: 210
                    height_inches: 65
                    pregnancy_status: not_applicable
                care_plan:
                  status: pending_review
                  category: weight_management
                  clinician_notes:
                clinician:
                continuity_of_care:
                requested_treatments:
                - id: rqt_test_00000000000000000000000001
                  action: add
                  status: pending
                  treatment_id:
                  catalog_treatment_id: wegovy-weight-loss-22
                  treatments: []
                orders: []
                lab_requisitions: []
                patient_message:
              schema:
                "$ref": "#/components/schemas/Encounter"
        '409':
          description: The Idempotency-Key was already used for a different request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: Encounter is not pending_review
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/v1/patients/{patient_id}/inquiries":
    parameters:
    - name: patient_id
      in: path
      required: true
      description: Lithos patient ID.
      schema:
        type: string
        pattern: "^pat_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      summary: List a patient's inquiries
      tags:
      - Inquiries
      operationId: listPatientInquiries
      description: Cursor-paginated list of a patient's inquiries, newest first. Summaries
        only — fetch one inquiry for its message thread.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: Page size. Defaults to 25, maximum 100.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from the previous response's `pagination.next_cursor`.
      responses:
        '200':
          description: A page of inquiries
          content:
            application/json:
              example:
                data:
                - id: inq_test_00000000000000000000000001
                  patient_id: pat_test_00000000000000000000000001
                  subject: Injection site question
                  object: inquiry
                  status: open
                  awaiting: staff
                  references:
                  - type: encounter
                    id: enc_test_00000000000000000000000001
                  created_at: '2026-04-30T10:15:00Z'
                  last_message_at: '2026-04-30T10:15:00Z'
                pagination:
                  next_cursor:
                  has_more: false
              schema:
                "$ref": "#/components/schemas/InquiryListResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          description: Invalid query parameter (`limit` out of 1..100, a bad `cursor`,
            or an unknown parameter)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      summary: Open an inquiry
      tags:
      - Inquiries
      operationId: createInquiry
      description: Opens an inquiry on the patient's behalf with a first, patient-voiced
        message.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional. A key you generate for this request (a UUID works),
          up to 255 characters. Send the same key and body again and you get the same
          status and the same resource back, as it is now, with nothing created twice.
          The same key with a different body returns `409 idempotency_key.reused`.
          Keys are per organization and are kept for 30 days. See the Retrying requests
          guide.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '200':
          description: Inquiry opened
          content:
            application/json:
              example:
                id: inq_test_00000000000000000000000001
                patient_id: pat_test_00000000000000000000000001
                subject: Injection site question
                object: inquiry
                status: open
                awaiting: staff
                references: []
                created_at: '2026-04-30T10:15:00Z'
                last_message_at: '2026-04-30T10:15:00Z'
                messages:
                - id: msg_test_00000000000000000000000001
                  body: Can I rotate injection sites?
                  created_at: '2026-04-30T10:15:00Z'
                  object: message
                  sender:
                    type: patient
                    id: pat_test_00000000000000000000000001
                    first_name: Avery
                    last_name: Chen
                  attachments: []
              schema:
                "$ref": "#/components/schemas/Inquiry"
        '409':
          description: An upload in `message.attachments` was already redeemed (`upload.already_used`),
            or the Idempotency-Key was already used for a different request (`idempotency_key.reused`)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '410':
          description: An upload in `message.attachments` has expired (`upload.expired`
            or `upload.url_expired`)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: Validation failure, or an attachment or reference that is unknown
            or on another patient (`attachment.not_found`, `reference.invalid`, `upload.not_found`,
            `upload.invalid_checksum`)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InquiryCreate"
        required: true
