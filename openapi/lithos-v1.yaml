  appointment.no_show:
    post:
      tags:
      - Webhooks
      summary: appointment.no_show
      description: |-
        Fires when the visit did not happen because somebody was absent —
        normally once the organization's grace window past `starts_at` has run
        out, and also when an ops correction turns a visit previously reported
        as completed into a no-show. In that second case it can arrive at any
        time and bears no relation to the grace window; treat it as replacing
        the earlier `appointment.completed`.

        The clinician can also record a patient no-show before Lithos would
        record it on its own, once the visit has started, when they know the
        patient is not coming. It arrives then, with `status: patient_no_show`.

        One event for both sides. Fetch the appointment and read `status`:
        `patient_no_show` means the patient never joined, `clinician_no_show`
        means they did and the clinician did not. Your fee and rebooking policy
        will want to treat the two differently; the event does not, because what
        it asks of you is the same in both cases.

        `needs_appointment` is `true`. Offer the patient slots again and book
        with `POST /v1/encounters/{encounter_id}/appointments`, the same call you
        used the first time. The no-show stays in the encounter's appointment
        history.
      operationId: webhookAppointmentNoShow
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AppointmentNoShowEvent"
            examples:
              avery_chen_appointment_no_show:
                summary: Avery Chen never joined the room
                value:
                  id: evt_test_01HXEV9JKMNPQRSTVWXYZ1234A
                  type: appointment.no_show
                  created_at: '2026-09-10T15:10:04Z'
                  resource_id: appt_test_01HXEN1A2B3C4D5E6F7G8H9JKM
                  needs_appointment: true
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
