              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: Validation failure — the token cannot be read, the hold was
            taken for another patient or care plan, the encounter takes no appointment,
            the clinician the hold names is not licensed in the patient state (`clinician.not_licensed_in_state`),
            or the Idempotency-Key is missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
