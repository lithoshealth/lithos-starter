  "/v1/sandbox/test_clock":
    post:
      summary: Create test clock (sandbox)
      tags:
      - Sandbox Test Clocks
      operationId: sandboxCreateTestClock
      description: Creates this organization's simulated clock (one per org). `frozen_time`
        is the optional starting point; it defaults to now. Advance it to trigger
        time-based webhooks such as `care_plan.refill_due`.
      parameters: []
      responses:
        '201':
          description: Clock created
          content:
            application/json:
              examples:
                created:
                  summary: Created
                  value:
                    id: clk_test_00000000000000000000000001
                    frozen_time: '2026-06-19T10:15:00Z'
                    created_at: '2026-04-30T10:15:00Z'
                    updated_at: '2026-04-30T15:30:00Z'
              schema:
                "$ref": "#/components/schemas/SandboxTestClock"
        '409':
          description: The organization already has a test clock
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: "`frozen_time` is not a date-time, or the body has a field
            this does not take (`validation.failed`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                frozen_time:
                  type: string
                  format: date-time
                  description: Initial simulated time. ISO 8601 date-time with `Z`
                    or an offset, for example `2026-09-22T14:30:00Z`. Defaults to
                    now.
    get:
      summary: Get test clock (sandbox)
      tags:
      - Sandbox Test Clocks
      operationId: sandboxGetTestClock
      description: Returns the organization's current simulated clock.
      responses:
        '200':
          description: The current clock
          content:
            application/json:
              examples:
                current:
                  summary: Current
                  value:
                    id: clk_test_00000000000000000000000001
                    frozen_time: '2026-06-19T10:15:00Z'
                    created_at: '2026-04-30T10:15:00Z'
                    updated_at: '2026-04-30T15:30:00Z'
              schema:
                "$ref": "#/components/schemas/SandboxTestClock"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
    delete:
      summary: Delete test clock (sandbox)
      tags:
      - Sandbox Test Clocks
      operationId: sandboxDeleteTestClock
      description: 'Removes the clock; the organization reverts to the real wall clock.
        This does not undo what an advance already did: a treatment an advance made
        `eligible` stays `eligible` until the next daily sweep checks it again at
        the real time.'
      responses:
        '204':
          description: Clock deleted
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/v1/sandbox/test_clock/advance":
    post:
      summary: Advance test clock (sandbox)
      tags:
      - Sandbox Test Clocks
      operationId: sandboxAdvanceTestClock
      description: |
        Moves the clock forward to `to_time` (must be later than its current time) and sweeps
        this organization's time-driven state at the new time. No real timestamps are mutated —
        only the clock moves, and one organization's clock never affects another's.

        The sweeps run in the background, so this responds as soon as the clock has moved. Poll
        the affected resource until it changes rather than reading it once immediately after.

        Each advance, in order: refill eligibility (firing `care_plan.refill_due` for any line
        now due) and lab requisition expiry.

        Repeating an advance is safe — state a sweep has already reached is not reached twice,
        and each advance emits at most one webhook per affected resource.
      parameters: []
      responses:
        '200':
          description: Clock advanced
          content:
            application/json:
              examples:
                advanced:
                  summary: Advanced
                  value:
                    id: clk_test_00000000000000000000000001
                    frozen_time: '2026-08-03T10:15:00Z'
                    created_at: '2026-04-30T10:15:00Z'
                    updated_at: '2026-04-30T15:30:00Z'
              schema:
                "$ref": "#/components/schemas/SandboxTestClock"
        '422':
          description: "`to_time` is missing, is not a date-time, or is not later
            than the clock's current time (`validation.failed`). A test clock only
            moves forward"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - to_time
              properties:
                to_time:
                  type: string
                  format: date-time
                  description: New simulated time. ISO 8601 date-time with `Z` or
                    an offset, for example `2026-09-22T14:30:00Z`. Must be later than
                    the current `frozen_time`.
        required: true
  "/v1/slot_reservations":
    post:
      summary: Hold a slot
      tags:
      - Appointments
      operationId: createSlotReservation
      x-internal: true
      description: Holds the slot behind a `slot_token` while the patient finishes
        intake and payment. The hold lasts until `expires_at`; before then, send `reservation_token`
        with `POST /v1/encounters` to book the first visit, or to the booking or reschedule
        call for a later one, or release it. Holding a slot creates no appointment.
        If every clinician who could take the slot is booked, held, or too close to
        another visit to leave the turnaround their organization asks for, the response
        is `409 slot.taken` — fetch the slots again and offer another. A `slot_token`
        from `GET /v1/appointments/{appointment_id}/reschedule_slots` carries the
        visit it was issued to move, so there is nothing extra to send and the hold
        can only be spent on that move.
      parameters: []
      responses:
        '201':
          description: The slot is held
          content:
            application/json:
              example:
                id: rsv_test_00000000000000000000000001
                status: active
                patient_id: pat_test_00000000000000000000000001
                care_plan_id: cpl_test_00000000000000000000000001
                rescheduling_appointment_id:
                reservation_token: eyJyc3YiOiJyc3ZfdGVzdF8wMUhYUlMxQTJCM0M0RDVFNkY3RzhIOUpLTSIsIm9yZyI6Im9yZ190ZXN0XzAxSFgifQ--0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                clinician:
                  first_name: Maya
                  last_name: Patel
                  profile_picture_url:
                starts_at: '2026-05-04T15:00:00Z'
                duration_minutes: 15
                expires_at: '2026-04-30T10:30:00Z'
                extended_at:
                created_at: '2026-04-30T10:15:00Z'
                consumed_at:
                released_at:
                expired_at:
              schema:
                "$ref": "#/components/schemas/SlotReservation"
        '409':
          description: Every clinician for this slot is booked, held, or too close
            to another visit, or the visit this `slot_token` was issued to move is
            no longer scheduled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: Validation failure — the slot token has expired, cannot be
            read, or was offered for a patient in another state
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SlotReservationCreate"
        required: true
  "/v1/slot_reservations/{reservation_token}/release":
    parameters:
    - name: reservation_token
      in: path
      required: true
      description: The `reservation_token` returned when the slot was held.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+--[0-9a-f]+$"
    post:
      summary: Release a held slot
      tags:
      - Appointments
      operationId: releaseSlotReservation
      x-internal: true
      description: 'Gives the slot back so another patient can take it. Safe to repeat:
        a hold that is already released, expired, or consumed is returned as it is.'
      responses:
        '200':
          description: The hold, released
          content:
            application/json:
              example:
                id: rsv_test_00000000000000000000000001
                status: released
                patient_id: pat_test_00000000000000000000000001
                care_plan_id: cpl_test_00000000000000000000000001
                rescheduling_appointment_id:
                reservation_token: eyJyc3YiOiJyc3ZfdGVzdF8wMUhYUlMxQTJCM0M0RDVFNkY3RzhIOUpLTSIsIm9yZyI6Im9yZ190ZXN0XzAxSFgifQ--0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                clinician:
                  first_name: Maya
                  last_name: Patel
                  profile_picture_url:
                starts_at: '2026-05-04T15:00:00Z'
                duration_minutes: 15
                expires_at: '2026-04-30T10:30:00Z'
                extended_at:
                created_at: '2026-04-30T10:15:00Z'
                consumed_at:
                released_at: '2026-04-30T10:15:00Z'
                expired_at:
              schema:
                "$ref": "#/components/schemas/SlotReservation"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/v1/slot_reservations/{reservation_token}/extend":
    parameters:
    - name: reservation_token
      in: path
      required: true
      description: The `reservation_token` returned when the slot was held.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+--[0-9a-f]+$"
    post:
      summary: Extend a held slot
      tags:
      - Appointments
      operationId: extendSlotReservation
      x-internal: true
      description: Gives the hold one more hold time, counted from now, when payment
        or intake runs long. A hold can be extended once. The `reservation_token`
        stays the same; read the new `expires_at` from the response.
      responses:
        '200':
          description: The hold, extended
          content:
            application/json:
              example:
                id: rsv_test_00000000000000000000000001
                status: active
                patient_id: pat_test_00000000000000000000000001
                care_plan_id: cpl_test_00000000000000000000000001
                rescheduling_appointment_id:
                reservation_token: eyJyc3YiOiJyc3ZfdGVzdF8wMUhYUlMxQTJCM0M0RDVFNkY3RzhIOUpLTSIsIm9yZyI6Im9yZ190ZXN0XzAxSFgifQ--0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                clinician:
                  first_name: Maya
                  last_name: Patel
                  profile_picture_url:
                starts_at: '2026-05-04T15:00:00Z'
                duration_minutes: 15
                expires_at: '2026-04-30T10:30:00Z'
                extended_at: '2026-04-30T10:15:00Z'
                created_at: '2026-04-30T10:15:00Z'
                consumed_at:
                released_at:
                expired_at:
              schema:
                "$ref": "#/components/schemas/SlotReservation"
        '409':
          description: The hold is consumed, released or past `expires_at` (`slot_reservation.not_active`),
            or has already been extended (`slot_reservation.already_extended`)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/v1/uploads":
    post:
      summary: Create an upload slot
      tags:
      - Uploads
      operationId: createUpload
      description: 'Reserves a one-time-use upload slot and returns a presigned `upload_url`.
        PUT the file bytes there, then redeem the upload on the call that creates
        the resource: `upload_id` on `POST /v1/patients/{patient_id}/documents`, `insurance_card_front_image_upload_id`
        or `insurance_card_back_image_upload_id` on `POST /v1/insurances`, or an intake
        `*_upload_id` field on `POST /v1/encounters`.'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional. A key you generate for this request (a UUID works),
          up to 255 characters. Send the same key and body again and you get the same
          status and the same resource back, as it is now, with nothing created twice.
          The same key with a different body returns `409 idempotency_key.reused`.
          Keys are per organization and are kept for 30 days. See the Retrying requests
          guide.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '200':
          description: Upload slot created
          content:
            application/json:
              example:
                id: upl_test_00000000000000000000000001
                filename: insurance-card-front.jpg
                content_type: image/jpeg
                byte_size: 184320
                checksum: Sb4LC8nGWg8QWk0Uv4EuXQ==
                expires_at: '2026-05-07T10:15:00Z'
                upload_url_expires_at: '2026-04-30T11:15:00Z'
                created_at: '2026-04-30T10:15:00Z'
                object: upload
                upload_url: https://storage.googleapis.com/lithos-uploads/01HXUP1A2B3C4D5E6F7G8H9JKM?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=...&X-Goog-Date=20260430T180000Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=content-md5%3Bhost&X-Goog-Signature=...
                upload_headers:
                  Content-Type: image/jpeg
                  Content-MD5: Sb4LC8nGWg8QWk0Uv4EuXQ==
              schema:
                "$ref": "#/components/schemas/Upload"
        '409':
          description: The Idempotency-Key was already used for a different request,
            or the upload it reserved was already redeemed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '410':
          description: A retry with the same Idempotency-Key arrived after the upload
            URL closed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '413':
          description: Upload exceeds the maximum permitted size
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '415':
          description: Content type is not in the upload allowlist
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UploadCreate"
        required: true
  "/v1/webhook_deliveries":
    get:
      summary: List webhook deliveries
      tags:
      - Webhooks
      operationId: listWebhookDeliveries
      description: Cursor-paginated list of webhook delivery records for your organization,
        newest first. Supports filtering by `status`, `event_type`, `event_id`, `resource_id`,
        and `created_at` range. Fetch the detail endpoint for a row's captured response
        body.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: Page size. Defaults to 25, maximum 100.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from the previous response's `pagination.next_cursor`.
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - pending
            - delivering
            - succeeded
            - failed
            - exhausted
        description: 'Repeatable: `?status=failed&status=exhausted`.'
      - name: event_type
        in: query
        required: false
        schema:
          type: string
        description: Filter to deliveries for a specific event type (e.g. `encounter.completed`).
      - name: event_id
        in: query
        required: false
        schema:
          type: string
          pattern: "^evt_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
        description: Filter to the deliveries of one event. This is the event body's
          `id` and the `X-Lithos-Event-Id` header.
      - name: resource_id
        in: query
        required: false
        schema:
          type: string
        description: Filter to the deliveries of every event about one resource, for
          example an `enc_` encounter id.
      - name: created_at[gte]
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Inclusive lower bound on `created_at`. ISO 8601 date-time with
          `Z` or an offset, for example `2026-09-22T14:30:00Z`.
      - name: created_at[lt]
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Exclusive upper bound on `created_at`. ISO 8601 date-time with
          `Z` or an offset, for example `2026-09-22T14:30:00Z`.
      responses:
        '200':
          description: A page of webhook deliveries
          content:
            application/json:
              example:
                data:
                - id: whd_test_00000000000000000000000001
                  event_id: evt_test_00000000000000000000000001
                  status: succeeded
                  event_type: encounter.created
                  resource_id: enc_test_resource_1
                  data: {}
                  attempt_count: 1
                  last_response_code: 200
                  last_error_class:
                  occurred_at: '2026-04-30T10:15:00Z'
                  delivered_at: '2026-04-30T10:15:00Z'
                  last_attempted_at: '2026-04-30T10:15:00Z'
                  next_retry_at:
                  created_at: '2026-04-30T10:15:00Z'
                pagination:
                  next_cursor:
                  has_more: false
              schema:
                "$ref": "#/components/schemas/WebhookDeliveryListResponse"
        '422':
          description: A filter, `limit`, or `cursor` is invalid, or the query has
            an unknown parameter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/v1/webhook_deliveries/{webhook_delivery_id}":
    parameters:
    - name: webhook_delivery_id
      in: path
      required: true
      description: Lithos webhook delivery ID.
      schema:
        type: string
        pattern: "^whd_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
    get:
      summary: Get a webhook delivery
      tags:
      - Webhooks
      operationId: getWebhookDelivery
      description: Returns a single webhook delivery by Lithos ID. Includes `last_response_body_snippet`
        — the first 500 characters of your endpoint's response body on the last attempt,
        useful for debugging failures.
      responses:
        '200':
          description: The webhook delivery
          content:
            application/json:
              example:
                id: whd_test_00000000000000000000000001
                event_id: evt_test_00000000000000000000000001
                status: succeeded
                event_type: encounter.created
                resource_id: enc_test_resource_2
                data: {}
                attempt_count: 1
                last_response_code: 200
                last_error_class:
                occurred_at: '2026-04-30T10:15:00Z'
                delivered_at: '2026-04-30T10:15:00Z'
                last_attempted_at: '2026-04-30T10:15:00Z'
                next_retry_at:
                created_at: '2026-04-30T10:15:00Z'
                last_response_body_snippet:
              schema:
                "$ref": "#/components/schemas/WebhookDeliveryDetail"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/v1/webhook_endpoints":
    get:
      summary: List webhook endpoints
      tags:
      - Webhooks
      operationId: listWebhookEndpoints
      description: 'Lists every webhook endpoint your organization has registered,
        newest first, disabled ones included. At most one has `status: active`. The
        list is not paginated. Signing secrets are never returned.'
      responses:
        '200':
          description: Your organization's webhook endpoints
          content:
            application/json:
              example:
                data:
                - id: whe_test_00000000000000000000000001
                  url: https://partner-3.example.com/webhooks
                  status: active
                  last_success_at:
                  disabled_at:
                  created_at: '2026-04-30T10:15:00Z'
                  updated_at: '2026-04-30T15:30:00Z'
              schema:
                "$ref": "#/components/schemas/WebhookEndpointListResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
    post:
      summary: Create webhook endpoint
      tags:
      - Webhooks
      operationId: createWebhookEndpoint
      description: Registers a new HTTPS webhook endpoint for your organization. The
        signing secret is returned in this response — store it securely. The only
        other way to read it is a retry of this request with the same `Idempotency-Key`,
        while the key is kept and until the secret is rotated. Your organization may
        have at most one active endpoint at a time; a second create while one is active
        returns `409 webhook_endpoint.already_exists`.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional. A key you generate for this request (a UUID works),
          up to 255 characters. Send the same key and body again and you get the same
          status and the same resource back, as it is now, with nothing created twice.
          The same key with a different body returns `409 idempotency_key.reused`.
          Keys are per organization and are kept for 30 days. See the Retrying requests
          guide.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '201':
          description: Endpoint created — the response includes the signing secret
          content:
            application/json:
              example:
                id: whe_test_00000000000000000000000001
                url: https://verda.example.com/hooks
                status: active
                last_success_at:
                disabled_at:
                created_at: '2026-04-30T10:15:00Z'
                updated_at: '2026-04-30T15:30:00Z'
                signing_secret: whsec_abcdefghijklmnopqrstuvwxyz0123456789ABCDEF
              schema:
                "$ref": "#/components/schemas/WebhookEndpointCreateResponse"
        '409':
          description: An active endpoint already exists for your organization, or
            the Idempotency-Key was already used for a different request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: The URL is not https, is not on port 443, does not resolve,
            or resolves to a private address
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WebhookEndpointCreate"
        required: true
  "/v1/webhook_endpoints/{id}/test":
    parameters:
    - name: id
      in: path
      required: true
      description: Lithos webhook endpoint ID.
      schema:
        type: string
        pattern: "^whe_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      summary: Send a test event
      tags:
      - Webhooks
      operationId: testWebhookEndpoint
      x-internal: true
      description: Enqueues a `webhook.test` delivery to the endpoint and returns
        the delivery record immediately in `pending` state. The delivery is processed
        asynchronously — poll `GET /v1/webhook_deliveries/:id` to track its outcome.
      responses:
        '202':
          description: Test delivery enqueued
          content:
            application/json:
              example:
                id: whd_test_00000000000000000000000001
                event_id: evt_test_00000000000000000000000001
                status: pending
                event_type: webhook.test
                resource_id: whe_test_00000000000000000000000001
                data: {}
                attempt_count: 0
                last_response_code:
                last_error_class:
                occurred_at: '2026-04-30T10:15:00Z'
                delivered_at:
                last_attempted_at:
                next_retry_at:
                created_at: '2026-04-30T10:15:00Z'
              schema:
                "$ref": "#/components/schemas/WebhookDelivery"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/v1/webhook_endpoints/{id}/disable":
    parameters:
    - name: id
      in: path
      required: true
      description: Lithos webhook endpoint ID.
      schema:
        type: string
        pattern: "^whe_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
    post:
      summary: Disable a webhook endpoint
      tags:
      - Webhooks
      operationId: disableWebhookEndpoint
      description: 'Disables the endpoint so it stops receiving webhook deliveries.
        One-way and idempotent — disabling an already-disabled endpoint returns it
        unchanged. Every delivery still waiting on the endpoint becomes `exhausted`
        with `last_error_class: endpoint_disabled`; a new endpoint does not receive
        them. To resume deliveries, create a new endpoint.'
      responses:
        '200':
          description: Endpoint disabled
          content:
            application/json:
              example:
                id: whe_test_00000000000000000000000001
                url: https://partner-6.example.com/webhooks
                status: disabled
                last_success_at:
                disabled_at: '2026-04-30T10:15:00Z'
                created_at: '2026-04-30T10:15:00Z'
                updated_at: '2026-04-30T15:30:00Z'
              schema:
                "$ref": "#/components/schemas/WebhookEndpoint"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
webhooks:
  encounter.created:
    post:
      tags:
      - Webhooks
      summary: encounter.created
      description: |-
        Fires when a partner submits a new encounter via `POST /v1/encounters`.
        The encounter starts in `pending_review` and is queued for clinician
        pickup. Read `resource_id` and call
        `GET /v1/encounters/{resource_id}` for the current shape. Acknowledge with any 2xx within 10 seconds;
        Lithos retries failed deliveries with exponential backoff for 72
        hours.
      operationId: webhookEncounterCreated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncounterCreatedEvent"
            examples:
              avery_chen_initial:
                summary: New initial encounter for Avery Chen
                value:
                  id: evt_test_01HXEV1A2B3C4D5E6F7G8H9JKM
                  type: encounter.created
                  created_at: '2026-04-29T18:02:11Z'
                  resource_id: enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
  encounter.in_review:
    post:
      tags:
      - Webhooks
      summary: encounter.in_review
      description: |-
        Fires when a clinician picks up the encounter and begins review,
        and again when an escalated encounter returns to review. The
        transition is server-driven; partners do not initiate it.
      operationId: webhookEncounterInReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncounterInReviewEvent"
            examples:
              avery_chen_in_review:
                summary: Avery Chen's encounter picked up by a clinician
                value:
                  id: evt_test_01HXEV2B3C4D5E6F7G8H9JKMNP
                  type: encounter.in_review
                  created_at: '2026-04-30T09:14:00Z'
                  resource_id: enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
  encounter.escalated:
    post:
      tags:
      - Webhooks
      summary: encounter.escalated
      description: |-
        Fires when an encounter is paused. Fetch the encounter and
        read `escalation_reason`: `patient_information_required` means
        prompt the patient for the missing details. Resolving or closing
        that inquiry returns the encounter to `in_review`, and
        `encounter.in_review` fires whenever it returns.
      operationId: webhookEncounterEscalated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncounterEscalatedEvent"
            examples:
              avery_chen_escalated:
                summary: Avery Chen's encounter paused for patient information
                value:
                  id: evt_test_01HXEV3C4D5E6F7G8H9JKMNPQR
                  type: encounter.escalated
                  created_at: '2026-04-30T10:22:18Z'
                  resource_id: enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
  encounter.completed:
    post:
      tags:
      - Webhooks
      summary: encounter.completed
      description: |-
        Fires when a clinician completes (signs off) an encounter. After
        receipt, fetch the encounter to discover the orders and prescriptions
        that were created — `GET /v1/encounters/{encounter_id}` returns
        the populated `orders[]` (each with embedded `prescriptions[]`).
      operationId: webhookEncounterCompleted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncounterCompletedEvent"
            examples:
              avery_chen_completed:
                summary: Avery Chen's encounter completed
                value:
                  id: evt_test_01HXEV4D5E6F7G8H9JKMNPQRST
                  type: encounter.completed
                  created_at: '2026-04-30T15:00:30Z'
                  resource_id: enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
  encounter.canceled:
    post:
      tags:
      - Webhooks
      summary: encounter.canceled
      description: |-
        Fires when a partner cancels an encounter via
        `POST /v1/encounters/{id}/cancel`. Terminal — no orders or
        prescriptions are created.
      operationId: webhookEncounterCanceled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EncounterCanceledEvent"
            examples:
              avery_chen_canceled:
                summary: Partner canceled the encounter
                value:
                  id: evt_test_01HXEV6F7G8H9JKMNPQRSTVWXY
                  type: encounter.canceled
                  created_at: '2026-04-30T08:05:00Z'
                  resource_id: enc_test_01HXEN1A2B3C4D5E6F7G8H9JKM
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
  care_plan.active:
    post:
      tags:
      - Webhooks
      summary: care_plan.active
      description: |-
        Fires when a CarePlan moves to `active` — the clinician
        marked the plan eligible when signing off on the first
        encounter. Fetch the plan to read the `treatments[]` it
        now has.
      operationId: webhookCarePlanActive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CarePlanActiveEvent"
            examples:
              avery_chen_plan_active:
                summary: Avery Chen's plan went active
                value:
                  id: evt_test_01HXEVCP1A2B3C4D5E6F7G8H9J
                  type: care_plan.active
                  created_at: '2026-04-30T15:00:30Z'
                  resource_id: cpl_test_01HXCP1A2B3C4D5E6F7G8H9JKM
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
  care_plan.ineligible:
    post:
      tags:
      - Webhooks
      summary: care_plan.ineligible
      description: |-
        Fires when a CarePlan moves to `ineligible` — the clinician
        marked it ineligible at sign-off. Read `ineligibility_reason_code`
        (coded) and `clinician_notes` (free text) on the plan for the
        reason. Terminal.
      operationId: webhookCarePlanIneligible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CarePlanIneligibleEvent"
            examples:
              plan_terminated:
                summary: Plan terminated after clinical decline
                value:
                  id: evt_test_01HXEVCP2K3M4N5P6Q7R8S9TVW
                  type: care_plan.ineligible
                  created_at: '2026-04-30T11:04:18Z'
                  resource_id: cpl_test_01HXCP9Y8X7W6V5T4S3R2Q1P0N
      responses:
        '200':
          description: Delivery acknowledged. Any 2xx counts.
  care_plan.refill_due:
    post:
      tags:
      - Webhooks
      summary: care_plan.refill_due
      description: |-
        Fires when a treatment on the plan is due for a refill.
        Read the plan for the entries with `refill_status:
        eligible`, then prompt the patient. Fires at most once per (plan, treatment, day),
        so a plan with two treatments flipping on the same day
        emits two events with the same `type` and `resource_id` —
        dedupe on the event `id`, not on `(type, resource_id)`.
      operationId: webhookCarePlanRefillDue
      requestBody:
        required: true
        content:
          application/json:
            schema:
