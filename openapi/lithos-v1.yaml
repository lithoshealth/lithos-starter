      properties:
        appointment:
          "$ref": "#/components/schemas/AppointmentJoin"
        organization:
          "$ref": "#/components/schemas/OrganizationBranding"
    SlotReservationCreate:
      type: object
      required:
      - slot_token
      - patient_id
      - care_plan_id
      additionalProperties: false
      description: Request body for holding a slot.
      properties:
        slot_token:
          type: string
          description: 'The `slot_token` of the slot the patient chose. Tokens are
            short-lived: one past its expiry is rejected with `422 slot_token.expired`,
            and you fetch the slots again.'
          example: c2xvdF90b2tlbi1leGFtcGxl--0123456789abcdef--MDEyMzQ1Njc4OWFiY2RlZg
        patient_id:
          type: string
          description: The patient the visit is for. Must be in the state the slot
            was offered for.
          pattern: "^pat_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
          example: pat_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ
        care_plan_id:
          type: string
          description: The care plan the visit is for. Must belong to `patient_id`.
          pattern: "^cpl_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
          example: cpl_test_01HXEN1A2B3C4D5E6F7G8H9JKM
    SlotReservation:
      type: object
      required:
      - id
      - status
      - patient_id
      - care_plan_id
      - reservation_token
      - clinician
      - rescheduling_appointment_id
      - starts_at
      - duration_minutes
      - expires_at
      - extended_at
      - created_at
      - consumed_at
      - released_at
      - expired_at
      description: 'A hold on a slot while the patient finishes intake and payment.
        Holding a slot books nothing: the appointment is created when you book against
        `reservation_token`, and booking keeps the clinician this hold names.'
      properties:
        id:
          type: string
          description: Lithos reservation identifier. Sandbox IDs include `_test_`.
          pattern: "^rsv_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
          example: rsv_test_01HXRS1A2B3C4D5E6F7G8H9JKM
        status:
          type: string
          description: Where the hold is. `active` — the slot is yours until `expires_at`.
            `consumed` — you booked against it. `released` — you gave it back. `expired`
            — `expires_at` passed before you booked; fetch the slots again.
          enum:
          - active
          - consumed
          - released
          - expired
          example: active
        patient_id:
          type: string
          pattern: "^pat_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
          example: pat_test_01HX9N4K8RBGFYPQ7T2VDSCMWZ
        care_plan_id:
          type: string
          pattern: "^cpl_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
          example: cpl_test_01HXEN1A2B3C4D5E6F7G8H9JKM
        rescheduling_appointment_id:
          type:
          - string
          - 'null'
          description: 'Set when the `slot_token` came from `GET /v1/appointments/{appointment_id}/reschedule_slots`:
            the visit this hold may be spent moving, and the only one. Booking it
            against anything else answers `422 slot_reservation.rescheduling_mismatch`.'
          pattern: "^appt_(test_)?[0-9A-HJKMNP-TV-Z]{26}$"
          example: appt_test_01HXAP1A2B3C4D5E6F7G8H9JKM
        reservation_token:
          type: string
          description: Your handle on the hold. Pass it to release the slot, and to
            book the appointment. Opaque; store it as returned.
          example: eyJyc3YiOiJyc3ZfdGVzdF8wMUhYUlMxQTJCM0M0RDVFNkY3RzhIOUpLTSJ9--0123456789abcdef
        clinician:
          allOf:
          - "$ref": "#/components/schemas/ClinicianSummary"
          description: 'The clinician the slot is held with. One person: the hold
            is where a start backed by several free clinicians becomes a visit with
            one of them, and booking carries the same person across unchanged.'
        starts_at:
          type: string
          format: date-time
          description: When the held visit would start (ISO-8601 UTC).
          example: '2026-05-04T15:00:00Z'
        duration_minutes:
          type: integer
          description: How long the visit runs.
          example: 15
        expires_at:
          type: string
          format: date-time
          description: When the hold lapses if you have not booked. Your organization's
            reservation window past `created_at`, or past `extended_at` once you extend
            the hold.
          example: '2026-04-30T10:30:00Z'
        extended_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When you extended the hold. A hold can be extended once; `null`
            until then.
          example:
        created_at:
          type: string
          format: date-time
          example: '2026-04-30T10:15:00Z'
        consumed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When you booked against the hold (status `consumed`). `null`
            otherwise.
          example:
        released_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When you released the hold (status `released`). `null` otherwise.
          example:
        expired_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the hold lapsed (status `expired`). `null` otherwise.
          example:
    TokenRequest:
      type: object
      required:
      - grant_type
      - client_id
      - client_secret
      description: OAuth 2.0 client-credentials token request, `application/x-www-form-urlencoded`.
      properties:
        grant_type:
          type: string
          enum:
          - client_credentials
          example: client_credentials
        client_id:
          type: string
          example: client_01HXAUTH000000000000000000
        client_secret:
          type: string
          example: sk_test_...
    TokenResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      description: OAuth 2.0 token response, mirrored verbatim from the identity provider.
      properties:
        access_token:
          type: string
          description: The signed JWT bearer token.
        token_type:
          type: string
          description: Always `bearer` today. Compare it case-insensitively.
          example: bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds.
          example: 3600
    TokenError:
      type: object
      required:
      - error
      description: A standard OAuth 2.0 error (RFC 6749 section 5.2), passed through
        from the identity provider. The token endpoint returns this instead of the
        `ErrorResponse` envelope for a `400` or `401`.
      properties:
        error:
          type: string
          description: OAuth 2.0 error code. `invalid_client` means the `client_id`
            or `client_secret` is wrong or missing; `unsupported_grant_type` means
            `grant_type` isn't `client_credentials`.
          example: invalid_client
        error_description:
          type: string
          description: Human-readable explanation. Informational — never branch on
            it.
          example: Application not found.
