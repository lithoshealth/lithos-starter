                completed_at:
                patient_no_show_at:
                clinician_no_show_at:
                canceled_at:
                cancellation_closes_at: '2026-05-04T11:00:00Z'
                cancelable: true
                progress: not_started
                clinician:
                  first_name: Maya
                  last_name: Patel
                  profile_picture_url:
                patient_join:
                  status: provisioning
                  opens_at:
                  closes_at:
                  url: https://join.example.com/j/jt_test
              schema:
                "$ref": "#/components/schemas/Appointment"
        '409':
          description: The encounter already has a scheduled appointment, the hold
            is no longer active, or the Idempotency-Key was already used for a different
            request
